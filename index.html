/* =====================================================================
   MÓDULO 3 — PRECIOS DE REPUESTOS (USD → $ con la cotización del mes)
   ===================================================================== */
const MODELOS = ['750', '933', '1316'];

function Repuestos() {
  const s = useS();
  const caja = useRef(null);            // la caja que se desplaza de costado
  const [busca, setBusca] = useState('');
  const [editando, setEditando] = useState(null);
  /* la celda de precio que se está tocando ahora mismo: "12|933" */
  const [celda, setCelda] = useState(null);
  const [guardandoCelda, setGuardandoCelda] = useState(false);
  const [cot, setCot] = useState(s.config.cotizacion_usd);
  const [mes, setMes] = useState(s.config.mes_cotizacion || '');
  const [presu, setPresu] = useState([]);
  const [verPresu, setVerPresu] = useState(false);
  const [elegidos, setElegidos] = useState([]);       // ids marcados para imprimir
  const [modoImpresion, setModoImpresion] = useState(null);  // null | 'todos' | 'elegidos'
  const editable = puedePrecios();
  const editaCot = puedeCotizacion();
  const iva = Number(s.config.iva) || 21;

  useEffect(() => { setCot(s.config.cotizacion_usd); setMes(s.config.mes_cotizacion || ''); },
    [s.config.cotizacion_usd, s.config.mes_cotizacion]);

  const lista = useMemo(() => {
    const f = sinAcentos(busca);
    return s.repuestos.filter(r => r.activo !== false)
      .filter(r => !f || sinAcentos(r.elemento).includes(f));
  }, [s.repuestos, busca]);

  async function guardarCotizacion() {
    const db = cliente();
    const r = await actualizarYComprobar('config', 1,
      { cotizacion_usd: cot, mes_cotizacion: mes, actualizado_en: new Date().toISOString() });
    if (!r.ok) return toast(r.msg, 'error');
    await db.from('cotizaciones').insert({ valor: cot, nota: mes });
    set({ config: { ...S.config, cotizacion_usd: cot, mes_cotizacion: mes } });
    toast('Cotización actualizada: todos los precios en pesos se recalcularon', 'ok');
  }

  const ars = (u) => (Number(u) || 0) * Number(s.config.cotizacion_usd || 0);
  const marcado = id => elegidos.includes(id);
  const marcar = (id, si) => setElegidos(l => si ? [...l, id] : l.filter(x => x !== id));
  const paraImprimir = modoImpresion === 'elegidos'
    ? lista.filter(r => marcado(r.id)) : lista;

  /* ---------------------------------------------------------------------
     CAMBIAR UN PRECIO SIN ABRIR NADA
     El precio en dólares se toca directamente en la celda: se hace clic,
     se escribe y se sale. Es lo que más se hace en esta pantalla —cada
     mes cambian varios— y no tiene sentido abrir una ventana para cada
     uno. El resto de la ficha (nombre, nota, activo) sigue estando en el
     lápiz de la derecha.
     --------------------------------------------------------------------- */
  async function guardarPrecio(r, modelo, valor) {
    setCelda(null);
    const limpio = String(valor).replace(',', '.').trim();
    const nuevo = limpio === '' ? null : Number(limpio);
    if (nuevo !== null && !Number.isFinite(nuevo)) return toast('Ese no es un número', 'error');
    if (Number(r['usd_' + modelo] ?? null) === Number(nuevo ?? null)
        && (r['usd_' + modelo] == null) === (nuevo == null)) return;   // no cambió nada
    setGuardandoCelda(true);
    const res = await actualizarYComprobar('repuestos', r.id, { ['usd_' + modelo]: nuevo });
    setGuardandoCelda(false);
    if (!res.ok) return toast(res.msg, 'error');
    set({ repuestos: S.repuestos.map(x => x.id === r.id ? { ...x, ...res.fila } : x) });
    toast(`${r.elemento} · modelo ${modelo}: ${nuevo === null ? 'sin precio' : usd(nuevo)}`, 'ok');
  }

  function imprimir(modo) {
    if (modo === 'elegidos' && !elegidos.length) {
      return toast('Marcá al menos un repuesto para imprimir', 'error');
    }
    setModoImpresion(modo);
    /* La hoja vuelve a la normalidad cuando se cierra el cuadro de impresión,
       no a los tantos milisegundos: así, si la persona se queda mirando la
       vista previa, no se le desarma la hoja por debajo. El temporizador es
       por si el navegador no avisa que terminó. */
    const volver = () => { setModoImpresion(null); window.removeEventListener('afterprint', volver); };
    window.addEventListener('afterprint', volver);
    setTimeout(() => { window.print(); setTimeout(volver, 4000); }, 120);
  }
  const totalPresu = presu.reduce((a, l) => a + ars(l.usd) * l.cant, 0);

  const cols = [
    { rot: 'Elemento', val: r => r.elemento },
    { rot: 'U$D modelo 750', val: r => r.usd_750 }, { rot: 'U$D modelo 933', val: r => r.usd_933 },
    { rot: 'U$D modelo 1316', val: r => r.usd_1316 },
    { rot: '$ modelo 750', val: r => Math.round(ars(r.usd_750)) },
    { rot: '$ modelo 933', val: r => Math.round(ars(r.usd_933)) },
    { rot: '$ modelo 1316', val: r => Math.round(ars(r.usd_1316)) },
    { rot: 'Nota', val: r => r.nota },
  ];

  return html`<div>
    <div class="panel no-imprimir" style="margin-bottom:10px">
      <div class="panel-cab">
        <h2>Precios de repuestos</h2>
        <span class="mini">750, 933 y 1316 son los modelos de elevador. Los valores en pesos se calculan
          solos (USD × cotización) y no incluyen IVA (${iva}%).</span>
        <div style="margin-left:auto" class="fila">
          <input style="width:180px" placeholder="Buscar repuesto…" value=${busca}
            onInput=${e => setBusca(e.target.value)} />
          <button class="btn sec chico" onClick=${() => bajarCSV('precios_repuestos', cols, lista)}>Exportar</button>
          <button class="btn sec chico" onClick=${() => imprimir('todos')}>Imprimir lista completa</button>
          <button class=${'btn chico ' + (elegidos.length ? '' : 'sec')}
            title="Imprime sólo los repuestos marcados, con la aclaración de responsabilidad"
            onClick=${() => imprimir('elegidos')}>
            Imprimir seleccionados${elegidos.length ? ` (${elegidos.length})` : ''}</button>
          ${elegidos.length > 0 && html`<button class="btn sec chico"
            onClick=${() => setElegidos([])}>Desmarcar</button>`}
          ${editable && html`<button class="btn chico" onClick=${() => setEditando({ nuevo: true, activo: true })}>+ Repuesto</button>`}
        </div>
      </div>

function EditarRepuesto({ r, alCerrar }) {
  const [b, setB] = useState({ ...r });
  const c = (k, v) => setB(x => ({ ...x, [k]: v }));
  async function guardar() {
    const db = cliente();
    const cuerpo = { elemento: b.elemento, usd_750: b.usd_750, usd_933: b.usd_933,
                     usd_1316: b.usd_1316, nota: b.nota, activo: b.activo !== false };
    if (b.nuevo) {
      const { data, error } = await db.from('repuestos')
        .insert({ ...cuerpo, orden: (S.repuestos.length + 1) * 10 }).select('*').single();
      if (error) return toast('No se pudo crear: ' + error.message, 'error');
      set({ repuestos: [...S.repuestos, data].sort((x, y) => x.elemento.localeCompare(y.elemento, 'es')) });
    } else {
      const r = await actualizarYComprobar('repuestos', b.id, cuerpo);
      if (!r.ok) return toast(r.msg, 'error');
      set({ repuestos: S.repuestos.map(x => x.id === b.id ? { ...x, ...r.fila } : x) });
    }
    toast('Repuesto guardado', 'ok');
    alCerrar();

  return html`<${Modal} titulo=${b.nuevo ? 'Nuevo repuesto' : 'Editar repuesto'} alCerrar=${alCerrar}>

      <button class="btn sec" onClick=${alCerrar}>Cancelar</button>
      <button class="btn" onClick=${guardar}>Guardar</button>

  <//>`;

/* ---------------------------------------------------------------------
   EN QUÉ ANDA CADA CASO
   La foto de arriba de todo: cuántos casos están en curso, cuántos
   esperando el cobro, cuántos cumplidos sin cerrar, cuántos cerrados y
   cuántos cancelados. Cada trabajo cuenta una sola vez, así que las
   partes suman el total y el gráfico se puede leer sin explicación.
   Lo ve tanto Cobranzas como Carga; los importes, sólo Cobranzas.
   --------------------------------------------------------------------- */
function SituacionCasos({ trabajos, verMontos, periodo }) {
  const cuentas = useMemo(() => {
    const m = new Map(SITUACIONES.map(k => [k, { casos: 0, monto: 0 }]));
    for (const t of trabajos) {
      const x = m.get(situacionDelCaso(t));
      if (!x) continue;
      x.casos++; x.monto += Number(t.precio_sin_iva) || 0;
    }
    return m;
  }, [trabajos]);

  const total = trabajos.length || 1;
  /* con un decimal cuando la parte es chica: si no, tres situaciones distintas
     se muestran todas como "1%" y el número deja de decir nada */
  const pct = n => { const v = n / total * 100;
    return (v >= 10 || v === 0 ? Math.round(v) : v.toFixed(1)) + '%'; };
  /* el color de cada situación es siempre el mismo, esté donde esté */
  const TONO = { 'En curso': 0, 'Pendiente de cobro': 3, 'Abierto': 1,
                 'Cerrado': 2, 'Cancelado': null };

  return html`<div class="panel grafico situacion no-imprimir" style="margin-bottom:10px">
    <div class="panel-cab"><h2>En qué anda cada caso</h2>
      <span class="mini">${periodo}${' '}· cada trabajo cuenta una sola vez</span></div>
    <div class="panel-cuerpo">
      <${Apilada} titulo="" fijo=${true}
        tonos=${SITUACIONES.map(k => TONO[k])}
        datos=${SITUACIONES.map(k => [k, cuentas.get(k).casos])} />
      <div class="casos">
        ${SITUACIONES.map(k => html`<div class=${'caso c-' + COLOR_SITUACION[k]} key=${k}>
          <div class="rot">${k}</div>
          <div class="val">${numAR(cuentas.get(k).casos)}</div>
          <div class="mini">${pct(cuentas.get(k).casos)} de ${numAR(trabajos.length)}
            ${verMontos && cuentas.get(k).monto > 0
              ? html`<br />${plata(cuentas.get(k).monto)}` : ''}</div>
        </div>`)}
      </div>
    </div>
  </div>`;
}

/* Campo de texto/número editable dentro de una fila de la grilla: guarda
   recién al salir del campo (blur), no en cada tecla -- si guardara con
   cada letra, completar una observación larga dispararía decenas de
   escrituras a la base. Si el valor cambia desde afuera (otra persona lo
   editó, o se refrescó el dato) y el campo no se está editando en este
   momento, se actualiza solo. */
function CampoGrilla({ valor, onGuardar, ancho, titulo, area, numero, placeholder }) {
  const [crudo, setCrudo] = useState(null);
  const mostrado = crudo !== null ? crudo : (valor === null || valor === undefined ? '' : valor);
  const guardar = () => {
    if (crudo === null) return;
    const v = crudo;
    setCrudo(null);
    const actual = valor === null || valor === undefined ? '' : String(valor);
    if (v === actual) return;
    if (numero) {
      const n = Number(String(v).replace(',', '.'));
      onGuardar(v.trim() === '' || Number.isNaN(n) ? null : n);
    } else {
      onGuardar(v.trim() === '' ? null : v);
    }
  };
  const props = {
    value: mostrado, title: titulo || '', style: `width:${ancho || 160}px`, placeholder: placeholder || '',
    onInput: e => setCrudo(e.target.value), onBlur: guardar,
  };
  return area ? html`<textarea ...${props} rows="1" />`
              : html`<input type="text" ...${props} />`;
}

function Cobranza() {
  const s = useS();
  const [vista, setVista] = useState('a_cobrar');  // a_cobrar | facturado_en_curso | sin_cerrar | todo | todos_registros
  const [busca, setBusca] = useState('');
  const [anio, setAnio] = useState('');
  const [mes, setMes] = useState('');
  const [fichaId, setFichaId] = useState(null);
  const [tope, setTope] = useState(400);
  const [verLeyenda, setVerLeyenda] = useState(false);
  useEffect(() => { setTope(400); }, [vista, busca, anio, mes]);
  /* El caso desde el que se llegó por "Abrir este trabajo en Cobranza →" (en
     el Registro de Service) queda resaltado en la grilla, no sólo abierto en
     la ficha: así no se pierde de vista entre el resto de los registros. Se
     desmarca solo apenas se cambia de vista o de búsqueda a propósito. */
  const [destacado, setDestacado] = useState(null);
  const filaDestacadaRef = useRef(null);
  const caja = useRef(null);            // la caja que se desplaza de costado
  useEffect(() => {
    if (destacado && filaDestacadaRef.current) {
      filaDestacadaRef.current.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }, [destacado]);
  /* Selección de casos para armar la tabla que se manda a facturar. No se
     limpia sola al cambiar de vista o de búsqueda: la idea es poder ir
     buscando distintos clientes o pasando de una vista a otra y sumando
     casos a una misma tanda, sin perder lo ya marcado. */
  const [seleccion, setSeleccion] = useState(() => new Set());
  const [verFacturar, setVerFacturar] = useState(false);
  const alternarSeleccion = id => setSeleccion(s2 => {
    const n = new Set(s2);
    n.has(id) ? n.delete(id) : n.add(id);
    return n;
  });
  const seleccionados = useMemo(() => s.trabajos.filter(t => seleccion.has(t.id)), [s.trabajos, seleccion]);

  /* Si se llegó acá desde la ficha de un trabajo ("Abrir este trabajo en
     Cobranza →"), se abre directamente en "Cumplidos sin cerrar" -- el
     apartado donde se sigue el cierre de un caso -- con el cliente ya
     escrito en el buscador, para ver de una todo lo que le falta cerrar
     a ese cliente. La ficha del trabajo puntual se abre igual encima,
     así que aparece aunque ese caso en particular ya no esté abierto. */
  useEffect(() => {
    if (!s.irACobranza) return;
    const t = S.trabajos.find(x => String(x.id) === String(s.irACobranza));
    set({ irACobranza: null });
    if (!t) return;
    setVista('sin_cerrar'); setBusca(t.cliente_nombre || t.n_llamada || ''); setAnio(''); setMes('');
    setFichaId(t.id);
    setDestacado(t.id);
  }, [s.irACobranza]);
  const [orden, setOrden] = useState({ campo: 'fecha_factura', asc: true });
  const editable = puedeCobranza();
  /* Carga (Mateo) entra para seguir en qué anda cada caso, pero sin ver plata */
  const verMontos = puedeMontos();

  /* Un trabajo entra en cobranza apenas la facturación queda EN CURSO o SI,
     y recién sale cuando se cobra, se cancela (efectivo) o se marca no aplica. */
  const CERRADO_COBRO = ['SI', 'CANCELADO', 'NO APLICA', 'INCOBRABLE', 'VERDEJO'];
  const enCirculo = t => !cobradoEnMano(t)
    && (['EN CURSO', 'SI'].includes(t.facturado) || t.factura_solicitada
        || Number(t.precio_sin_iva) > 0);

  /* "Pendiente de facturar" se sacó: en la práctica nunca marcaba ningún caso
     aparte, y lo que pretendía mostrar ya lo cubre "Cumplidos sin cerrar". En
     su lugar queda esta vista, más puntual: lo que YA se mandó a facturar
     (facturado EN CURSO) pero todavía no está cobrado ni tiene fecha de pago. */
  const base = useMemo(() => s.trabajos.filter(t => {
    if (vista === 'sin_cerrar') return estaAbierto(t) && !cobradoEnMano(t);
    if (vista === 'a_cobrar') return enCirculo(t) && !CERRADO_COBRO.includes(t.cobrado);
    if (vista === 'facturado_en_curso') return t.facturado === 'EN CURSO'
      && !CERRADO_COBRO.includes(t.cobrado) && !t.fecha_pago;
    if (vista === 'todos_registros') return true;
    return enCirculo(t);
  }), [s.trabajos, vista]);

  const filtrados = useMemo(() => {
    const f = sinAcentos(busca);
    return ordenar(base.filter(t => {
      const ref = String(t.fecha_factura || t.fecha_visita || '');
      if (anio && ref.slice(0, 4) !== anio) return false;
      if (mes && ref.slice(5, 7) !== mes) return false;
      return !f || sinAcentos([t.cliente_nombre, t.n_serie, t.concepto, t.n_llamada, t.cliente_cuit,
        t.cliente_correo, t.obs_cobranza].join(' ')).includes(f);
    }), orden);
  }, [base, busca, anio, mes, orden]);

  const anios = useMemo(() => [...new Set(s.trabajos
    .map(t => String(t.fecha_factura || t.fecha_visita || '').slice(0, 4))
    .filter(Boolean))].sort().reverse(), [s.trabajos]);
  const MESES_OPC = MESES.map((m, i) => ({ v: String(i + 1).padStart(2, '0'), r: m }));

  const total = filtrados.reduce((a, t) => a + (Number(t.precio_sin_iva) || 0), 0);
  const totalConIva = filtrados.reduce((a, t) => a + (Number(t.precio_sin_iva) || 0) * (1 + ivaDe(t) / 100), 0);
  const dias = t => {
    const ref = t.fecha_factura || t.fecha_visita;
    if (!ref) return null;
    return Math.round((Date.now() - new Date(ref + 'T12:00:00')) / 86400000);
  };

  async function cambiar(t, campos, aviso) {
    try {
      const r = await actualizarTrabajo(t.id, campos, t.actualizado_en);
      toast(r.enCola ? 'Sin conexión: se guardó acá y se sube cuando vuelva internet'
        : (aviso || 'Guardado'), r.enCola ? '' : 'ok');
    } catch (e) {
      if (e.conflicto) { toast('Otra persona modificó este registro. Se actualizó la fila.', 'error'); refrescarTrabajo(t.id); }
      else toast('No se pudo guardar: ' + e.message, 'error');
    }
  }

  /* CUIT/CUIL/DNI y correo son datos del CLIENTE (los "datos de facturación"),
     no del trabajo: se guardan aparte, directo contra la tabla clientes. */
  async function cambiarDatosCliente(t, campos) {
    if (!t.cliente_id) return toast('Este caso no tiene un cliente vinculado.', 'error');
    try {
      await actualizarDatosFacturacion(t.cliente_id, campos);
      toast('Guardado', 'ok');
    } catch (e) {
      toast('No se pudo guardar: ' + e.message, 'error');
    }
  }

  /* Al cobrar (o al cancelar por pago en efectivo) el trabajo queda cerrado
     y así se ve al instante en el Registro de Service. */
  async function marcarCobro(t, valor) {
    const campos = { cobrado: valor };
    if (['SI', 'CANCELADO'].includes(valor) && !t.fecha_pago) campos.fecha_pago = hoyISO();
    let aviso = 'Guardado';
    if (['SI', 'CANCELADO'].includes(valor) && estaAbierto(t)) {
      const falta = faltaParaCerrar({ ...t, ...campos });
      if (falta.length) {
        aviso = `Cobro registrado. El trabajo sigue ABIERTO: falta ${falta.join(' y ')}.`;
      } else {
        campos.cierre = 'CERRADO';
        aviso = 'Cobro registrado y trabajo CERRADO';
      }
    }
    await cambiar(t, campos, aviso);
  }

  async function cerrar(t) {
    const falta = faltaParaCerrar(t);
    if (falta.length) {
      if (!esAdmin()) {
        return toast(soloFaltanObservaciones(t)
          ? 'Faltan las observaciones del servicio: sólo el administrador puede cerrarlo así.'
          : 'No se puede cerrar todavía: falta ' + falta.join(' y ') + '.', 'error');
      }
      await cambiar(t, { cierre: 'CERRADO' }, 'Cerrado por el administrador sin ' + falta.join(' y '));
      return;
    }
    await cambiar(t, { cierre: 'CERRADO' });
  }

  /* Para casos viejos que no se van a cobrar en lo inmediato: saca al
     trabajo de "Cumplidos sin cerrar" (no exige tener completa la
     facturación ni las observaciones, al revés de cerrar()) pero deja
     registrado que todavía debe. Sigue viéndose en "Pendientes de cobro"
     hasta que se marque como pagado. */
  async function pendienteCobranza(t) {
    await cambiar(t, { cierre: 'PENDIENTE COBRANZA' }, 'Cerrado como pendiente de cobranza');
  }

  const cols = [
    { rot: 'N° LL', val: t => t.n_llamada }, { rot: 'Cliente', val: t => t.cliente_nombre },
    { rot: 'CUIT/DNI', val: t => t.cliente_cuit }, { rot: 'N° Serie', val: t => t.n_serie },
    { rot: 'Concepto', val: t => t.concepto },
    ...(verMontos ? [
      { rot: 'Precio sin IVA', val: t => t.precio_sin_iva },
      { rot: 'IVA %', val: t => ivaDe(t) },
      { rot: 'Con IVA', val: t => Math.round((Number(t.precio_sin_iva) || 0) * (1 + ivaDe(t) / 100)) },
    ] : []),
    { rot: 'Situación', val: t => situacionDelCaso(t) },
    { rot: 'Factura solicitada', val: t => t.factura_solicitada ? 'SI' : 'NO' },
    { rot: 'Fecha de solicitud', val: t => fecha(t.fecha_solicitud_factura, 1) },
    { rot: 'Facturado', val: t => t.facturado }, { rot: 'Fecha factura', val: t => fecha(t.fecha_factura, 1) },
    { rot: 'Tipo', val: t => t.tipo_factura },
    { rot: 'Cierre', val: t => cierreQueCorresponde(t) || '' },
    { rot: 'Obs. del servicio', val: t => t.obs_servicio },
    { rot: 'Correo', val: t => t.cliente_correo }, { rot: 'Observaciones', val: t => t.obs_cobranza },
    /* Cobrado y Fecha de pago van al final a propósito: son los que cierran
       el caso, y así queda la observación cargada antes de tocarlos. */
    { rot: 'Cobrado', val: t => t.cobrado },
    { rot: 'Fecha de pago', val: t => fecha(t.fecha_pago, 1) },
  ];

  /* La foto de arriba mira TODOS los trabajos del período, no sólo los que
     están en la vista elegida: si mirara la lista filtrada, "lo que está en
     curso" nunca aparecería, porque todavía no entró al circuito de cobro. */
  const universo = useMemo(() => s.trabajos.filter(t => {
    const ref = String(t.fecha_factura || t.fecha_visita || '');
    if (anio && ref.slice(0, 4) !== anio) return false;
    if (mes && ref.slice(5, 7) !== mes) return false;
    return true;
  }), [s.trabajos, anio, mes]);
  const rotuloPeriodo = anio || mes
    ? [mes ? MESES[Number(mes) - 1] : '', anio].filter(Boolean).join(' de ')
    : 'todos los años';

  return html`<div>
    <${SituacionCasos} trabajos=${universo} verMontos=${verMontos} periodo=${rotuloPeriodo} />
    <div class="panel" style="margin-bottom:10px">
      <div class="panel-cab">
        ${[['a_cobrar', 'Pendientes de cobro'],
           ['facturado_en_curso', `Facturado en curso, sin cobrar (${
             s.trabajos.filter(t => t.facturado === 'EN CURSO' && !CERRADO_COBRO.includes(t.cobrado) && !t.fecha_pago).length})`],
           ['sin_cerrar', `Cumplidos sin cerrar (${s.trabajos.filter(estaAbierto).length})`],
           ['todo', 'Todo lo facturable'],
           ['todos_registros', `Todos los registros (${s.trabajos.length})`]]
          .map(([k, r]) => html`<button class=${'btn chico ' + (vista === k ? '' : 'sec')}
            onClick=${() => { setVista(k); setDestacado(null); }}>${r}</button>`)}
        <input style="max-width:250px" placeholder="Buscar cliente, concepto, CUIT…" value=${busca}
          onInput=${e => { setBusca(e.target.value); setDestacado(null); }} />
        <${Sel} valor=${anio} opts=${anios} vacio="Año: todos" alCambiar=${setAnio} />
        <select style="width:auto" value=${mes} onChange=${e => setMes(e.target.value)}
          title="Mes de la factura (o del trabajo, si todavía no se facturó)">
          <option value="">Mes: todos</option>
          ${MESES_OPC.map(m => html`<option value=${m.v}>${m.r[0].toUpperCase() + m.r.slice(1)}</option>`)}
        </select>
        <div style="margin-left:auto" class="fila">
          ${editable && seleccion.size > 0 && html`<button class="btn sec chico"
            onClick=${() => setSeleccion(new Set())}>Quitar selección (${seleccion.size})</button>`}
          ${editable && html`<button class="btn chico" disabled=${!seleccion.size}
            title="Arma una tabla con los datos para facturar los casos tildados en la grilla"
            onClick=${() => setVerFacturar(true)}>Armar tabla para facturar${seleccion.size ? ` (${seleccion.size})` : ''}</button>`}
          <button class="btn sec chico" title="Qué significa cada color y cada etiqueta"
            onClick=${() => setVerLeyenda(true)}>Referencias</button>
          <button class="btn sec chico" onClick=${() => bajarCSV('cobranza', cols, filtrados)}>Exportar</button>
          <button class="btn sec chico" onClick=${() => window.print()}>Imprimir</button>
        </div>
      </div>
      <div class="panel-cuerpo" style="padding:4px 12px">
        <${Resumen} items=${[
          ['registros', filtrados.length],
          vista === 'sin_cerrar'
            ? ['listos para cerrar', filtrados.filter(t => !faltaParaCerrar(t).length).length]
            : ['sin cerrar', filtrados.filter(estaAbierto).length],
          verMontos && ['sin IVA', plata(total)],
          verMontos && ['con IVA', plata(totalConIva)],
          ['con más de 60 días', filtrados.filter(t => (dias(t) || 0) > 60).length],
        ]} />
      </div>
    </div>

    <div class="tabla-caja panel" ref=${caja}>
      <table class="grilla">
        <thead><tr>
          ${editable && html`<th class="no-imprimir" style="width:24px">
            <input type="checkbox" style="width:auto" title="Marcar todo lo visible"
              checked=${filtrados.slice(0, tope).length > 0 && filtrados.slice(0, tope).every(t => seleccion.has(t.id))}
              onChange=${() => setSeleccion(s2 => {
                const visibles = filtrados.slice(0, tope);
                const n = new Set(s2);
                if (visibles.every(t => n.has(t.id))) visibles.forEach(t => n.delete(t.id));
                else visibles.forEach(t => n.add(t.id));
                return n;
              })} /></th>`}
          <${Th} campo="n_llamada" rot="N° LL" orden=${orden} setOrden=${setOrden} clase="congelada" ancho=${70} />
          <${Th} campo="cliente_nombre" rot="Cliente" orden=${orden} setOrden=${setOrden} ancho=${190} />
          <th>CUIT / DNI</th>
          <th>Correo</th>
          <${Th} campo="n_serie" rot="Serie" orden=${orden} setOrden=${setOrden} />
          <th style="min-width:200px">Concepto</th>
          ${verMontos && html`<${Th} campo="precio_sin_iva" rot="Sin IVA" orden=${orden} setOrden=${setOrden} />`}
          ${verMontos && html`<${Th} campo="iva" rot="IVA %" orden=${orden} setOrden=${setOrden} ancho=${60} />`}
          ${verMontos && html`<th>Con IVA</th>`}
          <${Th} campo="factura_solicitada" rot="Solicitada" orden=${orden} setOrden=${setOrden} />
          <${Th} campo="facturado" rot="Facturado" orden=${orden} setOrden=${setOrden} />
          <${Th} campo="fecha_factura" rot="F. factura" orden=${orden} setOrden=${setOrden} />
          <${Th} campo="tipo_factura" rot="Tipo" orden=${orden} setOrden=${setOrden} />
          <th>Días</th>
          <${Th} campo="cierre" rot="Cierre" orden=${orden} setOrden=${setOrden} />
          <th class="no-imprimir"></th>
          <th>Observaciones</th>
          <${Th} campo="cobrado" rot="Cobrado" orden=${orden} setOrden=${setOrden} />
          <${Th} campo="fecha_pago" rot="F. pago" orden=${orden} setOrden=${setOrden} />
        </tr></thead>
        <tbody>
          ${filtrados.slice(0, tope).map(t => html`<tr key=${t.id}
            ref=${String(destacado) === String(t.id) ? filaDestacadaRef : null}
            class=${[seleccion.has(t.id) ? 'marcado' : '',
                     String(destacado) === String(t.id) ? 'desde-service' : ''].filter(Boolean).join(' ')}>
            ${editable && html`<td class="no-imprimir">
              <input type="checkbox" style="width:auto" checked=${seleccion.has(t.id)}
                onChange=${() => alternarSeleccion(t.id)} /></td>`}
            <td class="congelada" onClick=${() => setFichaId(t.id)}><b>${t.n_llamada || '#' + t.id}</b></td>
            <td onClick=${() => setFichaId(t.id)} title=${t.cliente_nombre}>${t.cliente_nombre}</td>
            <td>${editable
              ? html`<${CampoGrilla} valor=${t.cliente_cuit} ancho=${110} titulo="CUIT / CUIL / DNI del cliente"
                  onGuardar=${v => cambiarDatosCliente(t, { cuit_dni: v })} />`
              : (t.cliente_cuit || '')}</td>
            <td>${editable
              ? html`<${CampoGrilla} valor=${t.cliente_correo} ancho=${170}
                  titulo="Correo del cliente, para enviarle la factura"
                  onGuardar=${v => cambiarDatosCliente(t, { correo: v })} />`
              : (t.cliente_correo || '')}</td>
            <td>${t.n_serie || ''}</td>
            <td>${editable
              ? html`<${CampoGrilla} valor=${t.concepto} ancho=${190} titulo="Concepto"
                  onGuardar=${v => cambiar(t, { concepto: v })} />`
              : html`<span title=${t.concepto}>${t.concepto || ''}</span>`}</td>
            ${verMontos && html`<td class="num">${editable
              ? html`<${CampoGrilla} valor=${t.precio_sin_iva} ancho=${100} numero=${true} titulo="Precio sin IVA"
                  onGuardar=${v => cambiar(t, { precio_sin_iva: v })} />`
              : plata(t.precio_sin_iva)}</td>`}
            ${verMontos && html`<td class="num">${editable
              ? html`<${CampoGrilla} valor=${t.iva} ancho=${55} numero=${true}
                  titulo="Porcentaje de IVA de este trabajo. Vacío = el de Configuración"
                  placeholder=${String(Number(s.config.iva) || 21)}
                  onGuardar=${v => cambiar(t, { iva: v })} />`
              : ivaDe(t) + '%'}</td>`}
            ${verMontos && html`<td class="num">${plata((Number(t.precio_sin_iva) || 0) * (1 + ivaDe(t) / 100))}</td>`}
            <td title=${t.fecha_solicitud_factura ? 'Solicitada el ' + fecha(t.fecha_solicitud_factura, 1) : ''}>
              ${editable
                ? html`<div class="fila" style="gap:5px;flex-wrap:nowrap">
                    <input type="checkbox" style="width:auto" checked=${!!t.factura_solicitada}
                      onChange=${e => cambiar(t, { factura_solicitada: e.target.checked,
                        fecha_solicitud_factura: e.target.checked ? (t.fecha_solicitud_factura || hoyISO()) : null })} />
                    ${t.factura_solicitada && html`<input type="date" style="width:126px"
                      title="Fecha en que se pidió la factura a Administración"
                      value=${t.fecha_solicitud_factura || ''}
                      onChange=${e => cambiar(t, { fecha_solicitud_factura: e.target.value || null })} />`}
                  </div>`
                : (t.factura_solicitada ? html`<${Et} txt=${'SI ' + fecha(t.fecha_solicitud_factura)} color="azul" /> ` : '')}
            </td>
            <td class="no-imprimir">${editable
              ? html`<select style="width:118px" value=${t.facturado || ''}
                  onChange=${e => cambiar(t, { facturado: e.target.value })}>
                  ${opciones('facturado').map(o => html`<option value=${o}>${o}</option>`)}</select>`
              : html`<${Et} txt=${t.facturado} mapa=${COLOR_COBRO} />`}</td>
            <td class="no-imprimir">${editable
              ? html`<input type="date" style="width:130px" value=${t.fecha_factura || ''}
                  onChange=${e => cambiar(t, { fecha_factura: e.target.value || null })} />`
              : fecha(t.fecha_factura)}</td>
            <td class="no-imprimir">${editable
              ? html`<select style="width:150px" value=${t.tipo_factura || ''}
                  onChange=${e => cambiar(t, { tipo_factura: e.target.value || null })}>
                  <option value="">—</option>
                  ${opciones('tipo_factura').map(o => html`<option value=${o}>${o}</option>`)}</select>`
              : html`<${Et} txt=${t.tipo_factura} color="gris" />`}</td>
            <td class="num">${t.cobrado === 'SI' ? '' : (dias(t) !== null
              ? html`<${Et} txt=${dias(t) + ' d'} color=${dias(t) > 60 ? 'rojo' : dias(t) > 30 ? 'ambar' : 'gris'} />` : '')}</td>
            <td><${MarcaCierre} t=${t} /></td>
            <td class="no-imprimir">${editable && (estaAbierto(t)
              ? html`<div class="fila" style="gap:4px;flex-wrap:nowrap">
                  ${faltaParaCerrar(t).length
                    ? (esAdmin()
                      ? html`<button class="btn chico" title=${'Como administrador podés cerrarlo igual, aunque falte ' + faltaParaCerrar(t).join(' y ')}
                          onClick=${() => cerrar(t)}>Cerrar igual</button>`
                      : html`<button class="btn sec chico" title=${'Falta ' + faltaParaCerrar(t).join(' y ')}
                          onClick=${() => setFichaId(t.id)}>Completar…</button>`)
                    : html`<button class="btn chico" onClick=${() => cerrar(t)}>Cerrar</button>`}
                  <button class="btn sec chico"
                    title="Para casos viejos que no se van a cobrar en lo inmediato: lo saca de la cola pero deja registrado que todavía debe"
                    onClick=${() => pendienteCobranza(t)}>Pendiente cobranza</button>
                </div>`
              : (t.cierre === 'PENDIENTE COBRANZA'
                ? html`<button class="btn chico" onClick=${() => cerrar(t)}>Ya pagó: cerrar</button>`
                : ''))}</td>
            <td>${editable
              ? html`<${CampoGrilla} valor=${t.obs_cobranza} ancho=${220} titulo="Observaciones de cobranza"
                  onGuardar=${v => cambiar(t, { obs_cobranza: v })} />`
              : html`<span title=${t.obs_cobranza}>${t.obs_cobranza || ''}</span>`}</td>
            <td class="no-imprimir">${editable
              ? html`<select style="width:112px" value=${t.cobrado || ''}
                  onChange=${e => marcarCobro(t, e.target.value)}>
                  ${opciones('cobrado').map(o => html`<option value=${o}>${o}</option>`)}</select>`
              : html`<${Et} txt=${t.cobrado} mapa=${COLOR_COBRO} />`}</td>
            <td class="no-imprimir">${editable
              ? html`<input type="date" style="width:130px" value=${t.fecha_pago || ''}
                  onChange=${e => cambiar(t, { fecha_pago: e.target.value || null })} />`
              : fecha(t.fecha_pago)}</td>
          </tr>`)}
        </tbody>
      </table>
      ${!filtrados.length && html`<div class="vacio">Nada pendiente en esta vista. 👌</div>`}
      ${filtrados.length > tope && html`<div style="padding:10px;text-align:center">
        <button class="btn sec" onClick=${() => setTope(tope + 500)}>
          Mostrar más (${(filtrados.length - tope).toLocaleString('es-AR')} restantes)</button></div>`}
      <${Deslizador} para=${caja} />
    </div>
    ${fichaId && html`<${Ficha} id=${fichaId} alCerrar=${() => setFichaId(null)} />`}
    ${verFacturar && html`<${TablaFacturar} trabajos=${seleccionados} alCerrar=${() => setVerFacturar(false)} />`}
    ${verLeyenda && html`<${Leyenda} alCerrar=${() => setVerLeyenda(false)} />`}
  </div>`;
}

/* ---------------------------------------------------------------------
   TABLA PARA FACTURAR
   Junta los casos tildados en la grilla de Cobranza y arma, en una hoja
   aparte, sólo lo que hace falta para pasarle la facturación a
   Administración: concepto, precio sin y con IVA, CUIT/CUIL/DNI, cliente
   y N° de serie del equipo (se agrega también el N° de llamada, como
   referencia para identificar cada caso sin ambigüedad).
   --------------------------------------------------------------------- */
function TablaFacturar({ trabajos, alCerrar }) {
  const caja = useRef(null);            // la caja que se desplaza de costado
  useEffect(() => {
    document.body.classList.add('imprimiendo');
    return () => document.body.classList.remove('imprimiendo');
  }, []);

  const filas = useMemo(() => [...trabajos]
    .sort((a, b) => (a.cliente_nombre || '').localeCompare(b.cliente_nombre || '', 'es')), [trabajos]);
  const totalSinIva = filas.reduce((a, t) => a + (Number(t.precio_sin_iva) || 0), 0);
  const totalConIva = filas.reduce((a, t) => a + (Number(t.precio_sin_iva) || 0) * (1 + ivaDe(t) / 100), 0);

  const cols = [
    { rot: 'N° LL', val: t => t.n_llamada }, { rot: 'Cliente', val: t => t.cliente_nombre },
    { rot: 'CUIT/CUIL/DNI', val: t => t.cliente_cuit },
    { rot: 'Correo', val: t => t.cliente_correo }, { rot: 'Teléfono', val: t => t.cliente_telefono },
    { rot: 'Tipo de factura', val: t => t.tipo_factura },
    { rot: 'N° Serie', val: t => t.n_serie },
    { rot: 'Concepto', val: t => t.concepto },
    { rot: 'Precio sin IVA', val: t => t.precio_sin_iva },
    { rot: 'Precio con IVA', val: t => Math.round((Number(t.precio_sin_iva) || 0) * (1 + ivaDe(t) / 100)) },
  ];

  return html`<div class="fondo" style="justify-content:center;align-items:flex-start;padding:14px;overflow:auto">
    <div class="panel hoja-impresion" style="width:100%;max-width:1060px;background:var(--papel)">
      <div class="panel-cab no-imprimir">
        <h2>Tabla para facturar</h2>
        <span class="mini">${filas.length} caso${filas.length === 1 ? '' : 's'} seleccionado${filas.length === 1 ? '' : 's'}</span>
        <div style="margin-left:auto" class="fila">
          <button class="btn sec" onClick=${() => bajarCSV('para_facturar', cols, filas)}>Exportar CSV</button>
          <button class="btn" onClick=${() => window.print()}>Imprimir / guardar PDF</button>
          <button class="btn sec" onClick=${alCerrar}>Cerrar</button>
        </div>
      </div>
      <div class="panel-cuerpo">
        <div class="encabezado-hoja">
          <div>
            <img class="logo-hoja" src=${LOGO_NEGRO} alt="ENSA" />
            <div class="titulo-hoja">Tabla para facturar</div>
            <div class="mini">Datos de los casos tratados, para armar la factura de cada uno.</div>
          </div>
          <div class="mini der">Emitido el ${fecha(hoyISO(), 1)}</div>
        </div>

        <div class="tabla-caja" style="max-height:none" ref=${caja}>
          <table class="grilla planilla">
            <thead><tr>
              <th>N° LL</th><th>Cliente</th><th>CUIT/CUIL/DNI</th>
              <th>Correo</th><th>Teléfono</th><th>Tipo de factura</th><th>N° Serie</th>
              <th>Concepto</th><th class="der">Sin IVA</th><th class="der">Con IVA</th>
            </tr></thead>
            <tbody>
              ${filas.map(t => html`<tr key=${t.id}>
                <td><b>${t.n_llamada || '#' + t.id}</b></td>
                <td>${t.cliente_nombre || ''}</td>
                <td>${t.cliente_cuit || ''}</td>
                <td>${t.cliente_correo || ''}</td>
                <td>${t.cliente_telefono || ''}</td>
                <td>${t.tipo_factura || ''}</td>
                <td>${t.n_serie || ''}</td>
                <td class="largo">${t.concepto || ''}</td>
                <td class="num">${plata(t.precio_sin_iva)}</td>
                <td class="num">${plata((Number(t.precio_sin_iva) || 0) * (1 + ivaDe(t) / 100))}</td>
              </tr>`)}
              <tr style="border-top:2px solid var(--borde)">
                <td colspan="8" class="der"><b>Totales</b></td>
                <td class="num"><b>${plata(totalSinIva)}</b></td>
                <td class="num"><b>${plata(totalConIva)}</b></td>
              </tr>
            </tbody>
          </table>
          <${Deslizador} para=${caja} />
        </div>
        ${!filas.length && html`<div class="vacio">No hay casos seleccionados.</div>`}

        <div class="pie-hoja mini">
          <span>Armado desde el módulo Cobranza · ENSA — Postventa de ascensores</span>
        </div>
      </div>
    </div>
  </div>`;
}


/* ===== 65_encuestas.js ===== */
/* =====================================================================
   MÓDULO 5 — ENCUESTAS DE SATISFACCIÓN
   Los trabajos ya realizados, para ir marcando a quién se le mandó la
   encuesta. Se filtra por mes y se exporta para el seguimiento.
   ===================================================================== */
function Encuestas() {
  const s = useS();
  const [busca, setBusca] = useState('');
  const [anio, setAnio] = useState('');
  const [mes, setMes] = useState('');
  const [tecnico, setTecnico] = useState('');
  const [estadoEnc, setEstadoEnc] = useState('pendientes');   // pendientes | enviadas | todas
  const [orden, setOrden] = useState({ campo: 'fecha_visita', asc: false });
  const [fichaId, setFichaId] = useState(null);
  const [tope, setTope] = useState(300);
  const caja = useRef(null);
  const editable = puedeEncuestas();

  /* Sólo trabajos realizados: la encuesta se manda después de la visita */
  const hechos = useMemo(() => s.trabajos.filter(t => t.estado === 'CUMPLIDO'), [s.trabajos]);

  const anios = useMemo(() => [...new Set(hechos
    .map(t => String(t.fecha_visita || '').slice(0, 4)).filter(Boolean))]
    .sort().reverse(), [hechos]);
  const MESES_OPC = MESES.map((m, i) => ({ v: String(i + 1).padStart(2, '0'),
    r: m[0].toUpperCase() + m.slice(1) }));

  /* El período elegido, sin mirar todavía si la encuesta se mandó o no:
     es sobre esto que se calcula la cobertura del mes. */
  const delPeriodo = useMemo(() => {
    const f = sinAcentos(busca);
    return hechos.filter(t => {
      const d = String(t.fecha_visita || '');
      if (anio && d.slice(0, 4) !== anio) return false;
      if (mes && d.slice(5, 7) !== mes) return false;
      if (tecnico && !(t.tecnicos || '').includes(tecnico)) return false;
      return !f || sinAcentos([t.n_llamada, t.cliente_nombre, t.n_serie, t.modelo,
        ciudadDe(t), provinciaDe(t), t.tipo_pedido, t.tipo_servicio,
        t.tecnicos].join(' ')).includes(f);
    });
  }, [hechos, busca, anio, mes, tecnico]);

  const filtrados = useMemo(() => ordenar(delPeriodo.filter(t =>
    estadoEnc === 'todas' ? true
      : estadoEnc === 'enviadas' ? t.encuesta_enviada : !t.encuesta_enviada), orden),
    [delPeriodo, estadoEnc, orden]);

  // el resumen habla del período completo, no de la solapa que se esté mirando
  const enviadas = delPeriodo.filter(t => t.encuesta_enviada).length;
  const pendientes = delPeriodo.length - enviadas;

  async function marcar(t, si) {
    const campos = { encuesta_enviada: si, fecha_encuesta: si ? (t.fecha_encuesta || hoyISO()) : null };
    try {
      const r = await actualizarTrabajo(t.id, campos, t.actualizado_en);
      if (r.enCola) toast('Sin conexión: se guardó acá y se sube cuando vuelva internet');
    } catch (e) {
      if (e.conflicto) { toast('Otra persona modificó este trabajo. Se actualizó la fila.', 'error'); refrescarTrabajo(t.id); }
      else toast('No se pudo marcar: ' + (e.message || e), 'error');
    }
  }

  /* Marcar de a muchas: lo habitual es mandar la tanda del mes de una vez */
  async function marcarTodas() {
    const faltan = filtrados.filter(t => !t.encuesta_enviada);
    if (!faltan.length) return toast('No queda ninguna pendiente en este filtro', 'error');
    if (!confirm(`¿Marcar como enviadas las ${faltan.length} encuestas que estás viendo?`)) return;
    let ok = 0;
    for (const t of faltan) {
      try { await actualizarTrabajo(t.id, { encuesta_enviada: true, fecha_encuesta: hoyISO() },
        t.actualizado_en); ok++; } catch (e) { /* se sigue con las demás */ }
    }
    toast(`${ok} de ${faltan.length} marcadas como enviadas`, ok ? 'ok' : 'error');
  }

  const COLS = [
    { rot: 'N° LL', val: t => t.n_llamada },
    { rot: 'Pedido', val: t => t.tipo_pedido },
    { rot: 'Serie', val: t => t.n_serie },
    { rot: 'Modelo', val: t => t.modelo },
    { rot: 'Cliente', val: t => t.cliente_nombre },
    { rot: 'Ciudad y provincia', val: t => ubicacion(t) },
    { rot: 'Servicio', val: t => t.tipo_servicio },
    { rot: 'Estado', val: t => t.estado },
    { rot: 'Fecha del trabajo', val: t => fecha(t.fecha_visita, 1) },
    { rot: 'Técnico', val: t => t.tecnicos },
    { rot: 'Encuesta enviada', val: t => t.encuesta_enviada ? 'SI' : 'NO' },
    { rot: 'Fecha de envío', val: t => fecha(t.fecha_encuesta, 1) },
  ];

  async function exportar() {
    if (!filtrados.length) return toast('No hay trabajos para exportar con ese filtro', 'error');
    toast(`Armando el Excel con ${filtrados.length} trabajos…`);
    try {
      const periodo = [anio, mes ? MESES[Number(mes) - 1] : ''].filter(Boolean).join(' ');
      const hojas = [
        { nombre: 'Encuestas',
          columnas: COLS.map(c => c.rot),
          filas: filtrados.map(t => COLS.map(c => {
            if (c.rot === 'Fecha del trabajo') return t.fecha_visita ? { f: t.fecha_visita } : null;
            if (c.rot === 'Fecha de envío') return t.fecha_encuesta ? { f: t.fecha_encuesta } : null;
            const v = c.val(t); return v === undefined || v === '' ? null : v;
          })) },
        { nombre: 'Resumen',
          columnas: ['Dato', 'Valor'],
          filas: [
            ['Generado el', momento(new Date().toISOString())],
            ['Generado por', nombreUsuario()],
            ['Período', periodo || 'todo el historial'],
            ['Trabajos realizados en el período', delPeriodo.length],
            ['Encuestas enviadas', enviadas],
            ['Pendientes de enviar', pendientes],
            ['Cobertura', delPeriodo.length
              ? Math.round(enviadas / delPeriodo.length * 100) + '%' : '—'],
            ['Filas exportadas', filtrados.length],
            ...(tecnico ? [['Técnico', tecnico]] : []),
            ...(estadoEnc !== 'todas' ? [['Se exportaron', estadoEnc === 'enviadas'
              ? 'sólo las enviadas' : 'sólo las pendientes']] : []),
          ] },
      ];
      await bajarXlsx(`Encuestas${periodo ? ' - ' + periodo : ''}.xlsx`, hojas);
      toast(`Exportadas ${filtrados.length} filas`, 'ok');
    } catch (e) {
      toast('No se pudo exportar: ' + (e.message || e), 'error');
    }
  }

  return html`<div>
    <div class="panel" style="margin-bottom:10px">
      <div class="panel-cab">
        ${[['pendientes', 'Pendientes de enviar'], ['enviadas', 'Ya enviadas'], ['todas', 'Todas']]
          .map(([k, r]) => html`<button class=${'btn chico ' + (estadoEnc === k ? '' : 'sec')}
            onClick=${() => { setEstadoEnc(k); setTope(300); }}>${r}</button>`)}
        <input style="max-width:240px" placeholder="Buscar cliente, serie, N° LL…" value=${busca}
          onInput=${e => setBusca(e.target.value)} />
        <${Sel} valor=${anio} opts=${anios} vacio="Año: todos" alCambiar=${v => setAnio(v || '')} />
        <select style="width:auto" value=${mes} onChange=${e => setMes(e.target.value)}>
          <option value="">Mes: todos</option>
          ${MESES_OPC.map(m => html`<option value=${m.v}>${m.r}</option>`)}
        </select>
        <${Sel} valor=${tecnico} opts=${s.tecnicos.map(t => t.nombre)} vacio="Técnico: todos"
          alCambiar=${v => setTecnico(v || '')} />
        <div style="margin-left:auto" class="fila">
          ${editable && html`<button class="btn sec chico"
            title="Marca como enviadas todas las que estás viendo"
            onClick=${marcarTodas}>Marcar todas</button>`}
          ${esAdmin() && html`<button class="btn chico" onClick=${exportar}>
            Descargar reporte (${filtrados.length.toLocaleString('es-AR')})</button>`}
        </div>
      </div>
      <div class="panel-cuerpo" style="padding:4px 12px">
        <${Resumen} items=${[
          ['trabajos realizados', delPeriodo.length.toLocaleString('es-AR')],
          ['encuestas enviadas', enviadas.toLocaleString('es-AR')],
          ['pendientes', pendientes.toLocaleString('es-AR')],
          ['cobertura', delPeriodo.length ? Math.round(enviadas / delPeriodo.length * 100) + '%' : '—'],
          ['en esta lista', filtrados.length.toLocaleString('es-AR')],
        ]} />
      </div>
    </div>

    <div class="tabla-caja panel" ref=${caja}>
      <table class="grilla">
        <thead><tr>
          <${Th} campo="n_llamada" rot="N° LL" orden=${orden} setOrden=${setOrden} clase="congelada" ancho=${72} />
          <${Th} campo="tipo_pedido" rot="Pedido" orden=${orden} setOrden=${setOrden} ancho=${120} />
          <${Th} campo="n_serie" rot="Serie" orden=${orden} setOrden=${setOrden} />
          <${Th} campo="modelo" rot="Modelo" orden=${orden} setOrden=${setOrden} />
          <${Th} campo="cliente_nombre" rot="Cliente" orden=${orden} setOrden=${setOrden} ancho=${200} />
          <${Th} campo="cliente_ciudad" rot="Ciudad y provincia" orden=${orden} setOrden=${setOrden} ancho=${170} />
          <${Th} campo="tipo_servicio" rot="Servicio" orden=${orden} setOrden=${setOrden} />
          <${Th} campo="estado" rot="Estado" orden=${orden} setOrden=${setOrden} />
          <${Th} campo="fecha_visita" rot="Fecha" orden=${orden} setOrden=${setOrden} />
          <${Th} campo="tecnicos" rot="Técnico" orden=${orden} setOrden=${setOrden} ancho=${150} />
          <th class="col-encuesta" style="min-width:150px">Encuesta enviada</th>
        </tr></thead>
        <tbody>
          ${filtrados.slice(0, tope).map(t => html`<tr key=${t.id}
              class=${t.encuesta_enviada ? 'enc-si' : ''}>
            <td class="congelada" onClick=${() => setFichaId(t.id)}><b>${t.n_llamada || '#' + t.id}</b></td>
            <td onClick=${() => setFichaId(t.id)}>${t.tipo_pedido || ''}</td>
            <td>${t.n_serie || ''}</td>
            <td>${t.modelo || ''}</td>
            <td title=${t.cliente_nombre}>${t.cliente_nombre || ''}</td>
            <td title=${ubicacion(t)}>${ubicacion(t)}</td>
            <td>${t.tipo_servicio || ''}</td>
            <td><${Et} txt=${t.estado} mapa=${COLOR_ESTADO} /></td>
            <td>${fecha(t.fecha_visita)}</td>
            <td title=${t.tecnicos}>${t.tecnicos || ''}</td>
            <td class="col-encuesta">
              <label class="fila" style="gap:7px;cursor:${editable ? 'pointer' : 'default'};flex-wrap:nowrap">
                <input type="checkbox" style="width:auto;transform:scale(1.25)"
                  disabled=${!editable} checked=${!!t.encuesta_enviada}
                  onChange=${e => marcar(t, e.target.checked)} />
                <span class="mini">${t.encuesta_enviada
                  ? (t.fecha_encuesta ? fecha(t.fecha_encuesta, 1) : 'enviada')
                  : 'sin enviar'}</span>
              </label>
            </td>
          </tr>`)}
        </tbody>
      </table>
      ${!filtrados.length && html`<div class="vacio">
        ${estadoEnc === 'pendientes'
          ? 'No queda ninguna encuesta pendiente con este filtro. 👌'
          : 'No hay trabajos realizados que coincidan.'}</div>`}
      ${filtrados.length > tope && html`<div style="padding:10px;text-align:center">
        <button class="btn sec" onClick=${() => setTope(tope + 500)}>
          Mostrar más (${(filtrados.length - tope).toLocaleString('es-AR')} restantes)</button></div>`}
      <${Deslizador} para=${caja} />
    </div>

    ${fichaId && html`<${Ficha} id=${fichaId} alCerrar=${() => setFichaId(null)} />`}
  </div>`;
}
