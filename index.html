/* ---------------------------------------------------------------------
   FICHA DEL TRABAJO
   --------------------------------------------------------------------- */
function Ficha({ id, nuevo, alCerrar, precarga }) {
  const s = useS();
  const original = id ? s.trabajos.find(t => t.id === id) : null;
  const [b, setB] = useState(() => nuevo
    ? {
        tipo_pedido: 'Service', tipo_servicio: 'Falla', prioridad: 'Media', estado: 'PENDIENTE',
        fecha_pedido: hoyISO(), facturado: 'SIN DATOS', cobrado: 'SIN DATOS', ...(precarga || {}),
      }
    : { ...original });
  const [tecs, setTecs] = useState(() => (original && original.tecnico_ids) || []);
  const [guardando, setGuardando] = useState(false);
  const [pestania, setPestania] = useState('servicio');
  const [audit, setAudit] = useState(null);
  const [verHistorial, setVerHistorial] = useState(false);
  const [creando, setCreando] = useState(null);   // 'cliente' | 'equipo'
  const editable = puedeEditar();          // puede guardar algo
  const edServ = puedeServicio();          // datos del servicio y planificación
  const edCob = puedeCobranza();           // precio, facturación, cobro y cierre
  const edObs = puedeObservar();           // observaciones y comentarios
  const cli = s.clientes.find(c => c.id === b.cliente_id);
  const eq = s.equipos.find(e => e.id === b.equipo_id);
  const c = (k, v) => setB(x => ({ ...x, [k]: v }));

  /* Al elegir el equipo se completa el cliente SÓLO si el trabajo todavía no
     tiene uno. Nunca se pisa el que ya se cargó: los equipos cambian de dueño,
     y el que vale en el trabajo (y en la hoja de ruta) es quien llamó. */
  const elegirEquipo = e => {
    if (!e) return setB(x => ({ ...x, equipo_id: null }));
    setB(x => ({ ...x, equipo_id: e.id, cliente_id: x.cliente_id || e.cliente_id || null }));
  };
  // titular registrado del equipo, que puede no ser el cliente del trabajo
  const titular = eq ? s.clientes.find(c2 => String(c2.id) === String(eq.cliente_id)) : null;
  const distintoTitular = !!(eq && b.cliente_id && eq.cliente_id
    && String(eq.cliente_id) !== String(b.cliente_id));

  async function pasarTitular() {
    const { error } = await cliente().from('equipos')
      .update({ cliente_id: b.cliente_id }).eq('id', eq.id);
    if (error) return toast('No se pudo actualizar el titular: ' + error.message, 'error');
    set({ equipos: S.equipos.map(x => x.id === eq.id ? { ...x, cliente_id: b.cliente_id } : x) });
    toast(`El equipo ${eq.n_serie} ahora figura a nombre de ${cli ? cli.nombre : 'este cliente'}`, 'ok');
  }
  /* CUIT/CUIL/DNI y correo son datos del CLIENTE, no del trabajo: se guardan
     aparte, directo contra la tabla clientes, y no pasan por el guardado
     general de la ficha (así no compiten con el mecanismo de conflictos de
     "guardar" de arriba). */
  async function cambiarDatosCliente(campos) {
    if (!cli) return;
    try {
      await actualizarDatosFacturacion(cli.id, campos);
      toast('Guardado', 'ok');
    } catch (e) {
      toast('No se pudo guardar: ' + e.message, 'error');
    }
  }

  /* Los campos de Cobranza que se editan acá adentro (admin, oficina y
     ahora también cobranza) se guardan uno por uno, igual que en el
     propio módulo Cobranza (ver cambiar(), en 60_cobranza.js): así no
     hace falta pasar por el botón "Guardar" general de la ficha -que
     manda junto todo el estado local de la solapa Servicio- y no se
     corre el riesgo de pisar un cambio que haya hecho alguien más en
     Cobranza mientras esta ficha estaba abierta. */
  async function cambiarCobranza(campos, aviso) {
    if (!original) return;
    try {
      const r = await actualizarTrabajo(id, campos, original.actualizado_en);
      toast(r.enCola ? 'Sin conexión: se guardó acá y se sube cuando vuelva internet'
        : (aviso || 'Guardado'), r.enCola ? '' : 'ok');
    } catch (e) {
      if (e.conflicto) { toast('Otra persona modificó este registro. Se actualizó la fila.', 'error'); refrescarTrabajo(id); }
      else toast('No se pudo guardar: ' + e.message, 'error');
    }
  }

  /* Mismo criterio que marcarCobro() en el módulo Cobranza: al cobrar (o
     cancelar por pago en efectivo) el trabajo queda cerrado solo si ya
     no le falta ningún otro dato. */
  async function marcarCobro(valor) {
    const campos = { cobrado: valor };
    if (['SI', 'CANCELADO'].includes(valor) && !b2.fecha_pago) campos.fecha_pago = hoyISO();
    let aviso = 'Guardado';
    if (['SI', 'CANCELADO'].includes(valor) && estaAbierto(b2)) {
      const faltaAlCobrar = faltaParaCerrar({ ...b2, ...campos });
      if (faltaAlCobrar.length) {
        aviso = `Cobro registrado. El trabajo sigue ABIERTO: falta ${faltaAlCobrar.join(' y ')}.`;
      } else {
        campos.cierre = 'CERRADO';
        aviso = 'Cobro registrado y trabajo CERRADO';
      }
    }
    await cambiarCobranza(campos, aviso);
  }
  // sugerir prioridad según el tipo de servicio
  const elegirServicio = v => {
    const cat = S.catalogos.find(x => x.tipo === 'tipo_servicio' && x.valor === v);
    setB(x => ({ ...x, tipo_servicio: v, prioridad: (cat && cat.extra) || x.prioridad }));
  };
  // al pasar a CUMPLIDO el trabajo queda ABIERTO hasta que alguien lo cierre
  // (si ya estaba CERRADO o PENDIENTE COBRANZA, esa decisión se respeta)
  const elegirEstado = v => setB(x => ({
    ...x, estado: v,
    cierre: v === 'CUMPLIDO'
      ? (['CERRADO', CIERRE_PENDIENTE_COBRANZA].includes(x.cierre) ? x.cierre : 'ABIERTO')
      : null,
  }));
  /* Los datos de cobranza ya no se editan desde acá: se muestran y se guardan
     siempre como están en el módulo Cobranza, para no pisar lo que cargó
     administración mientras esta ficha estaba abierta. */
  const CAMPOS_COBRANZA = ['precio_sin_iva', 'facturado', 'factura_solicitada',
    'fecha_solicitud_factura', 'fecha_factura', 'tipo_factura', 'concepto',
    'cobrado', 'fecha_pago', 'obs_cobranza', 'cierre'];
  const cobranzaViva = () => {
    const o = original || {};
    const r = {};
    if (!nuevo) CAMPOS_COBRANZA.forEach(k => { if (k in o) r[k] = o[k]; });
    return r;
  };
  const b2 = { ...b, ...cobranzaViva() };     // lo que se muestra: servicio propio + cobranza real
  const falta = faltaParaCerrar(b2);
  // la cobranza recién tiene sentido cuando el trabajo existe y ya fue asignado a una semana
  const verCobranza = puedeVerPlata() && !nuevo && (!!b.gira_id || b.estado === 'CUMPLIDO'
    || !!b.precio_sin_iva || (b.facturado && b.facturado !== 'SIN DATOS'));

  useEffect(() => {
    if (pestania !== 'historial' || !id || audit) return;
    cliente().from('auditoria').select('*').eq('tabla', 'trabajos').eq('registro_id', id)
      .order('fecha', { ascending: false }).limit(60).then(r => setAudit(r.data || []));
  }, [pestania]);

  const historialEquipo = useMemo(() => !b.equipo_id ? []
    : s.trabajos.filter(t => t.equipo_id === b.equipo_id && t.id !== id)
        .sort((x, y) => String(y.fecha_visita || '').localeCompare(String(x.fecha_visita || ''))),
    [s.trabajos, b.equipo_id]);

  /* Sólo para un trabajo NUEVO: si el cliente elegido tiene otro trabajo
     viejo que quedó sin cerrar o cerrado "pendiente de cobranza", puede
     estar debiendo. Antes de coordinar una visita nueva conviene saberlo
     y chequearlo con Administración. */
  const deudaCliente = useMemo(() => {
    if (!nuevo || !b.cliente_id) return [];
    return s.trabajos.filter(t => t.cliente_id === b.cliente_id
      && (estaAbierto(t) || t.cierre === CIERRE_PENDIENTE_COBRANZA));
  }, [nuevo, b.cliente_id, s.trabajos]);
  const [avisoCobranza, setAvisoCobranza] = useState(false);
  useEffect(() => {
    setAvisoCobranza(nuevo && deudaCliente.length > 0);
  }, [b.cliente_id]);

  async function guardar(extra) {
    setGuardando(true);
    let cuerpo = {};
    try {
      const datos = { ...b, ...cobranzaViva(), ...(extra || {}) };
      const campos = ['correlativo','n_llamada','cliente_id','equipo_id','tipo_pedido','tipo_servicio',
        'prioridad','estado','cierre','fecha_pedido','fecha_visita','gira_id','orden_gira',
        'encuesta','horas_mo','obs_servicio','comentarios','precio_sin_iva','facturado',
        'factura_solicitada','fecha_solicitud_factura','fecha_factura','tipo_factura','concepto',
        'cobrado','fecha_pago','obs_cobranza','encuesta_enviada','fecha_encuesta'];
      campos.forEach(k => { if (k in datos) cuerpo[k] = datos[k] === '' ? null : datos[k]; });
      if (cobradoEnMano(cuerpo) && !cuerpo.fecha_pago) cuerpo.fecha_pago = cuerpo.fecha_visita || hoyISO();
      cuerpo = cierreAutomatico(cuerpo);
      let res;
      if (nuevo) {
        res = await crearTrabajo(cuerpo, tecs);
        if (!res.enCola) await refrescarTrabajo(res.id);
        set({ destacado: res.id });
        setTimeout(() => set({ destacado: null }), 6000);
      } else {
        res = await actualizarTrabajo(id, cuerpo, original && original.actualizado_en, tecs);
      }
      toast(res.enCola
          ? 'Sin conexión: quedó guardado en este equipo y se sube solo cuando vuelva internet'
        : extra && extra.cierre === 'CERRADO' ? 'Trabajo cerrado'
        : extra && extra.cierre === CIERRE_PENDIENTE_COBRANZA ? 'Cerrado como pendiente de cobranza'
        : extra && extra.cierre === 'ABIERTO' ? 'Trabajo reabierto'
        : nuevo ? `Trabajo creado${cuerpo.cierre === 'CERRADO' ? ' y cerrado (cobrado en efectivo)' : ''}`
        : 'Cambios guardados', res.enCola ? '' : 'ok');
      alCerrar();
    } catch (e) {
      if (e.conflicto) {
        /* Alguien más tocó el trabajo mientras estaba abierto. Nunca se pierde lo
           que escribió esta persona: si los cambios no se pisan, se guardan solos;
           si se pisan, se avisa exactamente qué campo y se deja decidir. */
        const fresco = await refrescarTrabajo(id);
        if (!fresco) { toast('Otra persona borró este trabajo.', 'error'); setGuardando(false); return; }
        const mios = Object.keys(b).filter(k => String(b[k] ?? '') !== String((original || {})[k] ?? ''));
        const ajenos = mios.filter(k => String(fresco[k] ?? '') !== String((original || {})[k] ?? ''));
        if (!ajenos.length) {
          // no se pisan: se reintenta una sola vez con la versión nueva
          try {
            await actualizarTrabajo(id, cuerpo, fresco.actualizado_en, tecs);
            toast(`Cambios guardados (${fresco.actualizado_por || 'otra persona'} había tocado otros campos)`, 'ok');
            alCerrar(); setGuardando(false); return;
          } catch (e2) { /* sigue al aviso de abajo */ }
        }
        setB(x => ({ ...fresco, ...x }));      // se conserva lo que escribió esta persona
        set({ errorGrave: {
          titulo: 'Otra persona modificó este trabajo al mismo tiempo',
          detalle: `${fresco.actualizado_por || 'Otro usuario'} cambió: `
            + (ajenos.length ? ajenos.join(', ') : 'otros campos') + '.\n\n'
            + 'Se conservó lo que vos escribiste. Revisalo y tocá Guardar de nuevo.',
          pista: 'Nada se perdió: tus datos siguen cargados en la ficha.',
        } });
      } else {
        // no se pierde nada: la ficha queda abierta y el motivo exacto se muestra sin que se escape
        set({ errorGrave: {
          titulo: nuevo ? 'No se pudo crear el trabajo' : 'No se pudieron guardar los cambios',
          detalle: e.message || String(e),
          pista: /column|does not exist|no existe/i.test(e.message || '')
            ? 'Parece que a la base le falta una columna: revisá en la guía que estén corridos todos los scripts SQL.'
            : /row-level security|permission|denied/i.test(e.message || '')
            ? 'Tu usuario no tiene permiso para esta operación. Pedile al administrador que revise tu rol.'
            : null,
        } });
      }
    }
    setGuardando(false);
  }

  useEffect(() => { if (pestania === 'cobranza' && !verCobranza) setPestania('servicio'); }, [verCobranza]);

  const Pest = (k, rot) => html`<button class=${'tab ' + (pestania === k ? 'on' : '')}
    style=${pestania === k ? 'background:var(--azul-claro);color:var(--azul)' : 'color:var(--suave)'}
    onClick=${() => setPestania(k)}>${rot}</button>`;

  /* Estado, fecha de visita, horas, encuesta, técnicos y comentarios internos:
     en un trabajo nuevo esto todavía no se sabe -- se completa después, al
     coordinar o al cumplir la visita -- así que en un trabajo nuevo queda
     plegado (ver más abajo) y sólo quedan a la vista Pedido y Observaciones
     del servicio, que es lo que hace falta para anotar el llamado. En un
     trabajo que ya existe se sigue viendo todo abierto, como siempre. */
  const restoAtencion = html`<${Fragment}>
    <div class="rejilla">
      <${Sel} rot="Estado" valor=${b.estado} opts=${opciones('estado')}
        alCambiar=${elegirEstado} disabled=${!edServ} />
      <${Txt} rot="Fecha de visita" tipo="date" valor=${b.fecha_visita}
        alCambiar=${v => c('fecha_visita', v)} disabled=${!edServ} />
      <${HorasMin} rot="Horas de mano de obra" valor=${b.horas_mo}
        alCambiar=${v => c('horas_mo', v)} disabled=${!edServ} />
      <${Sel} rot="Encuesta de satisfacción" valor=${b.encuesta} opts=${opciones('encuesta')}
        alCambiar=${v => c('encuesta', v)} disabled=${!edServ} />
    </div>
    <${Campo} rot="Técnicos asignados">
      <div class="fila" style="gap:6px">
        ${s.tecnicos.filter(t => t.activo || tecs.includes(t.id)).map(t => html`
          <label class="fila mini" style="gap:3px;background:${tecs.includes(t.id) ? 'var(--azul-claro)' : 'var(--campo)'};
            border:1px solid var(--borde);border-radius:14px;padding:2px 9px;cursor:pointer">
            <input type="checkbox" style="width:auto" disabled=${!edServ} checked=${tecs.includes(t.id)}
              onChange=${e => setTecs(e.target.checked ? [...tecs, t.id] : tecs.filter(x => x !== t.id))} />
            ${t.nombre}</label>`)}
      </div>
    <//>
    <${Txt} rot="Comentarios internos" area=${2} valor=${b.comentarios}
      alCambiar=${v => c('comentarios', v)} disabled=${!edObs} />
  <//>`;

  return html`<div class="fondo" onClick=${e => e.target.className === 'fondo' && alCerrar()}>
    <div class="ficha">
      <div class="ficha-cab">
        <h2>${nuevo ? 'Nuevo trabajo' : (b.n_llamada || '#' + id)}</h2>
        ${!nuevo && html`<${Et} txt=${b.estado} mapa=${COLOR_ESTADO} />`}
        <span class="mini">${b.cliente_id ? (cli && cli.nombre) : ''}${eq ? ' · ' + eq.n_serie : ''}</span>
        <button class="btn sec chico" style="margin-left:auto" onClick=${alCerrar}>Cerrar</button>
      </div>
      <div class="fila" style="padding:6px 12px;border-bottom:1px solid var(--borde)">
        ${Pest('servicio', 'Servicio')}
        ${verCobranza && Pest('cobranza', 'Cobranza')}
        ${Pest('equipo', 'Equipo y cliente')}
        ${!nuevo && Pest('historial', `Historial (${historialEquipo.length})`)}
      </div>
      <div class="ficha-cuerpo">
        ${nuevo && deudaCliente.length > 0 && html`<div class="aviso alerta">
          <b>⚠ Pendiente la gestión de cobranza</b>
          <div class="mini">Este cliente tiene ${deudaCliente.length} trabajo${deudaCliente.length > 1 ? 's' : ''} viejo
            sin cerrar o cerrado con un pago pendiente. Chequeá con Administración si existe un pendiente de pago antes
            de coordinar esta visita; si lo hay, recordale al cliente que debe estar al día, sin deudas, para poder
            coordinarla.</div>
        </div>`}
        ${avisoCobranza && html`<${Modal} titulo="Pendiente la gestión de cobranza" alCerrar=${() => setAvisoCobranza(false)} ancho=${480}>
          <p>Este cliente tiene trabajos viejos sin cerrar o cerrados con un pago pendiente:</p>
          <ul class="mini" style="margin:6px 0 12px;padding-left:18px">
            ${deudaCliente.slice(0, 8).map(t => html`<li key=${t.id}>${t.n_llamada || '#' + t.id} ·
              ${fecha(t.fecha_visita, 1) || 'sin fecha'} ·
              ${t.cierre === CIERRE_PENDIENTE_COBRANZA ? 'Pendiente de cobranza' : 'Sin cerrar'}</li>`)}
            ${deudaCliente.length > 8 && html`<li>y ${deudaCliente.length - 8} más…</li>`}
          </ul>
          <p><b>Chequeá con Administración si existe un pendiente de pago.</b> En caso de que lo haya, recordale al

          <div class="fila" style="justify-content:flex-end;margin-top:10px">
            <button class="btn" onClick=${() => setAvisoCobranza(false)}>Entendido</button>
          </div>
        <//>`}
        ${puedeVerPlata() && !nuevo && b.estado === 'CUMPLIDO' && estaAbierto(b2) && html`
          <div class="aviso-cierre">
            <div class="crece">
              <b>⚠ Trabajo cumplido pero ABIERTO</b>
              ${falta.length
                ? html`<div class="mini">Para cerrarlo falta ${falta.join(' y ')}.${
                    esAdmin()
                      ? ' Como administrador podés cerrarlo igual.'
                      : (soloFaltanObservaciones(b2)
                          ? ' Sólo el administrador puede cerrarlo sin las observaciones.'

            ${edCob && html`<div class="fila" style="gap:6px;flex-wrap:wrap">
              ${falta.length && !esAdmin()
                ? html`<button class="btn sec" title=${'Falta ' + falta.join(' y ')}

              <button class="btn sec" disabled=${guardando}

                onClick=${() => guardar({ cierre: CIERRE_PENDIENTE_COBRANZA })}>Cerrar (pendiente de cobranza)</button>
            </div>`}

        ${puedeVerPlata() && !nuevo && (b2.cierre === 'CERRADO' || b2.cierre === CIERRE_PENDIENTE_COBRANZA) && html`

              <${Sel} rot="Tipo de servicio" valor=${b.tipo_servicio} opts=${opciones('tipo_servicio')}

              <${Sel} rot="Prioridad" valor=${b.prioridad} opts=${opciones('prioridad')}

          <fieldset><legend>Atención</legend>
            <${Txt} rot="Observaciones del servicio" area=${3} valor=${b.obs_servicio}
              alCambiar=${v => c('obs_servicio', v)} disabled=${!edObs} />
            ${nuevo
              ? html`<details>

        ${pestania === 'cobranza' && html`<div>
          <div class="aviso">
            ${edCob
              ? html`<div>
                  <b>Se guarda directo en Cobranza.</b>
                  <div class="mini">Cada campo se guarda apenas se completa, igual que en el módulo
                    <b>Cobranza</b>: así no se pisa nada si alguien más está tocando este mismo
                    trabajo al mismo tiempo.</div>
                </div>`
              : html`<div>
                  <b>Esto es un reflejo de cómo quedó en Cobranza.</b>
                  <div class="mini">Acá se ve el estado administrativo del trabajo; se carga y se corrige
                    desde el módulo <b>Cobranza</b>, que es donde vive ese circuito.</div>
                </div>`}
          </div>

          <fieldset><legend>Facturación</legend>
            <div class="fila" style="flex-wrap:wrap;gap:18px;align-items:flex-end">
              ${puedeMontos() && (edCob
                ? html`<${Campo} rot="Precio sin IVA">
                    <${CampoGrilla} valor=${b2.precio_sin_iva} numero=${true} ancho=${130} titulo="Precio sin IVA"
                      onGuardar=${v => cambiarCobranza({ precio_sin_iva: v })} />
                  <//>`
                : html`<${Dato} rot="Precio sin IVA" val=${plata(b2.precio_sin_iva)} ancho=${130} />`)}
              ${puedeMontos() && (edCob
                ? html`<${Campo} rot="IVA %">
                    <${CampoGrilla} valor=${b2.iva} numero=${true} ancho=${80}
                      placeholder=${String(Number(s.config.iva) || 21)}
                      titulo="Porcentaje de IVA de este trabajo. Vacío = el de Configuración"
                      onGuardar=${v => cambiarCobranza({ iva: v })} />
                  <//>`
                : html`<${Dato} rot="IVA %" val=${ivaDe(b2) + '%'} ancho=${80} />`)}
              ${puedeMontos() && html`<${Dato} rot="Con IVA" ancho=${130}
                val=${b2.precio_sin_iva ? plata((Number(b2.precio_sin_iva) || 0) * (1 + ivaDe(b2) / 100)) : ''} />`}
              ${edCob
                ? html`<${Campo} rot="Facturado / enviado">
                    <select value=${b2.facturado || ''} onChange=${e => cambiarCobranza({ facturado: e.target.value })}>
                      ${opciones('facturado').map(o => html`<option value=${o}>${o}</option>`)}</select>
                  <//>`
                : html`<${Dato} rot="Facturado / enviado" ancho=${140}
                    val=${b2.facturado ? html`<${Et} txt=${b2.facturado} mapa=${COLOR_COBRO} />` : ''} />`}
              ${edCob
                ? html`<${Campo} rot="Fecha de factura">
                    <input type="date" value=${b2.fecha_factura || ''}
                      onChange=${e => cambiarCobranza({ fecha_factura: e.target.value || null })} />
                  <//>`
                : html`<${Dato} rot="Fecha de factura" val=${fecha(b2.fecha_factura, 1)} ancho=${120} />`}
              ${edCob
                ? html`<${Campo} rot="Tipo de factura">
                    <select value=${b2.tipo_factura || ''}
                      onChange=${e => cambiarCobranza({ tipo_factura: e.target.value || null })}>
                      <option value="">—</option>
                      ${opciones('tipo_factura').map(o => html`<option value=${o}>${o}</option>`)}</select>
                  <//>`
                : html`<${Dato} rot="Tipo de factura" val=${b2.tipo_factura} ancho=${110} />`}
            </div>

            <div style="margin-top:10px">
              <div class="mini" style="text-transform:uppercase;letter-spacing:.03em;opacity:.7">Concepto</div>
              ${edCob
                ? html`<${CampoGrilla} valor=${b2.concepto} area=${true} ancho=${420} titulo="Concepto"
                    onGuardar=${v => cambiarCobranza({ concepto: v })} />`
                : (b2.concepto ? html`<div style="white-space:pre-wrap;font-size:14px">${b2.concepto}</div>` : '—')}
            </div>

            <div class="mini" style="margin-top:10px">
              ${edCob
                ? html`<div class="fila" style="gap:10px;align-items:center;flex-wrap:wrap">
                    <label class="fila" style="gap:6px;cursor:pointer">
                      <input type="checkbox" style="width:auto" checked=${!!b2.factura_solicitada}
                        onChange=${e => cambiarCobranza({ factura_solicitada: e.target.checked,
                          fecha_solicitud_factura: e.target.checked ? (b2.fecha_solicitud_factura || hoyISO()) : null })} />
                      Factura solicitada a Administración
                    </label>
                    ${b2.factura_solicitada && html`<input type="date" style="width:140px"
                        title="Fecha en que se pidió la factura a Administración"
                        value=${b2.fecha_solicitud_factura || ''}
                        onChange=${e => cambiarCobranza({ fecha_solicitud_factura: e.target.value || null })} />`}
                  </div>`
                : html`<span>Factura solicitada: ${b2.factura_solicitada
                    ? 'Sí' + (b2.fecha_solicitud_factura ? ' · ' + fecha(b2.fecha_solicitud_factura, 1) : '')
                    : 'No'}</span>`}
            </div>
          </fieldset>

          <fieldset><legend>Cobro</legend>
            <div class="fila" style="flex-wrap:wrap;gap:18px;align-items:flex-end">
              ${edCob
                ? html`<${Campo} rot="Cobrado">
                    <select value=${b2.cobrado || ''} onChange=${e => marcarCobro(e.target.value)}>
                      ${opciones('cobrado').map(o => html`<option value=${o}>${o}</option>`)}</select>
                  <//>`
                : html`<${Dato} rot="Cobrado" ancho=${130}
                    val=${b2.cobrado ? html`<${Et} txt=${b2.cobrado} mapa=${COLOR_COBRO} />` : ''} />`}
              ${edCob
                ? html`<${Campo} rot="Fecha de pago">
                    <input type="date" value=${b2.fecha_pago || ''}
                      onChange=${e => cambiarCobranza({ fecha_pago: e.target.value || null })} />
                  <//>`
                : html`<${Dato} rot="Fecha de pago" val=${fecha(b2.fecha_pago, 1)} ancho=${120} />`}
              <${Dato} rot="Cierre" ancho=${130}
                val=${b.estado === 'CUMPLIDO' ? html`<${MarcaCierre} t=${b2} />` : '—'} />
            </div>

            <div style="margin-top:10px">
              <div class="mini" style="text-transform:uppercase;letter-spacing:.03em;opacity:.7">Observaciones de cobranza</div>
              ${edCob
                ? html`<${CampoGrilla} valor=${b2.obs_cobranza} area=${true} ancho=${420} titulo="Observaciones de cobranza"
                    onGuardar=${v => cambiarCobranza({ obs_cobranza: v })} />`
                : (b2.obs_cobranza ? html`<div style="white-space:pre-wrap;font-size:14px">${b2.obs_cobranza}</div>` : '—')}
            </div>

            ${cli && html`<div class="mini" style="margin-top:8px">
              ${edCob
                ? html`<div class="fila" style="gap:10px;flex-wrap:wrap;align-items:center">
                    <span>Datos de facturación del cliente:</span>
                    <${CampoGrilla} valor=${cli.cuit_dni} ancho=${120} titulo="CUIT / CUIL / DNI del cliente"
                      placeholder="CUIT/CUIL/DNI" onGuardar=${v => cambiarDatosCliente({ cuit_dni: v })} />
                    <${CampoGrilla} valor=${cli.correo} ancho=${190} titulo="Correo del cliente, para enviarle la factura"
                      placeholder="Correo" onGuardar=${v => cambiarDatosCliente({ correo: v })} />
                  </div>`
                : html`Datos de facturación del cliente:
                    ${cli.cuit_dni || 'sin CUIT/DNI'} · ${cli.correo || 'sin correo'}`}
            </div>`}
          </fieldset>

          ${edCob && html`<div class="fila" style="justify-content:flex-end">
            <button class="btn sec" title="Abre Cobranza con este trabajo ya buscado"
              onClick=${() => { set({ vista: 'cobranza', irACobranza: id }); alCerrar(); }}>
              Abrir este trabajo en Cobranza →</button>
          </div>`}
        </div>`}

        ${pestania === 'equipo' && html`<div>
          <fieldset><legend>Equipo</legend>
            <${Autocompletar} rot="N° de serie" valor=${eq} lista=${s.equipos}
              textoDe=${e => `${e.n_serie} — ${e.modelo || ''} ${e.n_paradas || ''} · ${
                (s.clientes.find(c2 => c2.id === e.cliente_id) || {}).nombre || 'sin cliente'}`}
              alElegir=${elegirEquipo} placeholder="Buscar por N° de serie o cliente…"
              deshabilitado=${!edServ} />
            ${edServ && puedeMaestros() && html`<div class="fila mini" style="margin:-4px 0 6px">
              <span>¿El equipo todavía no está cargado?</span>
              <button class="btn sec chico" onClick=${() => setCreando('equipo')}>+ Equipo nuevo</button>
            </div>`}
            ${eq && html`<div class="mini" style="margin:-2px 0 6px">
              Titular registrado del equipo: <b>${titular ? titular.nombre : 'sin cliente asignado'}</b>
            </div>`}
            ${distintoTitular && html`<div class="aviso ojo">
              <b>El equipo figura a nombre de otro cliente.</b>
              <div class="mini">En este trabajo queda <b>${cli ? cli.nombre : ''}</b>, que es lo que se
                imprime en la hoja del técnico. El equipo sigue registrado a nombre de${' '}
                <b>${titular ? titular.nombre : '—'}</b>.</div>
              <div class="fila" style="margin-top:6px">
                ${edServ && puedeMaestros() && html`<button class="btn sec chico" onClick=${pasarTitular}>
                  El equipo cambió de dueño: pasarlo a ${cli ? cli.nombre : 'este cliente'}</button>`}
                ${edServ && titular && html`<button class="btn sec chico"
                  onClick=${() => c('cliente_id', eq.cliente_id)}>
                  Me equivoqué: usar ${titular.nombre}</button>`}
              </div>
            </div>`}
            ${eq && html`<div class="rejilla mini">
              <div>Modelo: <b>${eq.modelo || '—'}</b></div>
              <div>Paradas: <b>${eq.n_paradas || '—'}</b></div>
              <div>Motorización: <b>${eq.motorizacion || '—'}</b></div>
              <div>Puerta: <b>${eq.puerta || '—'}</b></div>
              <div>Instalado: <b>${fecha(eq.fecha_instalacion, 1) || '—'}</b></div>
              <div>Ciudad: <b>${eq.ciudad || '—'}</b></div>
              <div>Provincia: <b>${eq.provincia || '—'}</b></div>
              <div style="grid-column:1/-1">Dirección de instalación: <b>${eq.direccion || '—'}</b></div>
            </div>`}
            ${eq && !eq.direccion && cli && cli.direccion && html`<div class="mini" style="opacity:.8">
              El equipo todavía no tiene cargada su propia dirección: mientras tanto se usa la del
              cliente (${cli.direccion}) en la grilla y en la hoja de ruta.</div>`}
            <div class="mini">La dirección donde está instalado el equipo se carga y se corrige acá,
              en la ficha del <b>Equipo</b> (solapa <b>Clientes y equipos</b>): es la que se usa en
              toda la aplicación para saber adónde ir, aunque el cliente del trabajo cambie.</div>
          </fieldset>
          <fieldset><legend>Cliente</legend>
            <${Autocompletar} rot="Cliente" valor=${cli} lista=${s.clientes}
              textoDe=${c2 => `${c2.nombre}${c2.ciudad ? ' — ' + c2.ciudad : ''}`}
              alElegir=${x => c('cliente_id', x ? x.id : null)} placeholder="Buscar cliente…"
              deshabilitado=${!edServ} />
            ${edServ && puedeMaestros() && html`<div class="fila mini" style="margin:-4px 0 6px">
              <span>¿Es un cliente nuevo?</span>
              <button class="btn sec chico" onClick=${() => setCreando('cliente')}>+ Cliente nuevo</button>
            </div>`}
            ${cli && html`<div class="rejilla mini">
              <div>Teléfono: <b>${cli.telefono || '—'}</b></div>

              <span class="mini crece">${historialEquipo.length} intervenciones ·

            </div>
            ${!historialEquipo.length && html`<div class="mini">Sin antecedentes cargados.</div>`}
            <div class="linea-tiempo">
              ${historialEquipo.slice(0, 60).map(t => html`<${LineaHistorial} key=${t.id} t=${t} />`)}
            </div>
          </fieldset>
          <fieldset><legend>Cambios registrados</legend>
            ${!audit && html`<div class="mini">Cargando…</div>`}
            ${audit && !audit.length && html`<div class="mini">Sin cambios desde la migración.</div>`}
            <div class="linea-tiempo">
              ${(audit || []).map(a => html`<div class="ev">
                <b>${momento(a.fecha)}</b> · ${a.usuario || 'sistema'} · ${a.accion}
                ${a.cambios && html`<div class="mini">${Object.keys(a.cambios).map(k =>
                  `${k}: ${JSON.stringify(a.cambios[k][0])} → ${JSON.stringify(a.cambios[k][1])}`).join(' · ')}</div>`}
              </div>`)}
            </div>
          </fieldset>
        </div>`}
      </div>
      <div class="ficha-pie">
        <span class="mini">${!nuevo && b.actualizado_en
          ? `Última modificación: ${momento(b.actualizado_en)}${b.actualizado_por ? ' por ' + b.actualizado_por : ''}`
          : ''}</span>
        <div style="margin-left:auto" class="fila">
          <button class="btn sec" onClick=${alCerrar}>Cancelar</button>
          ${editable && html`<button class="btn" disabled=${guardando} onClick=${() => guardar()}>
            ${guardando ? 'Guardando…' : 'Guardar'}</button>`}
        </div>
      </div>
    </div>
    ${creando === 'cliente' && html`<${NuevoCliente} alCerrar=${() => setCreando(null)}
      alCrear=${x => c('cliente_id', x.id)} />`}
    ${creando === 'equipo' && html`<${NuevoEquipo} clienteId=${b.cliente_id}
      alCerrar=${() => setCreando(null)}
      alCrear=${x => setB(y => ({ ...y, equipo_id: x.id, cliente_id: x.cliente_id || y.cliente_id }))} />`}
    ${verHistorial && html`<${HistorialImprimible} equipoId=${b.equipo_id}
      alCerrar=${() => setVerHistorial(false)} />`}
  </div>`;
}


/* ===== 31_borrar.js ===== */
/* =====================================================================
   BORRAR UN REGISTRO  (sólo el administrador)
   Se guarda una copia completa antes de borrar, así que siempre se puede
   recuperar. La copia queda en la base, en trabajos_borrados.
   ===================================================================== */
function BorrarTrabajo({ t, alCerrar }) {
  const [motivo, setMotivo] = useState('');
  const [confirma, setConfirma] = useState('');
  const [yendo, setYendo] = useState(false);
  const rotulo = t.n_llamada || '#' + t.id;
  const listo = confirma.trim().toUpperCase() === 'BORRAR';

  async function borrar() {
    setYendo(true);
    try {
      const { error } = await cliente().rpc('fn_borrar_trabajo',
        { p_id: t.id, p_motivo: motivo || null });
      if (error) throw error;
      set({ trabajos: S.trabajos.filter(x => String(x.id) !== String(t.id)) });
      toast(`Se borró ${rotulo}. Queda una copia recuperable en la base.`, 'ok');
      alCerrar();
    } catch (e) {
      set({ errorGrave: {
        titulo: 'No se pudo borrar el registro',
        detalle: e.message || String(e),
        pista: /no existe|does not exist/i.test(e.message || '')
          ? 'Falta correr 13_borrado_y_usuarios.sql en el editor SQL de Supabase.'
          : /administrador/i.test(e.message || '')
          ? 'Sólo el usuario administrador puede borrar registros.' : null,
      } });
    }
    setYendo(false);
  }

  return html`<${Modal} titulo=${'Borrar ' + rotulo} alCerrar=${alCerrar}>
    <div class="aviso error">
      <b>Vas a borrar este registro del Registro de Service.</b>
      <div class="mini">Deja de aparecer en la grilla, en las giras y en cobranza.</div>
    </div>
    <div class="rejilla mini" style="margin-bottom:8px">
      <div>Cliente: <b>${t.cliente_nombre || '—'}</b></div>
      <div>Equipo: <b>${t.n_serie || '—'}</b></div>
      <div>Estado: <b>${t.estado || '—'}</b></div>
      <div>Fecha: <b>${fecha(t.fecha_visita, 1) || '—'}</b></div>
      ${puedeVerPlata() && Number(t.precio_sin_iva) > 0
        && html`<div>Precio: <b>${plata(t.precio_sin_iva)}</b></div>`}
      ${t.tecnicos && html`<div>Técnico: <b>${t.tecnicos}</b></div>`}
    </div>
    ${t.obs_servicio && html`<div class="mini" style="margin-bottom:8px">“${t.obs_servicio}”</div>`}
    <div class="aviso">
      Antes de borrarlo se guarda una copia completa. Si te arrepentís, un administrador lo
      puede recuperar desde <b>Administración → Registros borrados</b>.
    </div>
    <${Txt} rot="Motivo (opcional, queda registrado)" valor=${motivo} alCambiar=${setMotivo}
      placeholder="Cargado por duplicado, error de carga…" />
    <${Txt} rot="Escribí BORRAR para confirmar" valor=${confirma} alCambiar=${setConfirma}
      placeholder="BORRAR" />
    <div class="fila" style="justify-content:flex-end;margin-top:6px">
      <button class="btn sec" onClick=${alCerrar}>Cancelar</button>
      <button class="btn alerta" disabled=${!listo || yendo} onClick=${borrar}>
        ${yendo ? 'Borrando…' : 'Borrar el registro'}</button>
    </div>
  <//>`;
}

/* ---------------------------------------------------------------------
   REGISTROS BORRADOS — se ven y se recuperan desde Administración
   --------------------------------------------------------------------- */
function RegistrosBorrados() {
  const [lista, setLista] = useState(null);
  const [msg, setMsg] = useState(null);

  async function traer() {
    const { data, error } = await cliente().from('trabajos_borrados')
      .select('*').order('borrado_en', { ascending: false }).limit(200);
    if (error) { setMsg(error.message); setLista([]); return; }
    setLista(data || []);
  }
  useEffect(() => { traer(); }, []);

  async function restaurar(b) {
    const { error } = await cliente().rpc('fn_restaurar_trabajo', { p_id: b.id });
    if (error) return toast('No se pudo recuperar: ' + error.message, 'error');
    toast('Registro recuperado: vuelve a estar en el Registro de Service', 'ok');
    await cargarDatos();
    traer();
  }

  if (lista === null) return html`<div class="panel"><div class="panel-cuerpo mini">Buscando…</div></div>`;

  return html`<div class="panel">
    <div class="panel-cab"><h2>Registros borrados</h2>
      <span class="mini">Copia de seguridad de lo que se borró del Registro de Service.
        Se puede devolver a su lugar en cualquier momento.</span>
      <button class="btn sec chico" style="margin-left:auto" onClick=${traer}>Actualizar</button>
    </div>
    <div class="panel-cuerpo">
      ${msg && html`<div class="aviso error">${msg}</div>`}
      ${!lista.length && !msg && html`<div class="mini">No se borró ningún registro todavía.</div>`}
      ${lista.length > 0 && html`<table class="grilla">
        <thead><tr><th>N° LL</th><th>Cliente</th><th>Equipo</th><th>Estado</th>
          <th>Motivo</th><th>Borrado por</th><th>Cuándo</th><th></th></tr></thead>
        <tbody>${lista.map(b => html`<tr key=${b.id}>
          <td><b>${(b.datos || {}).n_llamada || '#' + b.id}</b></td>
          <td>${nombreCliente((b.datos || {}).cliente_id)}</td>
          <td>${nombreEquipo((b.datos || {}).equipo_id)}</td>
          <td>${(b.datos || {}).estado || ''}</td>
          <td class="mini">${b.motivo || ''}</td>
          <td class="mini">${b.borrado_por || ''}</td>
          <td class="mini">${momento(b.borrado_en)}</td>
          <td><button class="btn sec chico" onClick=${() => restaurar(b)}>Recuperar</button></td>
        </tr>`)}</tbody>
      </table>`}
    </div>
  </div>`;
}
function nombreCliente(id) {
  const c = S.clientes.find(x => String(x.id) === String(id));
  return c ? c.nombre : '';
}
function nombreEquipo(id) {
  const e = S.equipos.find(x => String(x.id) === String(id));
  return e ? e.n_serie : '';
}


/* ===== 32_altas.js ===== */
/* =====================================================================
   ALTA RÁPIDA DE CLIENTE Y DE EQUIPO
   Para poder cargar un trabajo de un cliente o un equipo que todavía no
   están en la base, sin salir de la ficha.
   ===================================================================== */
function NuevoCliente({ inicial, alCerrar, alCrear }) {
  const [b, setB] = useState({ nombre: inicial || '', ciudad: '', provincia: '', direccion: '',
                               telefono: '', correo: '', cuit_dni: '' });
  const [yendo, setYendo] = useState(false);
  const c = (k, v) => setB(x => ({ ...x, [k]: v }));
  const nombre = (b.nombre || '').trim();

  // avisa si ya hay uno parecido, para no duplicar la cartera
  const parecidos = useMemo(() => {
    const n = sinAcentos(nombre);
    if (n.length < 4) return [];
    return S.clientes.filter(x => sinAcentos(x.nombre).includes(n)
      || n.includes(sinAcentos(x.nombre))).slice(0, 4);
  }, [nombre]);

  async function guardar() {
    setYendo(true);
    const cuerpo = {};
    Object.keys(b).forEach(k => { cuerpo[k] = (b[k] || '').trim() || null; });
    cuerpo.nombre = nombre;
    const { data, error } = await cliente().from('clientes').insert(cuerpo).select('*').single();
    setYendo(false);
    if (error) return toast('No se pudo crear el cliente: ' + error.message, 'error');
    set({ clientes: [...S.clientes, data].sort((x, y) => x.nombre.localeCompare(y.nombre, 'es')) });
    toast('Cliente creado', 'ok');
    alCrear(data);
    alCerrar();
  }

  return html`<${Modal} titulo="Nuevo cliente" alCerrar=${alCerrar}>
    <${Txt} rot="Nombre o razón social" valor=${b.nombre} alCambiar=${v => c('nombre', v)} />
    ${parecidos.length > 0 && html`<div class="aviso ojo">
      <b>Ojo: ya hay clientes parecidos.</b>
      <div class="mini">${parecidos.map(x => x.nombre + (x.ciudad ? ' (' + x.ciudad + ')' : '')).join(' · ')}</div>
      <div class="mini">Si es alguno de esos, cancelá y buscalo en el buscador en lugar de crearlo de nuevo.</div>
    </div>`}
    <div class="rejilla">
      <${Txt} rot="Ciudad" valor=${b.ciudad} alCambiar=${v => c('ciudad', v)} />
      <${Sel} rot="Provincia" valor=${b.provincia} opts=${opciones('provincia')}
        alCambiar=${v => c('provincia', v)} />
    </div>
    <${Txt} rot="Dirección" valor=${b.direccion} alCambiar=${v => c('direccion', v)} />
    <div class="rejilla">
      <${Txt} rot="Teléfono" valor=${b.telefono} alCambiar=${v => c('telefono', v)} />
      <${Txt} rot="CUIT / DNI" valor=${b.cuit_dni} alCambiar=${v => c('cuit_dni', v)} />
    </div>
    <${Txt} rot="Correo" tipo="email" valor=${b.correo} alCambiar=${v => c('correo', v)} />
    <div class="fila" style="justify-content:flex-end;margin-top:4px">
      <button class="btn sec" onClick=${alCerrar}>Cancelar</button>
      <button class="btn" disabled=${!nombre || yendo} onClick=${guardar}>
        ${yendo ? 'Creando…' : 'Crear cliente'}</button>
    </div>
  <//>`;
}

function NuevoEquipo({ inicial, clienteId, alCerrar, alCrear }) {
  const s = useS();
  const [b, setB] = useState({ n_serie: inicial || '', modelo: '', n_paradas: '', motorizacion: '',
                               puerta: '', fecha_instalacion: '', cliente_id: clienteId || null,
                               ciudad: '', provincia: '', direccion: '' });
  const [yendo, setYendo] = useState(false);
  const [creandoCliente, setCreandoCliente] = useState(false);
  const c = (k, v) => setB(x => ({ ...x, [k]: v }));
  const serie = (b.n_serie || '').trim();
  const repetido = S.equipos.find(e => sinAcentos(e.n_serie) === sinAcentos(serie));
  const cli = s.clientes.find(x => String(x.id) === String(b.cliente_id));

  /* Al elegir el cliente se completa la dirección del equipo SÓLO si todavía
     está vacía: es un punto de partida para no volver a tipear cuando es el
     único equipo de ese cliente, pero cada equipo tiene su propia dirección
     de instalación (un mismo cliente puede tener varios, en puntos
     distintos) y siempre se puede corregir acá antes de guardar. */
  const elegirCliente = x => setB(y => ({
    ...y, cliente_id: x ? x.id : null,
    ciudad: y.ciudad || (x && x.ciudad) || '',
    provincia: y.provincia || (x && x.provincia) || '',
    direccion: y.direccion || (x && x.direccion) || '',
  }));

  async function guardar() {
    setYendo(true);
    const cuerpo = {
      n_serie: serie, modelo: (b.modelo || '').trim() || null,
      n_paradas: (b.n_paradas || '').trim() || null,
      motorizacion: (b.motorizacion || '').trim() || null,
      puerta: (b.puerta || '').trim() || null,
      fecha_instalacion: b.fecha_instalacion || null,
      cliente_id: b.cliente_id || null,
      ciudad: (b.ciudad || '').trim() || null,
      provincia: (b.provincia || '').trim() || null,
      direccion: (b.direccion || '').trim() || null,
    };
    const { data, error } = await cliente().from('equipos').insert(cuerpo).select('*').single();
    setYendo(false);
    if (error) return toast('No se pudo crear el equipo: ' + error.message, 'error');
    set({ equipos: [...S.equipos, data].sort((x, y) => String(x.n_serie).localeCompare(String(y.n_serie), 'es')) });
    toast('Equipo creado', 'ok');
    alCrear(data);
    alCerrar();
  }

  return html`<${Modal} titulo="Nuevo equipo" alCerrar=${alCerrar}>
    <${Txt} rot="N° de serie" valor=${b.n_serie} alCambiar=${v => c('n_serie', v)}
      placeholder="A123G" />
    ${repetido && html`<div class="aviso error">
      Ese número de serie ya existe (${repetido.modelo || 'sin modelo'}). Cancelá y buscalo en lugar de crearlo.
    </div>`}
    <${Autocompletar} rot="Cliente del equipo" valor=${cli} lista=${s.clientes}
      textoDe=${x => `${x.nombre}${x.ciudad ? ' — ' + x.ciudad : ''}`}
      alElegir=${elegirCliente} placeholder="Buscar cliente…" />
    <div class="fila mini" style="margin:-4px 0 6px">
      <span>¿Es un cliente nuevo?</span>
      <button class="btn sec chico" onClick=${() => setCreandoCliente(true)}>+ Cliente nuevo</button>
    </div>
    <div class="mini" style="margin-bottom:2px">El cliente es el dato de contacto y facturación.
      Cada equipo (cada número de serie) tiene su propia dirección de instalación, aunque
      pertenezca al mismo cliente que otros equipos en puntos distintos: se carga abajo.</div>
    <div class="rejilla">
      <${Sel} rot="Modelo" valor=${b.modelo} opts=${opciones('modelo')}
        alCambiar=${v => c('modelo', v)} />
      <${Sel} rot="Paradas" valor=${b.n_paradas} opts=${opciones('n_paradas')}
        alCambiar=${v => c('n_paradas', v)} />
    </div>
    <div class="rejilla">
      <${Sel} rot="Motorización" valor=${b.motorizacion} opts=${opciones('motorizacion')}
        alCambiar=${v => c('motorizacion', v)} />
      <${Sel} rot="Puerta" valor=${b.puerta} opts=${opciones('puerta')}
        alCambiar=${v => c('puerta', v)} />
    </div>
    <${Txt} rot="Fecha de instalación" tipo="date" valor=${b.fecha_instalacion}
      alCambiar=${v => c('fecha_instalacion', v)} />
    <div class="mini" style="margin-bottom:8px">La fecha de instalación es la que usa el sistema
      para marcar en rojo los trabajos de equipos con menos de un mes.</div>
    <div class="rejilla">
      <${Txt} rot="Ciudad de instalación" valor=${b.ciudad} alCambiar=${v => c('ciudad', v)} />
      <${Sel} rot="Provincia de instalación" valor=${b.provincia} opts=${opciones('provincia')}
        alCambiar=${v => c('provincia', v)} />
    </div>
    <${Txt} rot="Dirección de instalación" valor=${b.direccion} alCambiar=${v => c('direccion', v)} />
    <div class="fila" style="justify-content:flex-end;margin-top:4px">
      <button class="btn sec" onClick=${alCerrar}>Cancelar</button>
      <button class="btn" disabled=${!serie || !!repetido || yendo} onClick=${guardar}>
        ${yendo ? 'Creando…' : 'Crear equipo'}</button>
    </div>
    ${creandoCliente && html`<${NuevoCliente} alCerrar=${() => setCreandoCliente(false)}
      alCrear=${x => c('cliente_id', x.id)} />`}
  <//>`;
}

              <b>${fecha(x.fecha_visita, 1) || '—'}</b>
              <span>${x.tipo_servicio || ''}${x.tipo_pedido ? ' · ' + x.tipo_pedido : ''}</span>
              ${x.horas_mo ? html`<span class="et gris">${x.horas_mo} h</span>` : null}
              <span class="crece"></span>
              <${Et} txt=${x.estado} mapa=${COLOR_ESTADO} />
            </div>
            ${x.tecnicos && html`<div class="mini">Técnico: ${x.tecnicos}</div>`}
            ${x.obs_servicio && html`<div class="mini"><b>Trabajo realizado:</b> ${x.obs_servicio}</div>`}
            ${x.comentarios && html`<div class="mini"><b>Resolución:</b> ${x.comentarios}</div>`}
          </div>`)}
        </fieldset>
      </div>
      <div class="ficha-pie">
        <span class="mini">Última modificación: ${momento(t.actualizado_en)}
          ${t.actualizado_por ? ' por ' + t.actualizado_por : ''}</span>
        <div class="fila" style="margin-left:auto">
          <button class="btn sec" onClick=${alCerrar}>Cerrar</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* =====================================================================
   HISTORIAL DE SERVICE DEL EQUIPO — versión imprimible (sin datos de pago)
   ===================================================================== */
function HistorialImprimible({ equipoId, alCerrar }) {
  const s = useS();
  const eq = s.equipos.find(e => e.id === equipoId);
  const cli = eq && s.clientes.find(c => c.id === eq.cliente_id);
  const [desde, setDesde] = useState('');
  const caja = useRef(null);            // la caja que se desplaza de costado

  useEffect(() => {
    document.body.classList.add('imprimiendo');
    return () => document.body.classList.remove('imprimiendo');
  }, []);

  const lista = useMemo(() => s.trabajos
    .filter(t => t.equipo_id === equipoId && t.estado === 'CUMPLIDO')
    .filter(t => !desde || (t.fecha_visita || '') >= desde)
    .sort((a, b) => String(b.fecha_visita || '').localeCompare(String(a.fecha_visita || ''))),
    [s.trabajos, equipoId, desde]);

  const horas = lista.reduce((a, t) => a + (Number(t.horas_mo) || 0), 0);
  const anios = [...new Set(s.trabajos.filter(t => t.equipo_id === equipoId)
    .map(t => String(t.fecha_visita || '').slice(0, 4)).filter(Boolean))].sort();

  if (!eq) return null;
  return html`<div class="fondo" style="justify-content:center;align-items:flex-start;padding:14px;overflow:auto">
    <div class="panel hoja-impresion" style="width:100%;max-width:1060px;background:var(--papel)">
      <div class="panel-cab no-imprimir">
        <h2>Historial de service — ${eq.n_serie}</h2>
        <${Sel} valor=${desde} opts=${anios.map(a => a + '-01-01')} vacio="Desde: todo el historial"
          alCambiar=${v => setDesde(v || '')} />
        <span class="mini">Sin importes ni datos de cobranza: se puede entregar al cliente.</span>
        <div style="margin-left:auto" class="fila">
          <button class="btn" onClick=${() => window.print()}>Imprimir / guardar PDF</button>
          <button class="btn sec" onClick=${alCerrar}>Cerrar</button>
        </div>
      </div>
      <div class="panel-cuerpo">
        <div class="encabezado-hoja">
          <div>
            <img class="logo-hoja" src=${LOGO_NEGRO} alt="ENSA" />
            <div class="titulo-hoja">Historial de service</div>
            <div class="mini">Equipo <b>${eq.n_serie}</b> · modelo ${eq.modelo || '—'} ·
              ${eq.n_paradas || '—'} · ${eq.motorizacion || '—'} · puerta ${eq.puerta || '—'}
              ${eq.fecha_instalacion ? ` · instalado el ${fecha(eq.fecha_instalacion, 1)}` : ''}</div>
          </div>
          <div class="mini der">
            <div><b>${cli ? cli.nombre : ''}</b></div>
            <div>${eq.direccion || (cli && cli.direccion) || ''}</div>
            <div>${eq.ciudad || (cli && cli.ciudad) || ''}${eq.provincia ? ', ' + eq.provincia : ''}</div>
          </div>
        </div>

        <div class="tabla-caja" style="max-height:none" ref=${caja}>
          <table class="grilla planilla">
            <colgroup>
              <col style="width:7%" /><col style="width:11%" /><col style="width:10%" />
              <col style="width:14%" /><col style="width:5%" /><col style="width:28%" />
              <col style="width:25%" />
            </colgroup>
            <thead><tr>
              <th style="min-width:74px">Fecha</th>
              <th style="min-width:96px">Tipo de Pedido</th>
              <th style="min-width:92px">Tipo de Servicio</th>
              <th style="min-width:150px">Técnico interveniente</th>
              <th style="min-width:48px">Horas</th>
              <th style="min-width:230px">Trabajos realizados</th>
              <th style="min-width:200px">Resolución</th>
            </tr></thead>
            <tbody>
              ${lista.map(t => html`<tr key=${t.id}>
                <td><b>${fecha(t.fecha_visita, 1)}</b></td>
                <td>${t.tipo_pedido || ''}</td>
                <td>${t.tipo_servicio || ''}</td>
                <td>${t.tecnicos || ''}</td>
                <td class="num">${t.horas_mo || ''}</td>
                <td class="largo">${t.obs_servicio || ''}</td>
                <td class="largo">${t.comentarios || ''}</td>
              </tr>`)}
            </tbody>
          </table>
          <${Deslizador} para=${caja} />
        </div>
        ${!lista.length && html`<div class="vacio">Todavía no hay trabajos cumplidos en este equipo.</div>`}

        <div class="pie-hoja mini">
          <span><b>${lista.length}</b> intervenciones${desde ? ' desde ' + fecha(desde, 1) : ''}</span>
          ${horas > 0 && html`<span><b>${horas}</b> horas de mano de obra</span>`}
          <span>Emitido el ${fecha(hoyISO(), 1)}</span>
        </div>
      </div>
    </div>
  </div>`;
}

/* ===== 40_gira.js ===== */
/* =====================================================================
   MÓDULO 2 — GIRA / HOJA DE RUTA SEMANAL
   ===================================================================== */
function Giras() {
  const s = useS();
  const [giraId, setGiraId] = useState(() => (s.giras[0] && s.giras[0].id) || null);
  const [busca, setBusca] = useState('');
  const [imprimir, setImprimir] = useState(false);
  const [nueva, setNueva] = useState(false);
  const [fichaId, setFichaId] = useState(null);
  const [asignando, setAsignando] = useState(null);   // trabajo al que se le elige el día
  const editable = puedeGiras();
  const gira = s.giras.find(g => g.id === giraId);
  const paradas = useMemo(() => s.trabajos.filter(t => t.gira_id === giraId)
    .sort((a, b) => String(a.fecha_visita || '9').localeCompare(String(b.fecha_visita || '9'))
      || (a.orden_gira || 0) - (b.orden_gira || 0)), [s.trabajos, giraId]);

  // Un trabajo PROGRAMADO ya tiene fecha y técnico: no vuelve a la lista para asignar
  const pendientes = useMemo(() => {
    const f = sinAcentos(busca);
    return s.trabajos.filter(t => !t.gira_id && ASIGNABLES.includes(t.estado))
      .filter(t => !f || sinAcentos([t.cliente_nombre, t.n_serie, ciudadDe(t), provinciaDe(t),
        t.n_llamada, t.obs_servicio].join(' ')).includes(f))
      .sort((a, b) => (b.prioridad === 'Alta') - (a.prioridad === 'Alta')
        || String(a.fecha_pedido || '').localeCompare(String(b.fecha_pedido || '')));
  }, [s.trabajos, busca]);

  async function actualizarGira(campos) {
    const { error } = await cliente().from('giras').update(campos).eq('id', giraId);
    if (error) return toast('No se pudo guardar la gira: ' + error.message, 'error');
    set({ giras: S.giras.map(g => g.id === giraId ? { ...g, ...campos } : g) });
  }

  /** Días de la semana de la gira, para elegir cuándo se visita */
  const diasDeLaGira = useMemo(() => {
    if (!gira || !gira.fecha_desde) return [];
    const fin = gira.fecha_hasta && gira.fecha_hasta >= gira.fecha_desde
      ? gira.fecha_hasta : sumarDias(gira.fecha_desde, 5);
    const out = [];
    for (let d = gira.fecha_desde; d <= fin && out.length < 10; d = sumarDias(d, 1)) out.push(d);
    return out;
  }, [gira]);

  async function agregar(t, dia) {
    const orden = paradas.length + 1;
    try {
      await guardarTrabajo(t.id, {
        gira_id: giraId, orden_gira: orden,
        fecha_visita: dia || t.fecha_visita || (gira && gira.fecha_desde) || hoyISO(),
        estado: t.estado === 'PENDIENTE' ? 'PROGRAMADO' : t.estado,
      });
      setAsignando(null);
      toast(`${t.cliente_nombre || 'Trabajo'} agendado para el ${fechaLarga(dia)}`, 'ok');
    } catch (e) { toast('No se pudo agregar: ' + e.message, 'error'); }
  }
  async function quitar(t) {
    try { await guardarTrabajo(t.id, { gira_id: null, orden_gira: null }); }
    catch (e) { toast('No se pudo quitar: ' + e.message, 'error'); }
  }
  async function moverDia(t, iso) {
    try { await guardarTrabajo(t.id, { fecha_visita: iso }); }
    catch (e) { toast('No se pudo mover: ' + e.message, 'error'); }
  }
  const dias = useMemo(() => {
    const m = new Map();
    paradas.forEach(t => {
      const k = t.fecha_visita || 'sin fecha';
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(t);
    });
    return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  }, [paradas]);

  if (!s.giras.length && !nueva) {
    return html`<div class="panel"><div class="panel-cuerpo vacio">
      Todavía no hay giras cargadas.
      ${editable && html`<div style="margin-top:10px"><button class="btn" onClick=${() => setNueva(true)}>
        + Armar la primera gira</button></div>`}
    </div></div>`;
  }

  return html`<div>
    <div class="panel" style="margin-bottom:10px">
      <div class="panel-cab">
        <select style="max-width:330px" value=${giraId || ''} onChange=${e => setGiraId(Number(e.target.value))}>
          ${s.giras.map(g => html`<option value=${g.id}>
            Semana ${g.n_semana || '?'} / ${g.anio || ''} — ${fecha(g.fecha_desde)} · ${g.zona || 'sin zona'}
          </option>`)}
        </select>
        ${editable && html`<button class="btn sec chico" onClick=${() => setNueva(true)}>+ Nueva gira</button>`}
        <div style="margin-left:auto" class="fila">
          <button class="btn" disabled=${!paradas.length}
            onClick=${() => setImprimir(true)}>🖨 Imprimir planilla de trabajos</button>
        </div>
      </div>
      ${gira && html`<div class="panel-cuerpo">
        <div class="rejilla dos">
          <${Txt} rot="Zona" valor=${gira.zona} disabled=${!editable}
            alCambiar=${v => actualizarGira({ zona: v })} />
          <${Txt} rot="Desde" tipo="date" valor=${gira.fecha_desde} disabled=${!editable}
            alCambiar=${v => actualizarGira({ fecha_desde: v, ...semanaCampos(v) })} />
          <${Txt} rot="Hasta" tipo="date" valor=${gira.fecha_hasta} disabled=${!editable}
            alCambiar=${v => actualizarGira({ fecha_hasta: v })} />
          <${Campo} rot="Técnico 1">
            <select disabled=${!editable} value=${gira.tecnico_id || ''}
              onChange=${e => actualizarGira({ tecnico_id: e.target.value ? Number(e.target.value) : null })}>
              <option value="">—</option>
              ${s.tecnicos.filter(t => t.activo).map(t => html`<option value=${t.id}>${t.nombre}</option>`)}
            </select>
          <//>
          <${Campo} rot="Técnico 2">
            <select disabled=${!editable} value=${gira.tecnico2_id || ''}
              onChange=${e => actualizarGira({ tecnico2_id: e.target.value ? Number(e.target.value) : null })}>
              <option value="">—</option>
              ${s.tecnicos.filter(t => t.activo).map(t => html`<option value=${t.id}>${t.nombre}</option>`)}
            </select>
          <//>
          <${Sel} rot="Vehículo" valor=${gira.vehiculo} opts=${opciones('vehiculo')} disabled=${!editable}
            alCambiar=${v => actualizarGira({ vehiculo: v })} />
          <${Txt} rot="Código de viaje" valor=${gira.codigo_viaje} disabled=${!editable}
            alCambiar=${v => actualizarGira({ codigo_viaje: v })} />
          <${Txt} rot="Efectivo entregado al técnico ($)" tipo="number" valor=${gira.viaticos}
            disabled=${!esAdmin()}
            alCambiar=${v => actualizarGira({ viaticos: v, viaticos_entregados: Number(v) > 0 })} />
        </div>
        <div class="fila mini" style="margin-top:2px">
          <label class="fila" style="gap:6px;${esAdmin() ? 'cursor:pointer' : ''}">
            <input type="checkbox" style="width:auto" disabled=${!esAdmin()}
              checked=${!!gira.viaticos_entregados}
              onChange=${e => actualizarGira({ viaticos_entregados: e.target.checked })} />
            Viáticos entregados
          </label>
          <span>${gira.viaticos ? `${plata(gira.viaticos)} en efectivo` : 'Sin viáticos cargados'}
            ${esAdmin() ? '' : ' — sólo el administrador puede modificarlo'}</span>
        </div>
        <${Resumen} items=${[
          ['paradas', paradas.length],
          ['días', dias.length],
          ['cumplidas', paradas.filter(t => t.estado === 'CUMPLIDO').length],
          ['a facturar', plata(paradas.reduce((a, t) => a + (Number(t.precio_sin_iva) || 0), 0))],
        ]} />
      </div>`}
    </div>

    <div class="gira-cols">
      <div class="panel">
        <div class="panel-cab"><h2>Trabajos pendientes (${pendientes.length})</h2></div>
        <div class="panel-cuerpo" style="padding:8px 10px">
          <input placeholder="Filtrar por cliente, ciudad, serie…" value=${busca}
            onInput=${e => setBusca(e.target.value)} />
        </div>
        <div class="pendientes">
          ${pendientes.slice(0, 200).map(t => html`<div class="pend" key=${t.id}>
            <div class="info" onClick=${() => setFichaId(t.id)} style="cursor:pointer">
              <b>${t.cliente_nombre || '—'}</b>
              <div class="mini">${t.n_serie || ''} ${t.modelo || ''} · ${ciudadDe(t) || ''}, ${provinciaDe(t) || ''}</div>
              <div class="mini">${t.tipo_servicio || ''} · ${t.n_llamada || ''} ${t.obs_servicio ? '· ' + t.obs_servicio.slice(0, 70) : ''}</div>
            </div>
            <${Et} txt=${t.prioridad} mapa=${COLOR_PRIORIDAD} />
            ${editable && giraId && html`<button class="btn chico"
              onClick=${() => setAsignando(t)}>Agregar</button>`}
          </div>`)}
          ${!pendientes.length && html`<div class="vacio">No hay trabajos pendientes sin asignar.</div>`}
        </div>
      </div>

      <div class="panel">
        <div class="panel-cab"><h2>Hoja de ruta${gira ? ` — semana ${gira.n_semana || ''}` : ''}</h2>
          <span class="mini">${gira ? `${fecha(gira.fecha_desde, 1)} al ${fecha(gira.fecha_hasta, 1)}` : ''}</span></div>
        <div class="panel-cuerpo">
          ${!paradas.length && html`<div class="vacio">Agregá trabajos desde la lista de la izquierda.</div>`}
          ${dias.map(([dia, lista]) => html`<div class="dia" key=${dia}>
            <h4><span>${dia === 'sin fecha' ? 'Sin fecha asignada' : fechaLarga(dia)}</span>
              <span>${lista.length} parada${lista.length > 1 ? 's' : ''}</span></h4>
            ${lista.map((t, i) => html`<div class="parada" key=${t.id}>
              <div class="ord">${i + 1}</div>
              <div class="info" onClick=${() => setFichaId(t.id)} style="cursor:pointer">
                <b>${t.cliente_nombre || '—'} ${t.estado === 'CUMPLIDO' ? '✓' : ''}</b>
                <small>${direccionDe(t) || ''} — ${ciudadDe(t) || ''}, ${provinciaDe(t) || ''}</small>
                <small>${t.n_serie || ''} ${t.modelo || ''} · ${t.tipo_servicio || ''} · ${t.n_llamada || ''}
                  ${t.cliente_telefono ? ' · ☎ ' + t.cliente_telefono : ''}</small>
                ${t.obs_servicio && html`<small>${t.obs_servicio}</small>`}
              </div>
              ${editable && html`<div class="fila" style="gap:4px">
                <input type="date" style="width:130px" value=${t.fecha_visita || ''}
                  onChange=${e => moverDia(t, e.target.value)} />
                <button class="btn sec chico" title="Quitar de la gira" onClick=${() => quitar(t)}>✕</button>
              </div>`}
            </div>`)}
          </div>`)}
        </div>
      </div>
    </div>

    ${asignando && gira && html`<${Modal} titulo="¿Qué día de la semana?" ancho=${520}
        alCerrar=${() => setAsignando(null)}>
      <p><b>${asignando.cliente_nombre || '—'}</b>
        <span class="mini">${asignando.n_serie || ''} · ${ciudadDe(asignando) || ''},
        ${provinciaDe(asignando) || ''} · ${asignando.tipo_servicio || ''}</span></p>
      <p class="mini">Semana ${gira.n_semana || ''} · ${fecha(gira.fecha_desde, 1)} al ${fecha(gira.fecha_hasta, 1)}</p>
      <div class="fila" style="gap:6px;margin:10px 0">
        ${diasDeLaGira.map(d => html`<button class="btn sec" key=${d} style="flex:1;min-width:120px"
          onClick=${() => agregar(asignando, d)}>
          <div style="text-transform:capitalize">${DIAS[new Date(d + 'T12:00:00').getDay()]}</div>
          <div class="mini">${fecha(d, 1)}</div>
          <div class="mini">${paradas.filter(x => x.fecha_visita === d).length === 1 ? '1 parada' : paradas.filter(x => x.fecha_visita === d).length + ' paradas'}</div>
        </button>`)}
      </div>
      ${!diasDeLaGira.length && html`<div class="aviso ojo">La gira no tiene fechas cargadas.
        Completá “Desde” y “Hasta” arriba para poder elegir el día.</div>`}
      <div class="fila" style="justify-content:flex-end">
        <button class="btn sec" onClick=${() => setAsignando(null)}>Cancelar</button>
      </div>
    <//>`}

    ${imprimir && gira && html`<${HojaRuta} gira=${gira} paradas=${paradas} alCerrar=${() => setImprimir(false)} />`}
    ${nueva && html`<${NuevaGira} alCerrar=${id => { setNueva(false); if (id) setGiraId(id); }} />`}
    ${fichaId && html`<${Ficha} id=${fichaId} alCerrar=${() => setFichaId(null)} />`}
  </div>`;
}

function semanaCampos(iso) {
  if (!iso) return {};
  const { semana, anio } = semanaISO(iso);
  return { n_semana: semana, anio };
}

function NuevaGira({ alCerrar }) {
  const s = useS();
  const [g, setG] = useState(() => {
    const lunes = lunesDe(hoyISO(7));
    return { fecha_desde: lunes, fecha_hasta: sumarDias(lunes, 4), zona: '', tecnico_id: null,
             tecnico2_id: null, ...semanaCampos(lunes) };
  });
  const c = (k, v) => setG(x => ({ ...x, [k]: v, ...(k === 'fecha_desde' ? semanaCampos(v) : {}) }));
  async function crear() {
    const { data, error } = await cliente().from('giras').insert(g).select('*').single();
    if (error) return toast('No se pudo crear: ' + error.message, 'error');
    set({ giras: [data, ...S.giras] });
    toast('Gira creada', 'ok');
    alCerrar(data.id);
  }
  return html`<${Modal} titulo="Nueva gira" alCerrar=${() => alCerrar(null)}>
    <div class="rejilla dos">
      <${Txt} rot="Desde (lunes)" tipo="date" valor=${g.fecha_desde} alCambiar=${v => c('fecha_desde', v)} />
      <${Txt} rot="Hasta" tipo="date" valor=${g.fecha_hasta} alCambiar=${v => c('fecha_hasta', v)} />
      <${Txt} rot="N° de semana" tipo="number" valor=${g.n_semana} alCambiar=${v => c('n_semana', v)} />
      <${Txt} rot="Zona" valor=${g.zona} alCambiar=${v => c('zona', v)} />
      <${Campo} rot="Técnico 1">
        <select value=${g.tecnico_id || ''} onChange=${e => c('tecnico_id', e.target.value ? Number(e.target.value) : null)}>
          <option value="">—</option>
          ${s.tecnicos.filter(t => t.activo).map(t => html`<option value=${t.id}>${t.nombre}</option>`)}
        </select>
      <//>
      <${Campo} rot="Técnico 2">

/* ---------- planilla de trabajos imprimible (mismo formato que el Excel) ---------- */
const COLS_HOJA = [
  // rótulo, valor, ancho mínimo en pantalla (px), ancho al imprimir (% de la hoja)
  ['N° LL',                t => t.n_llamada,               52,  4.0, 'corta'],
  ['Tipo de Pedido',       t => t.tipo_pedido,             92,  6.6],
  ['Fecha de Instalación', t => fecha(t.fecha_instalacion), 66, 5.0, 'corta'],
  ['N° Serie',             t => t.n_serie,                 58,  4.4, 'corta'],
  ['Mod.',                 t => t.modelo,                  38,  3.0, 'corta'],
  ['N° P',                 t => t.n_paradas,               32,  2.6, 'corta'],
  ['MOT.',                 t => t.motorizacion,            48,  4.2, 'corta'],
  ['Puerta',               t => t.puerta,                  50,  4.6, 'corta'],
  ['Cliente',              t => t.cliente_nombre,          150, 10.5],
  ['Ciudad',               t => ciudadDe(t),               82,  5.6],
  ['Provincia',            t => provinciaDe(t),            82,  5.6],
  ['Dirección',            t => direccionDe(t),            130, 8.5],
  ['Teléfono',             t => t.cliente_telefono,        96,  6.2],
  ['Fecha Pedido',         t => fecha(t.fecha_pedido),     58,  4.6, 'corta'],
  ['Tipo  Servicio',       t => (t.tipo_servicio || '').toUpperCase(), 78, 5.4],
  ['VISITA',               t => diaSemana(t.fecha_visita), 58,  4.6, 'corta'],
  ['OBSERVACIONES',        t => t.obs_servicio,            250, 14.6],
];
/* Cliente, Ciudad y Provincia son lo primero que hay que ubicar de un
   vistazo en la hoja: van con la columna pintada levemente. */
const COLS_DESTACADAS = new Set(['Cliente', 'Ciudad', 'Provincia']);
/* El monto que aparezca en las observaciones se imprime más grande y en negrita */
const RE_MONTO = /((?:U\$D|US\$|\$)\s?\d[\d.,]*|\b\d{1,3}(?:\.\d{3})+(?:,\d+)?\b)/g;
function resaltarMontos(txt, tam) {
  const t = txt == null ? '' : String(txt);
  if (!t) return '';
  const partes = t.split(RE_MONTO);
  if (partes.length === 1) return t;
  return partes.map((p, i) => i % 2
    ? html`<b class="monto" style=${`font-size:${tam + 1}px`}>${p}</b>`
    : p);
}


/* Mide texto con la misma tipografía de la impresión, para calcular anchos reales */
let _medidor = null;
function anchoTexto(txt, fuente) {
  if (!_medidor) _medidor = document.createElement('canvas').getContext('2d');
  _medidor.font = fuente;
  return _medidor.measureText(String(txt == null ? '' : txt)).width;
}
/** Ancho mínimo para que no se corte ninguna palabra, y ancho "cómodo" de la columna */
/* Tipografía angosta: permite letra 14 con las 17 columnas en una sola hoja A4
   apaisada. "Arial Narrow" está en toda instalación de Windows; las demás son
   alternativas para Mac y Linux. */
const TIPOGRAFIA = '"Arial Narrow", "Liberation Sans Narrow", "Roboto Condensed", '
  + '"DejaVu Sans Condensed", "Segoe UI", Roboto, sans-serif';
/* Los títulos se imprimen más chicos que los datos: así ninguna columna queda
   ancha sólo por el largo del encabezado y el dato del técnico se lee entero. */
const ESC_TITULO = 0.72;
/* relleno real de la celda al imprimir: 2 px de cada lado + borde + un margen */
const RELLENO = 8;
function medidasColumna(rotulo, valores, tam, grande) {
  const FUENTE_TEXTO = grande ? `600 ${tam + 1}px ${TIPOGRAFIA}` : `${tam}px ${TIPOGRAFIA}`;
  const FUENTE_TITULO = `600 ${Math.max(8, Math.round(tam * ESC_TITULO))}px ${TIPOGRAFIA}`;
  const palabras = t => String(t == null ? '' : t).split(/\s+/).filter(Boolean);
  let minimo = 0, comodo = 0;
  // El rótulo puede partirse en varios renglones: lo importante es que el dato entre entero
  palabras(rotulo).forEach(p => {
    minimo = Math.max(minimo, Math.min(anchoTexto(p, FUENTE_TITULO), tam * 4.2));
  });
  valores.forEach(v => {
    palabras(v).forEach(p => { minimo = Math.max(minimo, anchoTexto(p, FUENTE_TEXTO)); });
    comodo = Math.max(comodo, Math.min(anchoTexto(v, FUENTE_TEXTO), tam * 19));
  });
  return { minimo: Math.ceil(minimo) + RELLENO, comodo: Math.ceil(comodo) + RELLENO };
}

/**
 * Reparte el ancho de la hoja entre las columnas: primero garantiza que ninguna
 * palabra se parta y después reparte lo que sobra entre las que más texto tienen.
 */
function anchosPlanilla(columnas, filas, disponible, tam) {
  const m = columnas.map(([rot, val]) => medidasColumna(rot, filas.map(f => val(f)), tam,
    rot === 'OBSERVACIONES'));
  const dura = columnas.map(c => c[4] === 'corta');
  const anchos = m.map(x => x.minimo);
  const suma = anchos.reduce((a, b) => a + b, 0);

  if (suma > disponible) {
    // No entra: se achican sólo las columnas de texto largo, que parten bien por
    // espacios. Las cortas (fechas, N° de serie, modelo) conservan su ancho.
    const fijo = anchos.reduce((a, x, i) => a + (dura[i] ? x : 0), 0);
    const blando = suma - fijo;
    const k = Math.max(0.45, (disponible - fijo) / (blando || 1));
    return anchos.map((a, i) => dura[i] ? a : a * k);
  }

  const sobra = disponible - suma;
  /* Observaciones es la columna más importante de la hoja: se lleva una parte
     mayor del espacio que sobra, multiplicando su "gana" frente al resto de
     las columnas blandas (cliente, dirección, etc.). */
  const PESO_OBSERVACIONES = 3;
  const ganas = m.map((x, i) => {
    if (dura[i]) return 0;
    const g = Math.max(0, x.comodo - x.minimo);
    return columnas[i][0] === 'OBSERVACIONES' ? g * PESO_OBSERVACIONES : g;
  });
  const totalGanas = ganas.reduce((a, b) => a + b, 0) || 1;
  return anchos.map((a, i) => a + sobra * (ganas[i] / totalGanas));
}

/** La letra más grande con la que las 17 columnas entran en la hoja sin que
    se corte ninguna palabra (mismo criterio que la "holgura" de abajo). */
function tamañoRecomendado(paradas) {
  for (let t = 16; t >= 9; t--) {
    const suma = COLS_HOJA.reduce((a, [rot, val]) =>
      a + medidasColumna(rot, paradas.map(f => val(f)), t, rot === 'OBSERVACIONES').minimo, 0);
    if (suma <= 1072) return t;
  }
  return 9;
}

function HojaRuta({ gira, paradas, alCerrar }) {
  const s = useS();
  const [corte, setCorte] = useState('');   // '' | dia | tecnico
  const recomendado = useMemo(() => tamañoRecomendado(paradas), [paradas]);
  const [tam, setTam] = useState(recomendado);   // tamaño de letra de la planilla
  const tec = s.tecnicos.find(t => t.id === gira.tecnico_id);
  const tec2 = s.tecnicos.find(t => t.id === gira.tecnico2_id);
  useEffect(() => {
    document.body.classList.add('imprimiendo');
    return () => document.body.classList.remove('imprimiendo');
  }, []);

  const grupos = useMemo(() => {
    if (!corte) return [[null, paradas]];
    const m = new Map();
    paradas.forEach(t => {
      const k = corte === 'dia'
        ? (t.fecha_visita || 'Sin fecha')
        : (t.tecnicos || 'Sin técnico asignado');
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(t);
    });
    return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], 'es'));
  }, [paradas, corte]);

  /* A4 apaisado con 6 mm de margen ≈ 1075 px de ancho útil */
  const anchos = useMemo(() => anchosPlanilla(COLS_HOJA, paradas, 1072, tam), [paradas, tam]);
  /* Qué tan apretada queda la hoja con el tamaño elegido */
  const holgura = useMemo(() => {
    const m = COLS_HOJA.map(([rot, val]) => medidasColumna(rot, paradas.map(f => val(f)), tam,
      rot === 'OBSERVACIONES'));
    return 1072 - m.reduce((a, x) => a + x.minimo, 0);
  }, [paradas, tam]);

  /* Cuando en una misma tabla conviven trabajos de más de un día ("Todo
     junto", o separando por técnico, que puede mezclar días de la semana),
     el primero de cada día nuevo lleva una raya más marcada arriba: el
     mismo recurso que ya separa una semana de la siguiente en Registro de
     Service, sin agregar ningún rótulo (la columna VISITA ya dice el día). */
  const filas = lista => lista.map((t, i) => html`<tr key=${t.id}
      class=${[recienInstalado(t) ? 'recien-instalado' : '',
               i > 0 && (t.fecha_visita || '') !== (lista[i - 1].fecha_visita || '') ? 'otro-dia' : ''
              ].filter(Boolean).join(' ')}>
    ${COLS_HOJA.map(([rot, val, , , corta]) => html`<td class=${[corta || '',
        rot === 'OBSERVACIONES' ? 'largo' : '',
        COLS_DESTACADAS.has(rot) ? 'col-destacada' : '',
        rot === 'Fecha de Instalación' && recienInstalado(t) ? 'marca-inst' : ''].filter(Boolean).join(' ')}>
      ${rot === 'N° Serie' ? html`<b>${val(t) || ''}</b>`
        : rot === 'OBSERVACIONES' ? resaltarMontos(val(t), tam)
        : (val(t) || '')}</td>`)}
  </tr>`);

  /* Letterhead de la hoja (logo, semana/zona, técnico, vehículo, viáticos).
     Va DENTRO del <thead> de cada tabla impresa (además de mostrarse arriba
     de todo en pantalla) para que, al saltar de hoja física al imprimir, el
     navegador la vuelva a imprimir sola junto con los títulos de columna:
     es el mismo mecanismo por el que ya se repiten los títulos de columna. */
  const filaTitulo = html`<tr class="fila-titulo-planilla">
    <th colspan=${COLS_HOJA.length}>
      <div class="encabezado-hoja">
        <div>
          <img class="logo-hoja" src=${LOGO_NEGRO} alt="ENSA" />
          <div class="titulo-hoja">${gira.n_semana || ''}-Semana en: ${gira.zona || ''}</div>
          <div class="mini">Semana del ${fecha(gira.fecha_desde, 1)}${gira.fecha_hasta ? ' al ' + fecha(gira.fecha_hasta, 1) : ''}</div>
        </div>
        <div class="mini der">
          <div><b>Técnico${tec2 ? ' 1' : ''}:</b> ${tec ? tec.nombre : '—'}</div>
          ${tec2 && html`<div><b>Técnico 2:</b> ${tec2.nombre}</div>`}
          <div><b>Vehículo:</b> ${gira.vehiculo || '—'}</div>
          <div><b>Código de viaje:</b> ${gira.codigo_viaje || '—'}</div>
          <div><b>Viáticos entregados:</b> ${plata(gira.viaticos) || '—'}</div>
        </div>
      </div>
    </th>
  </tr>`;

  return html`<div class="fondo" style="justify-content:center;align-items:flex-start;padding:14px;overflow:auto">
    <div class="panel hoja-impresion" style="width:100%;max-width:1300px;background:var(--papel)">
      <div class="panel-cab no-imprimir">
        <h2>Planilla de trabajos — semana ${gira.n_semana || ''}</h2>
        <${Sel} valor=${corte} opts=${['dia', 'tecnico']} vacio="Todo junto"
          alCambiar=${v => setCorte(v || '')} />
        <span class="mini">separar por…</span>
        <select style="width:auto" value=${tam} onChange=${e => setTam(Number(e.target.value))}>
          ${[16, 15, 14, 13, 12, 11, 10, 9].map(n => html`<option value=${n}>Letra ${n}${
            n === recomendado ? ' (recomendada)' : ''}</option>`)}
        </select>
        ${holgura < -20 && html`<span class="mini" style="color:var(--alerta)"
          title="Las 17 columnas entran siempre en el ancho de la hoja; con letra muy grande alguna palabra larga se parte en dos renglones.">
          Con letra ${tam} alguna palabra larga se parte: con ${tam - 1} entra más holgado.</span>`}
        <div style="margin-left:auto" class="fila">
          ${puedePlanificacionRRHH() && html`<button class="btn sec"
            title="Descarga una planilla aparte para RR.HH., con los trabajos de esta gira: de N° Serie a Fecha Pedido más el técnico asignado a cada uno"
            onClick=${() => exportarPlanificacionRRHH(paradas, gira)}>Planificación RRHH</button>`}
          <button class="btn" onClick=${() => window.print()}>Imprimir / guardar PDF</button>
          <button class="btn sec" onClick=${alCerrar}>Cerrar</button>
        </div>
      </div>
      <div class="panel-cuerpo">
        <div class="encabezado-hoja no-imprimir">
          <div>
            <img class="logo-hoja" src=${LOGO_NEGRO} alt="ENSA" />
            <div class="titulo-hoja">${gira.n_semana || ''}-Semana en: ${gira.zona || ''}</div>
            <div class="mini">Semana del ${fecha(gira.fecha_desde, 1)}${gira.fecha_hasta ? ' al ' + fecha(gira.fecha_hasta, 1) : ''}</div>
          </div>
          <div class="mini der">
            <div><b>Técnico${tec2 ? ' 1' : ''}:</b> ${tec ? tec.nombre : '—'}</div>
            ${tec2 && html`<div><b>Técnico 2:</b> ${tec2.nombre}</div>`}
            <div><b>Vehículo:</b> ${gira.vehiculo || '—'}</div>
            <div><b>Código de viaje:</b> ${gira.codigo_viaje || '—'}</div>
            <div><b>Viáticos entregados:</b> ${plata(gira.viaticos) || '—'}</div>
          </div>
        </div>
        <div class="mini no-imprimir" style="margin:-6px 0 10px">En la hoja impresa este
          encabezado se repite solo al principio de cada página, junto con los títulos de columna.</div>

        ${grupos.map(([dia, lista]) => html`<div key=${dia || 'todo'} style="margin-bottom:14px">
          ${dia && html`<div class="titulo-dia">${corte === 'tecnico'
            ? dia
            : (dia === 'Sin fecha' ? 'Sin fecha asignada' : fechaLarga(dia))}</div>`}
          <div class="tabla-caja" style="max-height:none">
            <table class="grilla planilla" style=${`font-size:${tam}px`}>
              <colgroup>
                ${COLS_HOJA.map((c, i) => html`<col style=${`width:${(anchos[i] / 1072 * 100).toFixed(2)}%`} />`)}
              </colgroup>
              <thead>
                ${filaTitulo}
                <tr>
                  ${COLS_HOJA.map(([rot, , ancho, , corta]) => html`<th
                    class=${[corta || '', COLS_DESTACADAS.has(rot) ? 'col-destacada' : ''].filter(Boolean).join(' ')}
                    style=${`min-width:${ancho}px`}>${rot}</th>`)}
                </tr>
              </thead>
              <tbody>${filas(lista)}</tbody>
            </table>
          </div>
        </div>`)}

        ${paradas.some(recienInstalado) && html`<div class="mini" style="margin:2px 0 8px">
          <span class="et rojo">■</span> Equipo instalado hace menos de un mes: revisar si corresponde garantía.
        </div>`}
        <div class="pie-hoja mini">
          <span>Firma del técnico: _______________________________</span>
          <span>Fecha de entrega: ____ / ____ / ______</span>
        </div>
      </div>
    </div>
  </div>`;
}
