/* =====================================================================
   MÓDULO 6 — PRODUCTIVIDAD MENSUAL DE LOS TÉCNICOS   (sólo administrador)

   Todos los meses se le liquida a cada técnico una productividad. La
   planilla sale sola de los trabajos cumplidos, con las mismas columnas
   de la que se venía haciendo a mano en Excel.

   Cómo se arma el pago de cada fila:
     · los Services y Services Proactivos de la semana (de lunes a
       domingo) se numeran: el primero es el 1, el segundo el 2, y así.
       El conteo arranca de cero cada lunes;
     · el tramo lo da ESE número, no el total de la semana: los tres
       primeros se pagan al valor de 1 a 3, el cuarto, quinto y sexto al
       de 4 a 6, el séptimo y el octavo al de 7 a 8, y del noveno en
       adelante al de 9 o más. Es escalonado, como una escala de
       impuestos: quien hace 5 services cobra 3 al primer valor y 2 al
       segundo;
     · cada tipo de pedido cae en una categoría (service, garantía o
       extra) y el cuadro del mes dice cuánto se paga esa categoría en
       ese tramo. Los que no son service usan el tramo al que había
       llegado el técnico ese día;
     · si una fila va distinta, se escribe el monto a mano y queda
       marcada como corregida.
   Cuando un trabajo lo hicieron dos técnicos, la fila aparece entera en
   la planilla de cada uno y cada uno cobra el monto completo.
   ===================================================================== */

const PROD_TRAMOS = [
  { id: '1-3', rot: '1 a 3',    min: 1, max: 3 },
  { id: '4-6', rot: '4 a 6',    min: 4, max: 6 },
  { id: '7-8', rot: '7 a 8',    min: 7, max: 8 },
  { id: '9+',  rot: '9 o más',  min: 9, max: Infinity },
];
const PROD_CATEGORIAS = [
  { id: 'service',  rot: 'Service y Service Proactivo' },
  { id: 'garantia', rot: 'Garantía / Asistencia Técnica' },
  { id: 'extra',    rot: 'Extra Instalación / Relevamiento' },
  { id: 'sin_pago', rot: 'No se paga' },
];
/** el tramo que le toca al service número N de la semana */
function tramoDe(numeroDelService) {
  return (PROD_TRAMOS.find(t => numeroDelService >= t.min && numeroDelService <= t.max)
    || PROD_TRAMOS[0]).id;
}
const rotTramo = id => PROD_TRAMOS.find(x => x.id === id)?.rot || '';
/** de dónde sale el pago de una fila, para mostrarlo al pasar el mouse */
function explicarPago(f, valorMinuto) {
  const cat = PROD_CATEGORIAS.find(c => c.id === f.categoria)?.rot || '';
  const puesto = f.categoria === 'service'
    ? `es el service N° ${f.orden} de la semana del ${fecha(f.lunes, 1)}`
    : `en la semana del ${fecha(f.lunes, 1)} ya llevaba ${f.orden} service${f.orden === 1 ? '' : 's'}`;
  const sem = `${puesto[0].toUpperCase() + puesto.slice(1)} (${f.nSem} en total)` +
    `, así que va al tramo ${rotTramo(f.tramo)}.`;
  if (f.categoria === 'sin_pago') return `${sem}\n${cat}: esta fila no se paga.`;
  if (!f.porMinuto) return `${sem}\n${cat}: valor fijo del tramo, ${plata(f.tope)}.`;
  const cuenta = `${f.minutos} min × ${plata(valorMinuto, 2)} = ${plata(f.bruto)}`;
  return f.conTope
    ? `${sem}\n${cat}: ${cuenta}, pero el tope es ${plata(f.tope)}.`
    : `${sem}\n${cat}: ${cuenta} (tope ${plata(f.tope)}).`;
}

/** lee un importe escrito a mano: "$74.262", "74262" o vacío (= volver al cuadro) */
function soloNumero(txt) {
  const limpio = String(txt).replace(/[^\d,-]/g, '').replace(',', '.');
  if (!limpio.trim()) return null;
  const n = Number(limpio);
  return Number.isFinite(n) ? n : null;
}
/* ---------------------------------------------------------------------
   IMPRIMIR EN UNA SOLA HOJA
   La planilla tiene que entrar entera en una A4 apaisada, sea de diez
   filas o de cincuenta. En vez de adivinar un tamaño de letra, se mide:
   se pone la hoja en el modo de papel (misma letra, mismos anchos y con
   los minutos escondidos), se mira cuánto mide de alto, y de ahí sale
   cuánto hay que achicarla para que entre. Después se imprime.
   --------------------------------------------------------------------- */
const HOJA_A4 = { ancho: 1077, alto: 745 };   // A4 apaisada menos 6 mm de margen

function medirYEncajar() {
  const hoja = document.querySelector('.hoja-productividad');
  if (!hoja) return null;
  const raiz = document.documentElement;
  raiz.classList.add('modo-papel');

  /* "zoom" achica todo por igual, también el ancho. Para que la hoja siga
     ocupando el ancho completo del papel, se le da un ancho mayor en la misma
     proporción: 1077 / escala. Así lo único que cambia es que entra más texto
     por renglón y la planilla se vuelve más baja, que es lo que se busca. */
  const aplicar = e => {
    raiz.style.setProperty('--escala-prod', String(e));
    hoja.style.width = (HOJA_A4.ancho / e) + 'px';
    return hoja.offsetHeight * e;          // el alto que va a ocupar en el papel
  };

  let escala = 1;
  let alto = aplicar(1);
  if (alto > HOJA_A4.alto) {
    /* Se busca la letra más grande que todavía entre en una hoja. No alcanza
       con una regla de tres: al achicar, el texto se parte en menos renglones
       y la planilla se acorta más de lo proporcional. Por eso se prueba y se
       mide, doce veces, que en una tabla así son unos milisegundos. */
    let chica = 0.3, grande = 1;
    for (let i = 0; i < 12; i++) {
      const medio = (chica + grande) / 2;
      if (aplicar(medio) <= HOJA_A4.alto) chica = medio; else grande = medio;
    }
    escala = Math.floor(chica * 1000) / 1000;
    alto = aplicar(escala);
  }
  return { alto: Math.round(alto), escala, entra: alto <= HOJA_A4.alto };
}
function salirDelModoPapel() {
  const hoja = document.querySelector('.hoja-productividad');
  if (hoja) hoja.style.width = '';
  document.documentElement.classList.remove('modo-papel');
  document.documentElement.style.removeProperty('--escala-prod');
}
function imprimirProductividad() {
  medirYEncajar();
  // se deja pintar antes de abrir el diálogo de impresión
  setTimeout(() => { window.print(); }, 60);
}

/** el mes de un trabajo, para la liquidación: la fecha en que se dio por hecho */
function periodoDe(t) {
  return String(t.fecha_visita || '').slice(0, 7);
}

/* ---------------------------------------------------------------------
   Traer y guardar lo que vive en las tablas de productividad
   --------------------------------------------------------------------- */
async function traerProductividad(periodo) {
  const db = cliente();
  const [valores, categorias, items, textos, config] = await Promise.all([
    db.from('productividad_valores').select('*').eq('periodo', periodo),
    db.from('productividad_categorias').select('*'),
    db.from('productividad_items').select('*').eq('periodo', periodo),
    db.from('productividad_tecnico').select('*').eq('periodo', periodo),
    db.from('productividad_config').select('*').eq('periodo', periodo).maybeSingle(),
  ]);
  const err = [valores, categorias, items, textos, config].find(r => r.error);
  if (err) throw new Error(err.error.message);
  return {
    valores: valores.data || [], categorias: categorias.data || [],
    items: items.data || [], textos: textos.data || [],
    valorMinuto: Number(config.data?.valor_minuto || 0),
  };
}

/* =====================================================================
   LA PANTALLA
   ===================================================================== */
function Productividad() {
  const s = useS();
  const hoy = hoyISO();
  const [periodo, setPeriodo] = useState(hoy.slice(0, 7));
  const [tecnicoId, setTecnicoId] = useState(null);
  const [datos, setDatos] = useState(null);        // null = todavía cargando
  const [verCuadro, setVerCuadro] = useState(false);
  const [error, setError] = useState(null);
  const caja = useRef(null);

  /* se recarga cada vez que se cambia de mes */
  const recargar = useCallback(async () => {
    setError(null);
    try { setDatos(await traerProductividad(periodo)); }
    catch (e) {
      setDatos({ valores: [], categorias: [], items: [], textos: [], valorMinuto: 0 });
      setError(/relation|does not exist|no existe/i.test(e.message || '')
        ? 'Falta correr en Supabase el script 15_productividad.sql.'
        : (e.message || String(e)));
    }
  }, [periodo]);
  useEffect(() => { setDatos(null); recargar(); }, [periodo]);

  /* Ctrl+P tiene que salir igual que el botón: una sola hoja y sin minutos */
  useEffect(() => {
    const antes = () => medirYEncajar();
    const despues = () => salirDelModoPapel();
    window.addEventListener('beforeprint', antes);
    window.addEventListener('afterprint', despues);
    return () => {
      window.removeEventListener('beforeprint', antes);
      window.removeEventListener('afterprint', despues);
      salirDelModoPapel();
    };
  }, []);

  /* Los dados de baja no aparecen en la lista, salvo que tengan trabajos en el
     mes que se está mirando: alguien que se fue en agosto igual tiene que poder
     liquidarse julio. */
  const tecnicos = useMemo(() => {
    const conTrabajoEsteMes = new Set(s.trabajos
      .filter(t => t.estado === 'CUMPLIDO' && periodoDe(t) === periodo)
      .flatMap(t => (t.tecnico_ids || []).map(String)));
    return s.tecnicos.filter(t => t.activo || conTrabajoEsteMes.has(String(t.id)));
  }, [s.tecnicos, s.trabajos, periodo]);

  /* ---- los trabajos del mes, uno por técnico asignado ---- */
  const delMes = useMemo(() => s.trabajos.filter(t =>
    t.estado === 'CUMPLIDO' && periodoDe(t) === periodo), [s.trabajos, periodo]);

  /* en qué categoría cae cada tipo de pedido */
  const catDe = useCallback(tipo => {
    const c = (datos?.categorias || []).find(x => x.tipo_pedido === tipo);
    return c ? c.categoria : 'sin_pago';
  }, [datos]);

  /* Se numeran los services de cada semana, por técnico: el primero de la
     semana es el 1, el segundo el 2, y así. Ese número es el que da el tramo
     de esa fila, de manera escalonada. El conteo se reinicia todos los lunes.
     Se miran TODOS los trabajos, no sólo los del mes, porque una semana puede
     empezar en un mes y terminar en el siguiente. */
  const semanaDelTecnico = useMemo(() => {
    const services = [];
    for (const t of s.trabajos) {
      if (t.estado !== 'CUMPLIDO') continue;
      const d = t.fecha_visita;
      if (!d) continue;
      if (catDe(t.tipo_pedido) !== 'service') continue;
      services.push({ id: t.id, d: String(d).slice(0, 10), ids: t.tecnico_ids || [] });
    }
    /* el orden manda: se numeran por fecha y, a igual fecha, por número de
       trabajo, para que el resultado sea siempre el mismo */
    services.sort((a, b) => a.d.localeCompare(b.d) || Number(a.id) - Number(b.id));

    const total  = new Map();   // técnico|lunes    → cuántos services tiene la semana
    const numero = new Map();   // técnico|trabajo  → qué número le tocó
    const dias   = new Map();   // técnico|lunes    → las fechas, en orden
    for (const sv of services) {
      const k = lunesDe(sv.d);
      for (const id of sv.ids) {
        const clave = String(id) + '|' + k;
        const n = (total.get(clave) || 0) + 1;
        total.set(clave, n);
        numero.set(String(id) + '|' + sv.id, n);
        if (!dias.has(clave)) dias.set(clave, []);
        dias.get(clave).push(sv.d);
      }
    }
    return { total, numero, dias };
  }, [s.trabajos, catDe]);


  /* el técnico elegido: por defecto, el que más trabajos tenga ese mes */
  const conTrabajo = useMemo(() => {
    const m = new Map();
    for (const t of delMes) for (const id of (t.tecnico_ids || [])) m.set(String(id), (m.get(String(id)) || 0) + 1);
    return [...m.entries()].sort((a, b) => b[1] - a[1]).map(([id]) => id);
  }, [delMes]);
  const tecActual = tecnicoId || conTrabajo[0] || (tecnicos[0] && tecnicos[0].id) || null;
  const tecnico = tecnicos.find(t => String(t.id) === String(tecActual));

  /** cuántos services hizo este técnico en la semana de esa fecha */
  const servicesDeLaSemana = useCallback((fecha) => {
    if (!fecha) return 0;
    return semanaDelTecnico.total.get(String(tecActual) + '|' + lunesDe(fecha)) || 0;
  }, [semanaDelTecnico, tecActual]);

  /* Qué número le toca a una fila dentro de su semana. Si es un service, el
     suyo. Si no lo es (una garantía, un extra), el tramo al que ya había
     llegado el técnico ese día: los services de esa misma semana hechos hasta
     esa fecha, y nunca menos de 1. */
  const numeroEnLaSemana = useCallback((t, categoria) => {
    const d = String(t.fecha_visita || hoy).slice(0, 10);
    if (categoria === 'service') {
      return semanaDelTecnico.numero.get(String(tecActual) + '|' + t.id) || 1;
    }
    const dias = semanaDelTecnico.dias.get(String(tecActual) + '|' + lunesDe(d)) || [];
    return Math.max(1, dias.filter(x => x <= d).length);
  }, [semanaDelTecnico, tecActual, hoy]);

  const valorMinuto = Number(datos?.valorMinuto || 0);

  const valorDe = useCallback((categoria, tramo) => {
    const v = (datos?.valores || []).find(x => x.categoria === categoria && x.tramo === tramo);
    return v ? Number(v.valor) : 0;
  }, [datos]);

  const itemDe = useCallback(id => (datos?.items || [])
    .find(x => String(x.trabajo_id) === String(id) && String(x.tecnico_id) === String(tecActual)),
    [datos, tecActual]);

  /* ---- las filas de la planilla ---- */
  const filas = useMemo(() => delMes
    .filter(t => (t.tecnico_ids || []).some(id => String(id) === String(tecActual)))
    .sort((a, b) => String(a.fecha_visita || '').localeCompare(String(b.fecha_visita || ''))
      || Number(a.id) - Number(b.id))
    .map(t => {
      const it = itemDe(t.id);
      const categoria = catDe(t.tipo_pedido);
      const minutosAuto = Math.round((Number(t.horas_mo) || 0) * 60);
      const minutos = it && it.minutos !== null && it.minutos !== undefined
        ? Number(it.minutos) : minutosAuto;
      /* el tramo sale del lugar que ocupa esta fila en su semana, no del mes
         ni del total de la semana: es escalonado */
      const lunes = lunesDe(t.fecha_visita || hoy);
      const nSem = servicesDeLaSemana(t.fecha_visita);
      const orden = numeroEnLaSemana(t, categoria);
      const tramo = tramoDe(orden);
      /* Service y Service Proactivo: el valor del tramo, tal cual.
         Todo lo demás: los minutos por el valor del minuto, con el valor
         del cuadro como tope (por más minutos que haya, no pasa de ahí). */
      const tope = categoria === 'sin_pago' ? 0 : valorDe(categoria, tramo);
      const porMinuto = categoria !== 'service' && categoria !== 'sin_pago';
      const bruto = porMinuto ? Math.round(minutos * valorMinuto) : tope;
      const sugerido = porMinuto ? Math.min(bruto, tope) : tope;
      return {
        t, categoria, sugerido, tope, bruto, porMinuto, conTope: porMinuto && bruto > tope,
        lunes, nSem, orden, tramo,
        minutos, minutosAuto,
        pago: it && it.pago !== null && it.pago !== undefined ? Number(it.pago) : sugerido,
        pagoAmano: !!(it && it.pago !== null && it.pago !== undefined),
        minutosAmano: !!(it && it.minutos !== null && it.minutos !== undefined),
      };
    }), [delMes, tecActual, itemDe, catDe, valorDe, valorMinuto, servicesDeLaSemana,
         numeroEnLaSemana, hoy]);

  /* Las dos últimas columnas son una sola celda alta: no llevan rayas entre
     filas y el texto va en el medio, como una celda combinada de Excel. No se
     usa rowspan porque una celda que abarca 31 filas no se puede partir entre
     hojas y la planilla no se imprimiría. */
  const medio = Math.floor(Math.max(0, filas.length - 1) / 2);

  /* el desglose por semana: es lo que explica por qué dos filas del mismo mes
     pueden pagarse distinto */
  const semanas = useMemo(() => {
    const m = new Map();
    for (const f of filas) {
      if (!m.has(f.lunes)) m.set(f.lunes, { lunes: f.lunes, filas: 0, services: f.nSem,
        tramos: new Set(), pago: 0 });
      const x = m.get(f.lunes);
      x.filas++; x.pago += Number(f.pago) || 0; x.tramos.add(f.tramo);
      m.set(f.lunes, x);
    }
    return [...m.values()]
      .map(x => ({ ...x,
        /* la semana puede tocar más de un tramo: se listan en el orden del cuadro */
        tramo: PROD_TRAMOS.filter(t => x.tramos.has(t.id)).map(t => t.rot).join(' + ') }))
      .sort((a, b) => a.lunes.localeCompare(b.lunes));
  }, [filas]);

  const subtotal = filas.reduce((a, f) => a + (Number(f.pago) || 0), 0);
  const totalMinutos = filas.reduce((a, f) => a + (Number(f.minutos) || 0), 0);
  const texto = (datos?.textos || []).find(x => String(x.tecnico_id) === String(tecActual))
    || { semana_planta: '', bono_garantias: '' };

  /* ---- guardar ---- */
  async function guardarItem(trabajoId, campos) {
    const previo = itemDe(trabajoId) || {};
    const fila = { periodo, trabajo_id: trabajoId, tecnico_id: tecActual,
      minutos: previo.minutos ?? null, pago: previo.pago ?? null, ...campos };
    const { error: e } = await cliente().from('productividad_items')
      .upsert(fila, { onConflict: 'periodo,trabajo_id,tecnico_id' });
    if (e) return toast('No se pudo guardar: ' + e.message, 'error');
    setDatos(d => ({ ...d, items: [
      ...d.items.filter(x => !(String(x.trabajo_id) === String(trabajoId)
        && String(x.tecnico_id) === String(tecActual))), fila] }));
  }

  async function guardarTexto(campos) {
    const fila = { periodo, tecnico_id: tecActual,
      semana_planta: texto.semana_planta || '', bono_garantias: texto.bono_garantias || '',
      ...campos };
    const { error: e } = await cliente().from('productividad_tecnico')
      .upsert(fila, { onConflict: 'periodo,tecnico_id' });
    if (e) return toast('No se pudo guardar: ' + e.message, 'error');
    setDatos(d => ({ ...d, textos: [
      ...d.textos.filter(x => String(x.tecnico_id) !== String(tecActual)), fila] }));
  }

  /* volver una fila al valor que calcula la aplicación */
  async function volverAlCuadro(trabajoId) {
    await guardarItem(trabajoId, { pago: null, minutos: null });
    toast('La fila vuelve a tomar el valor del cuadro');
  }

  const MESES_OPC = MESES.map((m, i) => ({ v: String(i + 1).padStart(2, '0'),
    r: m[0].toUpperCase() + m.slice(1) }));
  const anio = periodo.slice(0, 4), mes = periodo.slice(5, 7);
  const nombreMes = MESES[Number(mes) - 1] || '';
  const titulo = `SERVICE ${nombreMes.toUpperCase()} ${anio} — PRODUCTIVIDAD ${(tecnico?.nombre || '').toUpperCase()}`;

  /* ---- exportar ---- */
  const COLS = [
    ['N°', f => f.t.n_llamada || ''],
    ['Mantenimiento', f => f.t.tipo_pedido || ''],
    ['Fecha de instalación', f => fecha(f.t.fecha_instalacion, 1)],
    ['Cliente', f => f.t.cliente_nombre || ''],
    ['Fecha pedido', f => fecha(f.t.fecha_pedido, 1)],
    ['Tipo servicio', f => (f.t.tipo_servicio || '').toUpperCase()],
    ['Estado', f => f.t.estado || ''],
    ['Fecha de visita', f => fecha(f.t.fecha_visita, 1)],
    ['Técnico', f => f.t.tecnicos || ''],
    ['Tiempos MO [Min]', f => f.minutos || 0],
    ['Pago', f => Number(f.pago) || 0],
    ['Semana (lunes)', f => fecha(f.lunes, 1)],
    ['Services de esa semana', f => f.nSem],
    ['N° dentro de la semana', f => f.orden],
    ['Tramo aplicado', f => rotTramo(f.tramo)],
  ];

  async function exportar() {
    if (!filas.length) return toast('Este técnico no tiene trabajos en el mes', 'error');
    toast('Armando el Excel…');
    try {
      await bajarXlsx(`Productividad ${tecnico?.nombre || ''} - ${nombreMes} ${anio}`, [
        { nombre: 'Productividad', columnas: COLS.map(c => c[0]),
          filas: filas.map(f => COLS.map(c => { const v = c[1](f); return v === '' ? null : v; })) },
        { nombre: 'Resumen', columnas: ['Dato', 'Valor'], filas: [
          ['Técnico', tecnico?.nombre || ''],
          ['Mes', `${nombreMes} ${anio}`],
          ['Trabajos del mes', filas.length],
          ['Semanas liquidadas', semanas.length],
          ['Valor del minuto', valorMinuto],
          ['Minutos totales', totalMinutos],
          ['SUBTOTAL SERVICE', subtotal],
          ['Productividad semana planta', texto.semana_planta || ''],
          ['Bono 0 garantías de service', texto.bono_garantias || ''],
          ['Generado el', momento(new Date().toISOString())],
          ['Generado por', nombreUsuario()],
        ] },
        { nombre: 'Semanas', columnas: ['Semana (lunes)', 'Services', 'Tramos aplicados',
          'Trabajos', 'Pago'],
          filas: semanas.map(w => [{ f: w.lunes }, w.services, w.tramo, w.filas, w.pago]) },
        { nombre: 'Cuadro del mes', columnas: ['Categoría', ...PROD_TRAMOS.map(t => t.rot)],
          filas: PROD_CATEGORIAS.filter(c => c.id !== 'sin_pago')
            .map(c => [c.rot, ...PROD_TRAMOS.map(t => valorDe(c.id, t.id))]) },
      ]);
    } catch (e) { toast('No se pudo armar el Excel: ' + (e.message || e), 'error'); }
  }

  if (datos === null) return html`<div class="cargando">Buscando la productividad del mes…</div>`;

  return html`<div>
    <div class="panel no-imprimir" style="margin-bottom:10px">
      <div class="panel-cab">
        <h2>Productividad mensual</h2>
        <label class="fila mini" style="gap:5px">Mes
          <select style="width:auto" value=${mes}
            onChange=${e => setPeriodo(anio + '-' + e.target.value)}>
            ${MESES_OPC.map(m => html`<option value=${m.v}>${m.r}</option>`)}
          </select></label>
        <label class="fila mini" style="gap:5px">Año
          <input type="number" style="width:88px" value=${anio}
            onInput=${e => e.target.value.length === 4 && setPeriodo(e.target.value + '-' + mes)} /></label>
        <label class="fila mini" style="gap:5px">Técnico
          <select style="width:auto;min-width:180px" value=${tecActual || ''}
            onChange=${e => setTecnicoId(Number(e.target.value))}>
            ${tecnicos.map(t => html`<option value=${t.id}>${t.nombre}</option>`)}
          </select></label>
        <div class="fila" style="margin-left:auto">
          <button class="btn sec chico" onClick=${() => setVerCuadro(true)}>Valores del mes</button>
          <button class="btn sec chico" onClick=${exportar}>Exportar</button>
          <button class="btn sec chico" onClick=${imprimirProductividad}>Imprimir</button>
        </div>
      </div>
      ${error && html`<div class="panel-cuerpo"><div class="aviso error">${error}</div></div>`}
      <div class="panel-cuerpo" style="padding:4px 12px">
        <${Resumen} items=${[
          ['trabajos en la planilla', filas.length],
          ['semanas', semanas.length],
          ['minutos', totalMinutos.toLocaleString('es-AR')],
          ['subtotal', plata(subtotal)],
        ]} />
        ${semanas.length > 0 && html`<div class="semanas-prod">
          ${semanas.map(w => html`<div class="sem" key=${w.lunes}>
            <div class="mini">Semana del ${fecha(w.lunes, 1)}</div>
            <div class="dato"><b>${w.services}</b> service${w.services === 1 ? '' : 's'}${' '}
              · tramo${w.tramo.includes('+') ? 's' : ''} <b>${w.tramo}</b></div>
            <div class="mini">${w.filas} trabajo${w.filas === 1 ? '' : 's'} · ${plata(w.pago)}</div>
          </div>`)}
        </div>
        <div class="mini">El pago es escalonado: dentro de cada semana los tres primeros
          services van al valor de 1 a 3, el cuarto, quinto y sexto al de 4 a 6, y así.
          El conteo arranca de cero cada lunes.</div>`}
      </div>
      <div class="panel-cuerpo" style="padding-top:0">
        <div class="rejilla dos">
          <label class="campo"><span>Productividad semana planta</span>
            <textarea rows="2" value=${texto.semana_planta}
              onChange=${e => guardarTexto({ semana_planta: e.target.value })}
              placeholder="Por ejemplo: *Actitudinal 0%  *Productividad 73%  *Presentismo 100%" /></label>
          <label class="campo"><span>Bono 0 garantías de service</span>
            <textarea rows="2" value=${texto.bono_garantias}
              onChange=${e => guardarTexto({ bono_garantias: e.target.value })}
              placeholder="Por ejemplo: $0" /></label>
        </div>
        <div class="mini">Los dos se guardan solos al salir del recuadro. Salen impresos en las
          últimas dos columnas de la planilla.</div>
      </div>
    </div>

    <div class="tabla-caja panel hoja-productividad" ref=${caja}>
      <div class="titulo-prod">${titulo}</div>
      <table class="grilla prod">
        <thead><tr>
          <th class="p-n">N°</th>
          <th class="p-mant">Mantenimiento</th>
          <th class="p-finst">Fecha de<br />instalación</th>
          <th class="p-cli">Cliente</th>
          <th class="p-fecha">Fecha<br />pedido</th>
          <th class="p-serv">Tipo<br />servicio</th>
          <th class="p-estado">Estado</th>
          <th class="p-fecha">Fecha de<br />visita</th>
          <th class="p-tec">Técnico</th>
          <th class="der p-min">Tiempos MO<br />[Min]</th>
          <th class="der p-pago">Pago</th>
          <th class="p-texto">Productividad<br />semana planta</th>
          <th class="p-texto">Bono 0 garantías<br />de service</th>
        </tr></thead>
        <tbody>
          ${filas.map((f, i) => html`<tr key=${f.t.id}
            class=${i > 0 && filas[i - 1].lunes !== f.lunes ? 'nueva-semana' : ''}>
            <td><b>${f.t.n_llamada || '#' + f.t.id}</b></td>
            <td>${f.t.tipo_pedido}</td>
            <td class="der">${fecha(f.t.fecha_instalacion)}</td>
            <td>${f.t.cliente_nombre}</td>
            <td class="der">${fecha(f.t.fecha_pedido)}</td>
            <td>${(f.t.tipo_servicio || '').toUpperCase()}</td>
            <td><${Et} txt=${f.t.estado} mapa=${COLOR_ESTADO} /></td>
            <td class="der">${fecha(f.t.fecha_visita)}</td>
            <td>${f.t.tecnicos}</td>
            <td class="num p-min">
              <input type="number" step="1" value=${f.minutos}
                title=${f.minutosAmano ? 'Corregido a mano' : `Sale de ${f.t.horas_mo || 0} h de mano de obra`}
                class=${'celda' + (f.minutosAmano ? ' amano' : '')}
                onChange=${e => guardarItem(f.t.id, { minutos: e.target.value === ''
                  ? null : Number(e.target.value) })} />
              <span class="solo-impresion">${(f.minutos || 0).toLocaleString('es-AR')}</span></td>
            <td class="num">
              <input type="text" inputMode="numeric" value=${plata(f.pago)}
                title=${f.pagoAmano ? `Corregido a mano. El cálculo daba ${plata(f.sugerido)}`
                  : explicarPago(f, valorMinuto)}
                class=${'celda' + (f.pagoAmano ? ' amano' : '')}
                onChange=${e => guardarItem(f.t.id, { pago: soloNumero(e.target.value) })} />
              ${(f.pagoAmano || f.minutosAmano) && html`<button class="btn sec chico volver no-imprimir"
                title=${`Corregido a mano. Volver al valor calculado (${plata(f.sugerido)}).`}
                onClick=${() => volverAlCuadro(f.t.id)}>↺</button>`}
              <span class="solo-impresion">${plata(f.pago)}</span></td>
            <td class=${'texto-prod' + (i === filas.length - 1 ? ' ultima' : '')}
              >${i === medio ? texto.semana_planta : ''}</td>
            <td class=${'texto-prod' + (i === filas.length - 1 ? ' ultima' : '')}
              >${i === medio ? texto.bono_garantias : ''}</td>
          </tr>`)}
        </tbody>
        <tfoot>
          <tr class="subtotal">
            <td colspan="9" class="der"><b>SUBTOTAL SERVICE</b></td>
            <td class="num p-min"><b>${totalMinutos.toLocaleString('es-AR')}</b></td>
            <td class="num"><b>${plata(subtotal)}</b></td>
            <td colspan="2"></td>
          </tr>
        </tfoot>
      </table>
      ${!filas.length && html`<div class="vacio">
        ${tecnico ? `${tecnico.nombre} no tiene trabajos cumplidos en ${nombreMes} de ${anio}.`
          : 'Todavía no hay técnicos cargados.'}</div>`}
      <${Deslizador} para=${caja} />
    </div>

    ${verCuadro && html`<${CuadroValores} periodo=${periodo} datos=${datos}
      alCerrar=${() => setVerCuadro(false)} alGuardar=${recargar} />`}
  </div>`;
}

/* =====================================================================
   EL CUADRO DE VALORES DEL MES
   Es lo que él actualiza mes a mes. Se puede copiar del mes anterior
   para no tener que escribir los doce números de nuevo.
   ===================================================================== */
function CuadroValores({ periodo, datos, alCerrar, alGuardar }) {
  const [minuto, setMinuto] = useState(() => String(datos.valorMinuto || ''));
  const [vals, setVals] = useState(() => {
    const m = {};
    for (const c of PROD_CATEGORIAS) for (const t of PROD_TRAMOS) {
      const v = datos.valores.find(x => x.categoria === c.id && x.tramo === t.id);
      m[c.id + '|' + t.id] = v ? String(v.valor) : '';
    }
    return m;
  });
  const [cats, setCats] = useState(() => Object.fromEntries(
    datos.categorias.map(c => [c.tipo_pedido, c.categoria])));
  const [guardando, setGuardando] = useState(false);
  const tipos = opciones('tipo_pedido');

  const mesAnterior = () => {
    const [a, m] = periodo.split('-').map(Number);
    const d = new Date(a, m - 2, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  };

  async function copiarDelMesAnterior() {
    const ant = mesAnterior();
    const [{ data, error }, cfg] = await Promise.all([
      cliente().from('productividad_valores').select('*').eq('periodo', ant),
      cliente().from('productividad_config').select('*').eq('periodo', ant).maybeSingle(),
    ]);
    if (error) return toast('No se pudo leer el mes anterior: ' + error.message, 'error');
    if (!data || !data.length) return toast('El mes anterior no tiene valores cargados', 'error');
    const m = { ...vals };
    for (const v of data) m[v.categoria + '|' + v.tramo] = String(v.valor);
    setVals(m);
    if (cfg.data && cfg.data.valor_minuto) setMinuto(String(cfg.data.valor_minuto));
    toast(`Se trajeron los valores de ${ant}. Revisalos y guardá.`);
  }

  async function guardar() {
    setGuardando(true);
    try {
      const filas = [];
      for (const c of PROD_CATEGORIAS) for (const t of PROD_TRAMOS) {
        const v = vals[c.id + '|' + t.id];
        filas.push({ periodo, categoria: c.id, tramo: t.id, valor: v === '' ? 0 : Number(v) });
      }
      const r1 = await cliente().from('productividad_valores')
        .upsert(filas, { onConflict: 'periodo,categoria,tramo' });
      if (r1.error) throw new Error(r1.error.message);
      const rc = await cliente().from('productividad_config')
        .upsert({ periodo, valor_minuto: minuto === '' ? 0 : Number(minuto) },
          { onConflict: 'periodo' });
      if (rc.error) throw new Error(rc.error.message);
      const r2 = await cliente().from('productividad_categorias')
        .upsert(Object.entries(cats).map(([tipo_pedido, categoria]) => ({ tipo_pedido, categoria })),
          { onConflict: 'tipo_pedido' });
      if (r2.error) throw new Error(r2.error.message);
      toast('Valores guardados', 'ok');
      await alGuardar();
      alCerrar();
    } catch (e) { toast('No se pudo guardar: ' + (e.message || e), 'error'); }
    setGuardando(false);
  }

  return html`<${Modal} titulo=${`Valores de productividad · ${periodo}`} alCerrar=${alCerrar} ancho=${760}>
    <p class="mini">Cuánto se paga cada trabajo según cuántos ${' '}
      <b>services y services proactivos</b>${' '} hizo el técnico ese mes. Es el cuadro que actualizás vos todos los meses.</p>
    <div class="aviso">
      <label class="fila" style="gap:8px;align-items:center">
        <b>Valor del minuto</b>
        <input type="number" step="0.01" style="width:130px;text-align:right" value=${minuto}
          onInput=${e => setMinuto(e.target.value)} />
        <span class="mini">${minuto && Number(minuto) > 0
          ? `= ${plata(Number(minuto) * 60)} la hora` : ''}</span>
      </label>
      <div class="mini" style="margin-top:6px">
        Los <b>services y services proactivos</b> se pagan al valor fijo del tramo,
        y el tramo es <b>escalonado dentro de cada semana</b>: los tres primeros de
        la semana al valor de 1 a 3, el cuarto, quinto y sexto al de 4 a 6, el
        séptimo y el octavo al de 7 a 8, y del noveno en adelante al de 9 o más.
        Todo lo demás —garantías, asistencias técnicas, relevamientos— se paga${' '}
        <b>por minuto trabajado</b>, y los números del cuadro de abajo son el${' '}
        <b>tope</b>: por más minutos que lleve, no se paga más que eso.</div>
    </div>
    <div class="tabla-caja" style="max-height:none;margin-bottom:12px">
      <table class="grilla">
        <thead><tr><th style="min-width:210px">Categoría</th>
          ${PROD_TRAMOS.map(t => html`<th class="der">${t.rot}</th>`)}</tr></thead>
        <tbody>
          ${PROD_CATEGORIAS.filter(c => c.id !== 'sin_pago').map(c => html`<tr key=${c.id}>
            <td><b>${c.rot}</b></td>
            ${PROD_TRAMOS.map(t => html`<td class="num">
              <input type="number" step="1" style="width:110px;text-align:right"
                value=${vals[c.id + '|' + t.id]}
                onInput=${e => setVals(v => ({ ...v, [c.id + '|' + t.id]: e.target.value }))} />
            </td>`)}
          </tr>`)}
        </tbody>
      </table>
    </div>

    <details>
      <summary class="mini" style="cursor:pointer;margin-bottom:8px">
        Qué categoría le toca a cada tipo de pedido</summary>
      <div class="tabla-caja" style="max-height:280px">
        <table class="grilla">
          <thead><tr><th>Tipo de pedido</th><th>Se paga como</th></tr></thead>
          <tbody>
            ${tipos.map(tp => html`<tr key=${tp}>
              <td>${tp}</td>
              <td><select style="width:auto" value=${cats[tp] || 'sin_pago'}
                onChange=${e => setCats(c => ({ ...c, [tp]: e.target.value }))}>
                ${PROD_CATEGORIAS.map(c => html`<option value=${c.id}>${c.rot}</option>`)}
              </select></td>
            </tr>`)}
          </tbody>
        </table>
      </div>
      <div class="mini" style="margin-top:6px">Sólo los que estén como${' '}
        <b>Service y Service Proactivo</b>${' '} cuentan para el tramo.</div>
    </details>

    <div class="fila" style="justify-content:space-between;margin-top:14px">
      <button class="btn sec" onClick=${copiarDelMesAnterior}>Copiar del mes anterior</button>
      <div class="fila">
        <button class="btn sec" onClick=${alCerrar}>Cancelar</button>
        <button class="btn" disabled=${guardando} onClick=${guardar}>
          ${guardando ? 'Guardando…' : 'Guardar'}</button>
      </div>
    </div>
  <//>`;
}


/* ===== 68_graficos.js ===== */
/* =====================================================================
   GRÁFICOS
   Piezas chicas de SVG hechas a mano: no hay ninguna librería de gráficos
   dando vueltas, así que la aplicación sigue siendo un solo archivo que
   no descarga nada de internet.

   Reglas que se respetan en todos:
     · los colores salen siempre de --sv-1 … --sv-5, en ese orden y sin
       saltear, porque están elegidos para distinguirse entre sí incluso
       para alguien que no ve bien los colores;
     · cuando hay más de una serie hay referencia, y además el nombre
       escrito al lado del dato: nunca se depende sólo del color;
     · el texto va siempre en el color del texto, no en el de la serie;
     · las líneas de fondo son tenues, el dato manda;
     · todos muestran el detalle al pasar el mouse por encima.
   ===================================================================== */

const SV = ['var(--sv-1)', 'var(--sv-2)', 'var(--sv-3)', 'var(--sv-4)', 'var(--sv-5)'];

/** el mismo formato para todo: números cortos y prolijos */
const numAR = v => Number(v || 0).toLocaleString('es-AR');

/* ---------------------------------------------------------------------
   Tarjeta de dato suelto, con su mini-tendencia
   --------------------------------------------------------------------- */
function Tarjeta({ rot, val, sub, tono = 1, serie }) {
  const max = Math.max(1, ...(serie || [0]));
  const n = (serie || []).length;
  return html`<div class="tarjeta" style=${`--tono:var(--pastel-${tono});--linea:var(--sv-${tono})`}>
    <div class="rot">${rot}</div>
    <div class="val">${val}</div>
    ${sub && html`<div class="sub">${sub}</div>`}
    ${n > 1 && html`<svg class="chispa" viewBox=${`0 0 ${(n - 1) * 10} 26`} preserveAspectRatio="none"
        aria-hidden="true">
      <polyline fill="none" stroke="var(--linea)" stroke-width="2" stroke-linejoin="round"
        stroke-linecap="round" vector-effect="non-scaling-stroke"
        points=${serie.map((v, i) => `${i * 10},${24 - (v / max) * 22}`).join(' ')} />
    </svg>`}
  </div>`;
}

/* ---------------------------------------------------------------------
   Línea: para ver cómo evoluciona algo a lo largo del año
   --------------------------------------------------------------------- */
function Linea({ titulo, nota, datos, formato, tono = 1, enCurso = false }) {
  const [encima, setEncima] = useState(null);
  const fmt = formato || numAR;
  const vals = datos.map(d => d[1]);
  const max = Math.max(1, ...vals);
  const W = 560, H = 168, izq = 8, der = 8, arriba = 14, abajo = 26;
  const ancho = W - izq - der, alto = H - arriba - abajo;
  const x = i => izq + (datos.length < 2 ? ancho / 2 : (i / (datos.length - 1)) * ancho);
  const y = v => arriba + alto - (v / max) * alto;
  const linea = datos.map((d, i) => `${x(i)},${y(d[1])}`).join(' ');
  /* El último mes puede estar recién empezado: se dibuja punteado para que
     no parezca que el trabajo se derrumbó. */
  const cierre = enCurso && datos.length > 1
    ? datos.slice(-2).map((d, k) => `${x(datos.length - 2 + k)},${y(d[1])}`).join(' ') : '';
  const firme = enCurso && datos.length > 1
    ? datos.slice(0, -1).map((d, i) => `${x(i)},${y(d[1])}`).join(' ') : linea;
  const area = datos.length
    ? `M ${x(0)},${arriba + alto} L ${linea.split(' ').join(' L ')} L ${x(datos.length - 1)},${arriba + alto} Z`
    : '';
  const rejas = [0, .25, .5, .75, 1].map(f => arriba + alto - f * alto);

  return html`<div class="panel grafico" style=${`--tono:var(--sv-${tono})`}>
    <div class="panel-cab"><h2>${titulo}</h2>${nota && html`<span class="mini">${nota}</span>`}</div>
    <div class="panel-cuerpo">
      ${!datos.length ? html`<div class="mini">Sin datos en el período.</div>` : html`
      <svg viewBox=${`0 0 ${W} ${H}`} class="svg-grafico" role="img"
        aria-label=${titulo} onMouseLeave=${() => setEncima(null)}>
        ${rejas.map(yy => html`<line x1=${izq} x2=${W - der} y1=${yy} y2=${yy}
          stroke="var(--reja)" stroke-width="1" />`)}
        <path d=${area} fill="var(--tono)" opacity=".12" />
        <polyline fill="none" stroke="var(--tono)" stroke-width="2" stroke-linejoin="round"
          stroke-linecap="round" points=${firme} />
        ${cierre && html`<polyline fill="none" stroke="var(--tono)" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="4 4" opacity=".75" points=${cierre} />`}
        ${datos.map((d, i) => html`<circle cx=${x(i)} cy=${y(d[1])} r=${encima === i ? 5.5 : 3.5}
          fill=${enCurso && i === datos.length - 1 ? 'var(--papel)' : 'var(--tono)'}
          stroke="var(--tono)" stroke-width="2" />`)}
        ${datos.map((d, i) => html`<rect x=${x(i) - ancho / (datos.length * 2)} y=${arriba}
          width=${ancho / datos.length} height=${alto} fill="transparent"
          onMouseEnter=${() => setEncima(i)} />`)}
        ${datos.map((d, i) => (datos.length <= 12 || i % 2 === 0) && html`<text x=${x(i)}
          y=${H - 8} text-anchor="middle" class="eje">${String(d[0]).slice(0, 3)}</text>`)}
      </svg>
      <div class="pie-grafico">
        ${encima !== null
          ? html`<span><b>${datos[encima][0]}</b> · ${fmt(datos[encima][1])}</span>`
          : html`<span class="mini">Pasá el mouse por encima para ver cada mes.${' '}
              Máximo: <b>${fmt(max)}</b>${enCurso ? ' · el último mes va por la mitad' : ''}</span>`}
      </div>`}
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------
   Barras horizontales: comparar cantidades, de mayor a menor
   Un solo tono: acá lo que importa es el tamaño, no la identidad.
   --------------------------------------------------------------------- */
function Barras({ titulo, datos, formato, nota, tono = 1, tope = 12 }) {
  const lista = datos.slice(0, tope);
  const max = Math.max(1, ...lista.map(d => d[1]));
  const fmt = formato || numAR;
  return html`<div class="panel grafico" style=${`--tono:var(--sv-${tono})`}>
    <div class="panel-cab"><h2>${titulo}</h2>${nota && html`<span class="mini">${nota}</span>`}</div>
    <div class="panel-cuerpo">
      ${!lista.length && html`<div class="mini">Sin datos en el período.</div>`}
      <div class="barras">
        ${lista.map(([rot, val]) => html`<div class="barra-item" key=${rot}
            title=${`${rot}: ${fmt(val)}`}>
          <span class="rotulo" title=${rot}>${rot}</span>
          <span class="track"><span class="fill"
            style=${`width:${Math.max(1.5, val / max * 100)}%`}></span></span>
          <span class="der valor">${fmt(val)}</span>
        </div>`)}
      </div>
      ${datos.length > tope && html`<div class="mini" style="margin-top:6px">
        Se muestran los ${tope} primeros de ${datos.length}.</div>`}
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------
   Barra apilada: de qué se compone un total
   Acá sí manda la identidad, así que va con los colores de la paleta,
   con referencia y con el nombre escrito al lado.
   --------------------------------------------------------------------- */
/* fijo=true deja las partes en el orden en que llegan y no junta el resto en
   "Otros": sirve cuando cada parte es una situación con nombre propio y tiene
   que estar siempre en el mismo lugar y del mismo color.
   tonos permite elegir qué color le toca a cada parte (null = gris). */
function Apilada({ titulo, nota, datos, tope = 4, formato, fijo = false, tonos }) {
  const fmt = formato || numAR;
  const [encima, setEncima] = useState(null);
  const total = datos.reduce((a, d) => a + d[1], 0) || 1;
  const orden = fijo ? [...datos] : [...datos].sort((a, b) => b[1] - a[1]);
  const principales = fijo ? orden : orden.slice(0, tope);
  const resto = fijo ? 0 : orden.slice(tope).reduce((a, d) => a + d[1], 0);
  const partes = resto > 0 ? [...principales, ['Otros', resto]] : principales;
  const color = i => {
    if (tonos) return tonos[i] === null || tonos[i] === undefined ? 'var(--suave)' : SV[tonos[i]];
    return i < 5 ? SV[i] : 'var(--suave)';
  };

  /* sin título se dibuja pelada, para meterla adentro de otro recuadro */
  return html`<div class=${'grafico' + (titulo ? ' panel' : ' suelta')}>
    ${titulo && html`<div class="panel-cab"><h2>${titulo}</h2>
      ${nota && html`<span class="mini">${nota}</span>`}</div>`}
    <div class=${titulo ? 'panel-cuerpo' : ''}>
      ${!datos.length ? html`<div class="mini">Sin datos en el período.</div>` : html`
      <div class="apilada" onMouseLeave=${() => setEncima(null)}>
        ${partes.map(([rot, val], i) => html`<span class="tramo"
          key=${rot}
          title=${`${rot}: ${fmt(val)} (${Math.round(val / total * 100)}%)`}
          onMouseEnter=${() => setEncima(i)}
          style=${`width:${val / total * 100}%;background:${color(i)};
                   opacity:${encima === null || encima === i ? 1 : .45}`}></span>`)}
      </div>
      <div class="referencia">
        ${partes.map(([rot, val], i) => html`<span class="ref" key=${rot}
            onMouseEnter=${() => setEncima(i)} onMouseLeave=${() => setEncima(null)}>
          <span class="punto" style=${`background:${color(i)}`}></span>
          ${rot} <b>${fmt(val)}</b>
          <span class="mini">${Math.round(val / total * 100)}%</span>
        </span>`)}
      </div>`}
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------
   Mapa de calor: cuánto trabajó cada técnico en cada mes
   Un solo tono de claro a oscuro: más oscuro = más trabajos.
   --------------------------------------------------------------------- */
function MapaCalor({ titulo, nota, filas, columnas, valor }) {
  const [encima, setEncima] = useState(null);
  const todos = filas.flatMap(f => columnas.map(c => valor(f, c)));
  const max = Math.max(1, ...todos);
  const paso = v => {
    if (!v) return 'var(--esc-0)';
    const n = Math.ceil(v / max * 5);
    return `var(--esc-${Math.min(5, Math.max(1, n))})`;
  };
  return html`<div class="panel grafico">
    <div class="panel-cab"><h2>${titulo}</h2>${nota && html`<span class="mini">${nota}</span>`}</div>
    <div class="panel-cuerpo despl-h" style="overflow-x:auto">
      ${!filas.length ? html`<div class="mini">Sin datos en el período.</div>` : html`
      <table class="calor" onMouseLeave=${() => setEncima(null)}>
        <thead><tr><th></th>
          ${columnas.map(c => html`<th key=${c}>${String(c).slice(0, 3)}</th>`)}</tr></thead>
        <tbody>
          ${filas.map(f => html`<tr key=${f}>
            <th class="rot" title=${f}>${f}</th>
            ${columnas.map(c => {
              const v = valor(f, c);
              return html`<td key=${c} title=${`${f} · ${c}: ${numAR(v)}`}
                onMouseEnter=${() => setEncima([f, c, v])}>
                <span class="celda" style=${`background:${paso(v)}`}>${v || ''}</span></td>`;
            })}
          </tr>`)}
        </tbody>
      </table>
      <div class="pie-grafico">
        ${encima
          ? html`<span><b>${encima[0]}</b> · ${encima[1]}: ${numAR(encima[2])} trabajos</span>`
          : html`<span class="mini">Cuanto más oscuro, más trabajos.${' '}
              Máximo en un mes: <b>${numAR(max)}</b></span>`}
        <span class="escala">
          <span class="mini">menos</span>
          ${[0, 1, 2, 3, 4, 5].map(i => html`<span class="paso"
            style=${`background:var(--esc-${i})`}></span>`)}
          <span class="mini">más</span>
        </span>
      </div>`}
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------
   Mapa de calor del país
   Cada provincia es un casillero puesto donde le toca en el mapa: el
   norte arriba, la Patagonia abajo, la costa a la derecha. No es el
   contorno dibujado de la Argentina —eso obligaría a meter un archivo de
   mapa dentro de la aplicación— pero se lee igual: se ve de un vistazo
   en qué parte del país está el trabajo, y además cada provincia ocupa
   el mismo lugar, así que las chicas no desaparecen.
   Cuanto más oscuro el casillero, más trabajos.
   --------------------------------------------------------------------- */
const MAPA_AR = [
  /* [fila, columna, provincia, cómo se rotula] — 5 columnas, de oeste a este */
  [1, 2, 'JUJUY', 'Jujuy'],              [1, 4, 'FORMOSA', 'Formosa'],
  [2, 2, 'SALTA', 'Salta'],              [2, 4, 'CHACO', 'Chaco'],
  [2, 5, 'MISIONES', 'Misiones'],
  [3, 2, 'CATAMARCA', 'Catamarca'],      [3, 3, 'TUCUMÁN', 'Tucumán'],
  [3, 4, 'SANTIAGO DEL ESTERO', 'Sgo. del Estero'], [3, 5, 'CORRIENTES', 'Corrientes'],
  [4, 1, 'LA RIOJA', 'La Rioja'],        [4, 3, 'CÓRDOBA', 'Córdoba'],
  [4, 4, 'SANTA FE', 'Santa Fe'],        [4, 5, 'ENTRE RÍOS', 'Entre Ríos'],
  [5, 1, 'SAN JUAN', 'San Juan'],        [5, 2, 'SAN LUIS', 'San Luis'],
  [5, 4, 'BUENOS AIRES', 'Buenos Aires'], [5, 5, 'CABA', 'CABA'],
  [6, 1, 'MENDOZA', 'Mendoza'],          [6, 3, 'LA PAMPA', 'La Pampa'],
  [7, 1, 'NEUQUÉN', 'Neuquén'],          [7, 3, 'RÍO NEGRO', 'Río Negro'],
  [8, 2, 'CHUBUT', 'Chubut'],
  [9, 2, 'SANTA CRUZ', 'Santa Cruz'],
  [10, 3, 'TIERRA DEL FUEGO', 'T. del Fuego'],
];

function MapaPais({ titulo, nota, valor, sueltas = [] }) {
  const [encima, setEncima] = useState(null);
  const max = Math.max(1, ...MAPA_AR.map(p => valor(p[2])));
  const paso = v => {
    if (!v) return 'var(--esc-0)';
    return `var(--esc-${Math.min(5, Math.max(1, Math.ceil(v / max * 5)))})`;
  };
  /* con el casillero oscuro el número tiene que ir en claro para leerse */
  const tinta = v => (v && Math.ceil(v / max * 5) >= 4) ? 'var(--papel)' : 'var(--texto)';
  const total = MAPA_AR.reduce((a, p) => a + valor(p[2]), 0);

  return html`<div class="panel grafico">
    <div class="panel-cab"><h2>${titulo}</h2>${nota && html`<span class="mini">${nota}</span>`}</div>
    <div class="panel-cuerpo">
      <div class="mapa-ar" onMouseLeave=${() => setEncima(null)}>
        ${MAPA_AR.map(([f, c, prov, rot]) => {
          const v = valor(prov);
          return html`<div class="prov" key=${prov} title=${`${prov}: ${numAR(v)}`}
            style=${`grid-row:${f};grid-column:${c};background:${paso(v)};color:${tinta(v)}`}
            onMouseEnter=${() => setEncima([prov, v])}>
            <span class="sigla">${rot}</span>
            <span class="dato">${v ? numAR(v) : ''}</span>
          </div>`;
        })}
      </div>
      <div class="pie-grafico">
        ${encima
          ? html`<span><b>${encima[0]}</b> · ${numAR(encima[1])} trabajo${encima[1] === 1 ? '' : 's'}</span>`
          : html`<span class="mini">${numAR(total)} trabajos ubicados${' '}
              · más oscuro, más trabajo · máximo <b>${numAR(max)}</b></span>`}
        <span class="escala">
          <span class="mini">menos</span>
          ${[0, 1, 2, 3, 4, 5].map(i => html`<span class="paso"
            style=${`background:var(--esc-${i})`}></span>`)}
          <span class="mini">más</span>
        </span>
      </div>
      ${sueltas.length > 0 && html`<div class="aviso" style="margin-top:9px">
        <b>Hay provincias mal escritas en la base</b>
        <div class="mini">Estos valores no coinciden con ninguna provincia, así que no entran
          en el mapa: ${sueltas.map(x => `${x[0]} (${x[1]})`).join(' · ')}.
          Se corrigen desde Clientes y equipos.</div>
      </div>`}
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------
   Columnas apiladas: de qué se compone el total de cada mes
   La línea de arriba dice cuántos trabajos hubo cada mes; ésta dice de
   qué estaban hechos, sin taparla ni competir con ella.
   --------------------------------------------------------------------- */
function ColumnasApiladas({ titulo, nota, meses, series, formato }) {
  const [encima, setEncima] = useState(null);
  const fmt = formato || numAR;
  const totales = meses.map((_, i) => series.reduce((a, s) => a + (s.valores[i] || 0), 0));
  const max = Math.max(1, ...totales);
  const W = 700, H = 210, izq = 30, der = 8, arriba = 10, abajo = 26;
  const ancho = W - izq - der, alto = H - arriba - abajo;
  const paso = ancho / Math.max(1, meses.length);
  const barra = Math.min(38, paso * .66);
  const rejas = [0, .25, .5, .75, 1];

  return html`<div class="panel grafico">
    <div class="panel-cab"><h2>${titulo}</h2>${nota && html`<span class="mini">${nota}</span>`}</div>
    <div class="panel-cuerpo">
      ${!meses.length ? html`<div class="mini">Sin datos en el período.</div>` : html`
      <svg viewBox=${`0 0 ${W} ${H}`} class="svg-grafico" role="img" aria-label=${titulo}
        onMouseLeave=${() => setEncima(null)}>
        ${rejas.map(f => html`<g>
          <line x1=${izq} x2=${W - der} y1=${arriba + alto - f * alto} y2=${arriba + alto - f * alto}
            stroke="var(--reja)" stroke-width="1" />
          <text x=${izq - 5} y=${arriba + alto - f * alto + 3} text-anchor="end"
            class="eje">${numAR(Math.round(max * f))}</text>
        </g>`)}
        ${meses.map((m, i) => {
          const x = izq + i * paso + (paso - barra) / 2;
          let acumulado = 0;
          return html`<g key=${m}>
            ${series.map((s, k) => {
              const v = s.valores[i] || 0;
              if (!v) return null;
              const h = v / max * alto;
              acumulado += h;
              return html`<rect x=${x} y=${arriba + alto - acumulado} width=${barra} height=${h}
                fill=${SV[k % 5]} opacity=${encima === null || encima === k ? 1 : .35}>
                <title>${m} · ${s.rot}: ${fmt(v)}</title></rect>`;
            })}
            <text x=${x + barra / 2} y=${H - 8} text-anchor="middle"
              class="eje">${String(m).slice(0, 3)}</text>
          </g>`;
        })}
      </svg>
      <div class="referencia">
        ${series.map((s, k) => html`<span class="ref" key=${s.rot}
            onMouseEnter=${() => setEncima(k)} onMouseLeave=${() => setEncima(null)}>
          <span class="punto" style=${`background:${SV[k % 5]}`}></span>
          ${s.rot} <b>${fmt(s.valores.reduce((a, v) => a + v, 0))}</b>
        </span>`)}
      </div>`}
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------
   Lo que más se repite en un texto escrito a mano
   Barras comunes, pero cada barra se puede tocar: abajo aparecen los
   trabajos donde se dijo eso, con la observación entera. Sin eso el
   gráfico sería una lista de palabras sueltas sin contexto; con eso se
   puede ir de "puerta planta alta, 33 veces" a leer los 33 casos.
   --------------------------------------------------------------------- */
function Repetidas({ titulo, nota, textos, comercial = false, tono = 1, tope = 15,
                    alAbrir, buscadas }) {
  /* 'lista' = los términos fijos que se siguen siempre; 1/2/3 = lo que más se
     repite en general, de a una, dos o tres palabras */
  const [modo, setModo] = useState(buscadas ? 'lista' : 2);
  const [elegida, setElegida] = useState(null);

  const r = useMemo(() => modo === 'lista'
    ? contarBuscadas(textos, buscadas, comercial)
    : contarRepetidas(textos, modo, comercial),
    [textos, modo, comercial, buscadas]);
  useEffect(() => setElegida(null), [modo, textos]);

  /* la lista fija va entera y en su orden; lo repetido, recortado a los primeros */
  const lista = modo === 'lista' ? r.lista : r.lista.slice(0, tope);
  const max = Math.max(1, ...lista.map(d => d[1]));
  const ejemplos = elegida
    ? (r.dondeEsta.get(elegida) || []).map(id => textos.find(t => t.id === id)).filter(Boolean)
    : [];

  return html`<div class="panel grafico repetidas" style=${`--tono:var(--sv-${tono})`}>
    <div class="panel-cab"><h2>${titulo}</h2>
      ${nota && html`<span class="mini">${nota}</span>`}
      <div class="fila" style="margin-left:auto;gap:4px">
        ${(buscadas ? [['lista', 'mi lista']] : []).concat([[1, 'palabras'], [2, 'de a dos'], [3, 'de a tres']])
          .map(([n, rot]) => html`<button class=${'btn chico ' + (modo === n ? '' : 'sec')} key=${rot}
            title=${n === 'lista'
              ? 'Sólo las fallas de la lista fija (se edita en Administración → Listas)'
              : 'Lo que más se repite en el texto, sin lista previa'}
            onClick=${() => setModo(n)}>${rot}</button>`)}
      </div>
    </div>
    <div class="panel-cuerpo">
      ${!lista.length ? html`<div class="mini">Todavía no hay texto suficiente para sacar
        conclusiones en este período.</div>` : html`
      <div class="barras">
        ${lista.map(([frase, veces]) => html`<div key=${frase}
            class=${'barra-item apretable' + (elegida === frase ? ' elegida' : '')
              + (veces ? '' : ' en-cero')}
            title=${veces
              ? `Tocá para ver los ${veces} trabajos donde se dice “${frase}”` +
                (r.comoAparece ? '\nEncontrado como: ' +
                  [...(r.comoAparece.get(frase) || new Map()).entries()]
                    .sort((a, b) => b[1] - a[1]).map(([f, n]) => `${f} (${n})`).join(', ') : '')
              : 'No aparece en ningún trabajo de este período'}
            onClick=${() => veces && setElegida(f => f === frase ? null : frase)}>
          <span class="rotulo" title=${frase}>${frase}</span>
          <span class="track"><span class="fill"
            style=${`width:${Math.max(1.5, veces / max * 100)}%`}></span></span>
          <span class="der valor">${numAR(veces)}</span>
        </div>`)}
      </div>
      <div class="pie-grafico">
        <span class="mini">Sobre <b>${numAR(r.conTexto)}</b> trabajos con texto cargado${' '}
          · se cuenta una vez por trabajo · tocá una barra para leer los casos${
            modo === 'lista'
              ? ' · la lista se edita en Administración → Listas desplegables' : ''}</span>
      </div>`}

      ${elegida && html`<div class="casos-texto">
        <div class="fila" style="justify-content:space-between;align-items:baseline">
          <b>“${elegida}” · ${numAR(ejemplos.length)} trabajo${ejemplos.length === 1 ? '' : 's'}</b>
          <button class="btn sec chico" onClick=${() => setElegida(null)}>Cerrar</button>
        </div>
        <div class="lista-casos">
          ${ejemplos.slice(0, 40).map(e => html`<div class="caso-texto" key=${e.id}
              onClick=${() => alAbrir && alAbrir(e.id)}
              title=${alAbrir ? 'Abrir este trabajo' : ''}>
            <div class="mini enc">${e.rot}</div>
            <div class="txt">${e.txt}</div>
          </div>`)}
        </div>
        ${ejemplos.length > 40 && html`<div class="mini" style="margin-top:6px">
          Se muestran los 40 primeros de ${numAR(ejemplos.length)}.</div>`}
      </div>`}
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------
   Medidor: una proporción contra su total
   --------------------------------------------------------------------- */
function Medidor({ rot, parte, total, tono = 1, detalle }) {
  const pct = total ? Math.round(parte / total * 100) : 0;
  return html`<div class="medidor" style=${`--tono:var(--sv-${tono})`}>
    <div class="fila" style="justify-content:space-between;gap:6px">
      <span>${rot}</span><b>${pct}%</b>
    </div>
    <span class="track"><span class="fill" style=${`width:${pct}%`}></span></span>
    <div class="mini">${detalle || `${numAR(parte)} de ${numAR(total)}`}</div>
  </div>`;
}

/* =====================================================================
   MÓDULO 7 — TABLERO DE GERENCIA
   Está dividido en sectores, cada uno con su color de fondo, para que se
   entienda de un vistazo qué se está mirando: cómo viene el año, de qué
   se trata el trabajo, quién y dónde lo hace, y cómo va la plata.
   Cada dato usa la forma que le corresponde: línea para lo que evoluciona
   en el tiempo, barra apilada para lo que se reparte en partes, barras
   para comparar, y mapa de calor para cruzar técnico contra mes.
   ===================================================================== */
function Tablero() {
  const s = useS();
  const anios = useMemo(() => [...new Set(s.trabajos.map(t => String(t.fecha_visita || '').slice(0, 4))
    .filter(a => a.length === 4))].sort().reverse(), [s.trabajos]);
  const [anio, setAnio] = useState(() => String(new Date().getFullYear()));
  /* Carga (Mateo) entra al tablero para ver cómo viene el trabajo, pero no la
     plata: los recuadros y gráficos de facturación y cobranza no se dibujan. */
  const verPlata = puedeMontos();

  const delAnio = useMemo(() => s.trabajos.filter(t =>
    String(t.fecha_visita || '').slice(0, 4) === anio), [s.trabajos, anio]);

  const cuenta = (lista, clave) => {
    const m = new Map();
    lista.forEach(t => {
      const k = clave(t);
      if (k === null || k === undefined || k === '') return;
      m.set(k, (m.get(k) || 0) + 1);
    });
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  };

  /* Hasta qué mes tiene sentido dibujar: si es el año en curso, hasta el mes
     de hoy. Si no, la línea se desploma a cero en los meses que todavía no
     pasaron y parece que el trabajo se derrumbó. */
  const hastaMes = useMemo(() => {
    const hoyA = hoyISO().slice(0, 4);
    if (anio > hoyA) return 0;
    if (anio < hoyA) return 12;
    return Number(hoyISO().slice(5, 7));
  }, [anio]);

  const serieMensual = useCallback((valor) => {
    const m = new Map();
    for (let i = 1; i <= hastaMes; i++) m.set(String(i).padStart(2, '0'), 0);
    delAnio.forEach(t => {
      const k = String(t.fecha_visita).slice(5, 7);
      if (m.has(k)) m.set(k, m.get(k) + valor(t));
    });
    return [...m.entries()].map(([k, v]) => [MESES[Number(k) - 1], v]);
  }, [delAnio, hastaMes]);

  const porMes = useMemo(() => serieMensual(() => 1), [serieMensual]);

  const montoMes = useMemo(() => serieMensual(t => Number(t.precio_sin_iva) || 0),
    [serieMensual]);

  const porTecnico = useMemo(() => {
    const m = new Map();
    delAnio.forEach(t => (t.tecnicos || '').split(' / ').filter(Boolean)
      .forEach(n => m.set(n, (m.get(n) || 0) + 1)));
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  }, [delAnio]);

  /* técnico × mes, para el mapa de calor: sólo los que más trabajaron */
  const calor = useMemo(() => {
    const m = new Map();
    delAnio.forEach(t => {
      const mes = MESES[Number(String(t.fecha_visita).slice(5, 7)) - 1];
      (t.tecnicos || '').split(' / ').filter(Boolean).forEach(n =>
        m.set(n + '|' + mes, (m.get(n + '|' + mes) || 0) + 1));
    });
    return m;
  }, [delAnio]);

  const porEquipo = useMemo(() => cuenta(delAnio, t => t.n_serie ? `${t.n_serie} — ${t.cliente_nombre || ''}` : null),
    [delAnio]);

  /* ---- provincias ----
     Cada variante mal escrita se lleva a su provincia antes de contar, así
     "ENTRE RÍOS" y "ENTRE RIOS" dejan de ser dos. Lo que no se reconoce se
     aparta y se muestra como aviso: es un dato para arreglar en la base. */
  const provincias = useMemo(() => {
    const m = new Map(), raras = new Map();
    for (const t of delAnio) {
      const bruto = provinciaDe(t);
      if (!bruto || !String(bruto).trim()) continue;
      const p = normalizarProvincia(bruto);
      if (provinciaDesconocida(bruto)) raras.set(p, (raras.get(p) || 0) + 1);
      m.set(p, (m.get(p) || 0) + 1);
    }
    return { conteo: m,
      lista: [...m.entries()].sort((a, b) => b[1] - a[1]),
      raras: [...raras.entries()].sort((a, b) => b[1] - a[1]) };
  }, [delAnio]);

  /* ---- qué se rompe y qué se hace ----
     Se arma con el texto tal como lo escribió el que atendió: las
     observaciones del servicio cuentan las fallas y los comentarios internos
     cuentan lo que se hizo para arreglarlas. */
  const rotuloDe = t => [t.n_llamada || '#' + t.id, t.n_serie, t.cliente_nombre,
    fecha(t.fecha_visita)].filter(Boolean).join(' · ');
  const textosFalla = useMemo(() => delAnio
    .filter(t => (t.obs_servicio || '').trim())
    .map(t => ({ id: t.id, rot: rotuloDe(t), txt: t.obs_servicio })), [delAnio]);
  const textosTarea = useMemo(() => delAnio
    .filter(t => (t.comentarios || '').trim())
    .map(t => ({ id: t.id, rot: rotuloDe(t), txt: t.comentarios })), [delAnio]);

  /* ---- de qué se compone cada mes ----
     La línea de arriba dice cuántos trabajos hubo; esto dice de qué estaban
     hechos. Van los cinco tipos de pedido más frecuentes del año y el resto
     junto, para que la columna no se llene de rayitas ilegibles. */
  const composicion = useMemo(() => {
    const top = cuenta(delAnio, t => t.tipo_pedido).slice(0, 4).map(x => x[0]);
    const nombres = [...top, 'Otros'];
    const series = nombres.map(rot => ({ rot, valores: new Array(hastaMes).fill(0) }));
    for (const t of delAnio) {
      const mes = Number(String(t.fecha_visita).slice(5, 7));
      if (!(mes >= 1 && mes <= hastaMes)) continue;
      const i = top.indexOf(t.tipo_pedido);
      series[i >= 0 ? i : nombres.length - 1].valores[mes - 1]++;
    }
    return series.filter(s => s.valores.some(v => v > 0));
  }, [delAnio, hastaMes]);

  const facturado = delAnio.reduce((a, t) => a + (Number(t.precio_sin_iva) || 0), 0);
  const facturadoConIva = delAnio.reduce((a, t) => a + (Number(t.precio_sin_iva) || 0) * (1 + ivaDe(t) / 100), 0);
  const aCobrar = s.trabajos.filter(t => t.cobrado === 'NO')
    .reduce((a, t) => a + (Number(t.precio_sin_iva) || 0), 0);
  const abiertos = s.trabajos.filter(t => ABIERTOS.includes(t.estado));
  const garantias = delAnio.filter(t => (t.tipo_pedido || '').startsWith('Garantía')).length;
  const sinCerrar = s.trabajos.filter(estaAbierto).length;
  const mesActual = hoyISO().slice(0, 7);
  const delMes = s.trabajos.filter(t => String(t.fecha_visita || '').slice(0, 7) === mesActual);
  const equiposAtendidos = new Set(delAnio.map(t => t.n_serie).filter(Boolean)).size;

  const cobranza = useMemo(() => opciones('cobrado').map(o => {
    const l = s.trabajos.filter(t => t.cobrado === o && Number(t.precio_sin_iva) > 0);
    return { estado: o, trabajos: l.length,
      monto: l.reduce((a, t) => a + Number(t.precio_sin_iva), 0) };
  }).filter(x => x.trabajos), [s.trabajos]);

  return html`<div class="tablero">
    <div class="panel no-imprimir" style="margin-bottom:10px">
      <div class="panel-cab">
        <h2>Tablero ${anio}</h2>
        <${Sel} valor=${anio} opts=${anios} vacio="Año" alCambiar=${v => setAnio(v || anio)} />
        <span class="mini">${verPlata
          ? 'Los importes son sin IVA, tal como se cargan en cada trabajo.'
          : 'Muestra el trabajo del año; los importes no se incluyen en esta vista.'}</span>
        <button class="btn sec chico" style="margin-left:auto" onClick=${() => window.print()}>Imprimir</button>
      </div>
    </div>

    <!-- ============ el año de un vistazo ============ -->
    <section class="sector s1">
      <h3 class="rot-sector">El año de un vistazo</h3>
      <div class="tarjetas">
        <${Tarjeta} tono=${1} rot="Trabajos del año" val=${numAR(delAnio.length)}
          sub=${`${delMes.length} este mes`} serie=${porMes.map(m => m[1])} />
        <${Tarjeta} tono=${2} rot="Pendientes hoy" val=${abiertos.length}
          sub=${`${abiertos.filter(t => t.prioridad === 'Alta').length} de prioridad alta`} />
        <${Tarjeta} tono=${3} rot="Equipos atendidos" val=${numAR(equiposAtendidos)}
          sub=${`de ${numAR(s.equipos.length)} en la base`} />
        ${verPlata && html`<${Tarjeta} tono=${4} rot="Facturado del año" val=${plata(facturado)}
          sub=${`con IVA ${plata(facturadoConIva)}`}
          serie=${montoMes.map(m => m[1])} />`}
        ${verPlata && html`<${Tarjeta} tono=${5} rot="Pendiente de cobro" val=${plata(aCobrar)}
          sub=${`${s.trabajos.filter(t => t.cobrado === 'NO').length} facturas`} />`}
      </div>
      <div class="medidores">
        <${Medidor} tono=${2} rot="Garantías sobre el total del año" parte=${garantias}
          total=${delAnio.length} detalle=${`${garantias} garantías de ${numAR(delAnio.length)} trabajos`} />
        <${Medidor} tono=${4} rot="Cumplidos que todavía no se cerraron" parte=${sinCerrar}
          total=${Math.max(1, delAnio.length)}
          detalle=${`${sinCerrar} esperan facturación u observaciones`} />
        <${Medidor} tono=${3} rot="Equipos de la base atendidos este año" parte=${equiposAtendidos}
          total=${Math.max(1, s.equipos.length)} />
      </div>
    </section>

    <!-- ============ cómo viene el año ============ -->
    <section class="sector s2">
      <h3 class="rot-sector">Cómo viene el año</h3>
      <div class="rejilla-graficos">
        <${Linea} tono=${1} titulo=${`Trabajos por mes — ${anio}`} datos=${porMes}
          enCurso=${anio === hoyISO().slice(0, 4)} />
        ${verPlata && html`<${Linea} tono=${4} titulo=${`Facturación por mes — ${anio}`} datos=${montoMes}
          formato=${v => plata(v)} nota="sin IVA" enCurso=${anio === hoyISO().slice(0, 4)} />`}
      </div>
      <${ColumnasApiladas} titulo=${`De qué se compone cada mes — ${anio}`}
        nota="el mismo total de arriba, abierto por tipo de pedido"
        meses=${MESES.slice(0, hastaMes)} series=${composicion} />
    </section>

    <!-- ============ de qué se trata el trabajo ============ -->
    <section class="sector s3">
      <h3 class="rot-sector">De qué se trata el trabajo</h3>
      <div class="rejilla-graficos">
        <${Apilada} titulo="Tipo de pedido" datos=${cuenta(delAnio, t => t.tipo_pedido)}
          nota="cómo se reparte el año" />
        <${Apilada} titulo="Tipo de servicio" datos=${cuenta(delAnio, t => t.tipo_servicio)}
          nota="cómo se reparte el año" />
      </div>
      <${Barras} tono=${2} titulo="Equipos con más atenciones" datos=${porEquipo} tope=${10}
        nota="sirve para detectar equipos problemáticos" />
    </section>

    <!-- ============ qué se rompe y qué se hace ============ -->
    <section class="sector s2">
      <h3 class="rot-sector">Qué se rompe y qué se hace</h3>
      <${Repetidas} tono=${2} titulo=${`Fallas más frecuentes — ${anio}`}
        nota="lo que más se repite en las observaciones del servicio"
        textos=${textosFalla} comercial=${true} buscadas=${fallasBuscadas()}
        alAbrir=${id => set({ vista: 'trabajos', destacado: id })} />
      <${Repetidas} tono=${3} titulo=${`Reparaciones y tareas más frecuentes — ${anio}`}
        nota="lo que más se repite en los comentarios internos"
        textos=${textosTarea}
        alAbrir=${id => set({ vista: 'trabajos', destacado: id })} />
      <div class="aviso" style="margin-top:10px">
        <b>De dónde sale esto</b>
        <div class="mini" style="white-space:normal">
          No hay ninguna lista de fallas cargada: esto se cuenta del texto que escribe el que
          atiende cada trabajo. De las <b>observaciones del servicio</b> se descartan primero
          las frases que hablan de plata —“Acepta BASIC Service $400.000 + IVA”, la forma de
          pago— porque son notas comerciales y no cuentan como falla. Cada frase se cuenta
          <b>una vez por trabajo</b>, así que el número es “en cuántos trabajos se habló de
          esto”, no cuántas veces se escribió.
          ${textosTarea.length < textosFalla.length / 4 && html`<br /><br />
            <b>Ojo con el segundo gráfico:</b> este año sólo ${numAR(textosTarea.length)} de
            ${numAR(delAnio.length)} trabajos tienen comentarios internos cargados, así que
            todavía dice poco. Cuanto más se completen, más sirve.`}
        </div>
      </div>
    </section>

    <!-- ============ quién y dónde ============ -->
    <section class="sector s4">
      <h3 class="rot-sector">Quién lo hace y dónde</h3>
      <${MapaCalor} titulo=${`Trabajos por técnico y mes — ${anio}`}
        nota="para ver cómo se reparte la carga a lo largo del año"
        filas=${porTecnico.slice(0, 10).map(t => t[0])} columnas=${MESES.slice(0, hastaMes)}
        valor=${(f, c) => calor.get(f + '|' + c) || 0} />
      <div class="rejilla-graficos">
        <${Barras} tono=${3} titulo="Trabajos por técnico" datos=${porTecnico} tope=${12} />
        <${Barras} tono=${5} titulo="Provincias" datos=${provincias.lista} tope=${10}
          nota="cada provincia cuenta una sola vez, aunque en la base esté escrita de varias maneras" />
      </div>
      <${MapaPais} titulo=${`Dónde se trabajó — ${anio}`}
        nota="cada casillero es una provincia, puesta donde le toca en el país"
        valor=${p => provincias.conteo.get(p) || 0} sueltas=${provincias.raras} />
    </section>

    <!-- ============ la plata: sólo para quien puede ver importes ============ -->
    ${verPlata && html`<section class="sector s5">
      <h3 class="rot-sector">Cómo va la cobranza</h3>
      <${Apilada} titulo="Situación de cobro" nota="todos los años, sobre lo que tiene precio cargado"
        datos=${cobranza.map(c => [c.estado, c.monto])} tope=${5} formato=${v => plata(v)} />
      <div class="panel grafico">
        <div class="panel-cab"><h2>El detalle</h2></div>
        <div class="panel-cuerpo">
          <table class="grilla">
            <thead><tr><th>Situación</th><th class="der">Trabajos</th>
              <th class="der">Monto sin IVA</th></tr></thead>
            <tbody>
              ${cobranza.map(c => html`<tr key=${c.estado}>
                <td><${Et} txt=${c.estado} mapa=${COLOR_COBRO} /></td>
                <td class="num">${numAR(c.trabajos)}</td>
                <td class="num">${plata(c.monto)}</td>
              </tr>`)}
            </tbody>
          </table>
        </div>
      </div>
    </section>`}
  </div>`;
}

/* =====================================================================
   MÓDULO 6 — CARTERA: clientes y sus equipos en una sola pantalla
   ===================================================================== */
function Cartera() {
  const s = useS();
  const caja = useRef(null);            // la caja que se desplaza de costado
  const [busca, setBusca] = useState('');
  const [modo, setModo] = useState('clientes');      // clientes | equipos
  const [abierto, setAbierto] = useState({});        // clientes desplegados
  const [editCli, setEditCli] = useState(null);
  const [editEq, setEditEq] = useState(null);
  const [fichaId, setFichaId] = useState(null);
  const [verDup, setVerDup] = useState(false);
  const editable = puedeMaestros();

  const equiposDe = useMemo(() => {
    const m = new Map();
    s.equipos.forEach(e => {
      const k = e.cliente_id || 0;
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(e);
    });
    return m;
  }, [s.equipos]);

  const resumenCli = useMemo(() => {
    const m = new Map();
    s.trabajos.forEach(t => {
      if (!t.cliente_id) return;
      const v = m.get(t.cliente_id) || { n: 0, ultimo: '', monto: 0, aCobrar: 0 };
      v.n++; v.monto += Number(t.precio_sin_iva) || 0;
      if (t.cobrado === 'NO') v.aCobrar += Number(t.precio_sin_iva) || 0;
      if ((t.fecha_visita || '') > v.ultimo) v.ultimo = t.fecha_visita || '';
      m.set(t.cliente_id, v);
    });
    return m;
  }, [s.trabajos]);

  const resumenEq = useMemo(() => {
    const m = new Map();
    s.trabajos.forEach(t => {
      if (!t.equipo_id) return;
      const v = m.get(t.equipo_id) || { n: 0, ultimo: '', garantias: 0, horas: 0 };
      v.n++; v.horas += Number(t.horas_mo) || 0;
      if ((t.tipo_pedido || '').startsWith('Garantía')) v.garantias++;
      if ((t.fecha_visita || '') > v.ultimo) v.ultimo = t.fecha_visita || '';
      m.set(t.equipo_id, v);
    });
    return m;
  }, [s.trabajos]);

  const nombreCli = id => (s.clientes.find(c => c.id === id) || {}).nombre || '';
  const coincide = (cli, f) => !f || sinAcentos([cli.nombre, cli.ciudad, cli.provincia, cli.direccion,
    cli.telefono, cli.correo, cli.cuit_dni,
    (equiposDe.get(cli.id) || []).map(e => `${e.n_serie} ${e.modelo}`).join(' ')].join(' ')).includes(f);

  const clientes = useMemo(() => {
    const f = sinAcentos(busca);
    return s.clientes.filter(c => coincide(c, f));
  }, [s.clientes, busca, equiposDe]);

  const equipos = useMemo(() => {
    const f = sinAcentos(busca);
    return s.equipos.filter(e => !f || sinAcentos([e.n_serie, e.modelo, e.n_paradas, e.motorizacion,
      nombreCli(e.cliente_id), e.ciudad, e.provincia, e.direccion].join(' ')).includes(f));

/* ---------------------------------------------------------------------
   POSIBLES CLIENTES DUPLICADOS
   --------------------------------------------------------------------- */
const RUIDO = new Set(['SRL', 'SA', 'SAS', 'LTDA', 'COOP', 'DE', 'DEL', 'LA', 'EL', 'LOS', 'LAS',
  'Y', 'CASA', 'SR', 'SRA', 'DR', 'DRA']);
function palabrasClave(nombre) {
  return sinAcentos(nombre).toUpperCase().replace(/\(.*?\)/g, ' ')
    .replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/)
    .filter(w => w.length > 3 && !RUIDO.has(w));
}

function Duplicados({ alCerrar }) {
  const s = useS();
  const [hecho, setHecho] = useState([]);

  const pares = useMemo(() => {
    const idx = new Map();
    s.clientes.forEach(c => palabrasClave(c.nombre).forEach(w => {
      if (!idx.has(w)) idx.set(w, []);
      idx.get(w).push(c.id);
    }));
    const cuenta = new Map();
    idx.forEach(ids => {
      if (ids.length > 6) return;
      for (let i = 0; i < ids.length; i++)
        for (let j = i + 1; j < ids.length; j++) {
          const k = ids[i] < ids[j] ? `${ids[i]}|${ids[j]}` : `${ids[j]}|${ids[i]}`;
          cuenta.set(k, (cuenta.get(k) || 0) + 1);
        }
    });
    const byId = new Map(s.clientes.map(c => [c.id, c]));
    return [...cuenta.entries()]
      .filter(([, n]) => n >= 2)
      .map(([k, n]) => {
        const [a, b] = k.split('|').map(Number);
        return { a: byId.get(a), b: byId.get(b), n };
      })
      .filter(p => p.a && p.b && !hecho.includes(p.a.id) && !hecho.includes(p.b.id))
      .sort((x, y) => y.n - x.n);
  }, [s.clientes, hecho]);

  const cuenta = id => s.trabajos.filter(t => t.cliente_id === id).length;
  const equipos = id => s.equipos.filter(e => e.cliente_id === id).map(e => e.n_serie).join(' / ');

  async function unificar(quedar, absorber) {
    const db = cliente();
    try {
      const r1 = await db.from('trabajos').update({ cliente_id: quedar.id }).eq('cliente_id', absorber.id);
      if (r1.error) throw r1.error;
      const r2 = await db.from('equipos').update({ cliente_id: quedar.id }).eq('cliente_id', absorber.id);
      if (r2.error) throw r2.error;
      const r3 = await db.from('clientes').delete().eq('id', absorber.id);
      if (r3.error) throw r3.error;
      setHecho(h => [...h, absorber.id]);
      set({
        clientes: S.clientes.filter(c => c.id !== absorber.id),
        equipos: S.equipos.map(e => e.cliente_id === absorber.id ? { ...e, cliente_id: quedar.id } : e),
        trabajos: S.trabajos.map(t => t.cliente_id === absorber.id
          ? { ...t, cliente_id: quedar.id, cliente_nombre: quedar.nombre } : t),
      });
      toast(`Unificados en “${quedar.nombre}”`, 'ok');
    } catch (e) {
      toast('No se pudo unificar: ' + (e.message || e), 'error');
    }
  }

  return html`<${Modal} titulo="Posibles clientes duplicados" alCerrar=${alCerrar} ancho=${900}>
    <p class="mini">Pares que comparten al menos dos palabras del nombre. Revisá cada uno: si son el mismo
      cliente, elegí cuál queda y el otro se absorbe (sus trabajos y equipos pasan al que queda).
      Si son distintos, dejalos como están.</p>
    ${!pares.length && html`<div class="vacio">No quedan pares para revisar.</div>`}
    ${pares.slice(0, 40).map(p => html`<div key=${p.a.id + '-' + p.b.id}
        style="border:1px solid var(--borde);border-radius:8px;padding:10px;margin-bottom:8px">
      <div class="rejilla dos">
        ${[p.a, p.b].map(c => html`<div key=${c.id}>
          <b>${c.nombre}</b>
          <div class="mini">${c.ciudad || '—'}${c.provincia ? ', ' + c.provincia : ''}
            ${c.direccion ? ' · ' + c.direccion : ''}</div>
          <div class="mini">${cuenta(c.id)} trabajos · equipos: ${equipos(c.id) || '—'}
            ${c.cuit_dni ? ' · CUIT ' + c.cuit_dni : ''}</div>
        </div>`)}
      </div>
      <div class="fila" style="justify-content:flex-end;margin-top:8px">
        <button class="btn sec chico" onClick=${() => unificar(p.a, p.b)}>Dejar “${p.a.nombre.slice(0, 28)}”</button>
        <button class="btn sec chico" onClick=${() => unificar(p.b, p.a)}>Dejar “${p.b.nombre.slice(0, 28)}”</button>
        <button class="btn sec chico" onClick=${() => setHecho(h => [...h, p.a.id, p.b.id])}>Son distintos</button>
      </div>
    </div>`)}
  <//>`;
}
