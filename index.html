/* =====================================================================
   PALETA
   Todo el color vive acá arriba, en dos juegos: claro y oscuro. Ningún
   otro lado del archivo escribe un color a mano, así el modo oscuro sale
   completo y no queda ningún recuadro blanco perdido.
   ===================================================================== */
:root{
  color-scheme:light;
  /* Marca ENSA: negro tipográfico sobre blanco, con grises fríos de apoyo */
  --negro:#090f13; --barra:#090f13; --barra-texto:#b9c4ce; --barra-linea:#33404b;
  --azul:#0d151b; --azul-osc:#2a3742; --azul-claro:#eceff2; --azul-claro-txt:#0d151b;
  --grafito:#39485a; --acento:#1b3348;
  /* superficies */
  --fondo:#eef1f5;        /* el fondo de toda la aplicación */
  --papel:#ffffff;        /* paneles, fichas, ventanas */
  --franja:#f7fafc;       /* la fila par de la planilla */
  --gris:#f4f6f8;         /* fondos suaves: pie de ficha, botones */
  --borde:#d8dee6; --borde-suave:#e9edf2;
  --texto:#1c2530; --suave:#67727f;
  --campo:#ffffff;        /* fondo de los cuadros de texto */
  --th:#eaeff4; --th-txt:#425263; --th-hover:#dfe6ee;
  --hover:#e6edf5;        /* la fila bajo el mouse */
  --ok:#0f8a4d; --alerta:#c8811a; --error:#c0392b; --violeta:#6b4fa0;
  /* etiquetas de estado */
  --et-gris:#e9edf1;   --et-gris-t:#4a5661;
  --et-verde:#e2f4e9;  --et-verde-t:#0f8a4d;
  --et-ambar:#fdf0dc;  --et-ambar-t:#a9690e;
  --et-rojo:#fbe6e3;   --et-rojo-t:#c0392b;
  --et-azul:#e4eaf1;   --et-azul-t:#2a3742;
  --et-violeta:#efe9f8; --et-violeta-t:#6b4fa0;
  /* filas marcadas de la planilla */
  --fila-hacer:#fdf6c8;    --fila-hacer-h:#f8eda6;  --fila-hacer-b:#d9a404;
  --fila-nueva:#fde5e2;    --fila-nueva-h:#f9d4cf;
  --fila-cola:#fffaea;     --fila-cola-b:#f59e0b;
  --fila-cobrar:#fdfcf7;   --fila-cobrar-h:#f7f2e3;
  --fila-brillo:#fde68a;
  --sombra:0 1px 3px rgba(16,32,48,.10), 0 6px 20px rgba(16,32,48,.06);
  --radio:8px; --alto-barra:52px;
  /* ---- mate funcional (flat / material) ----
     Colores planos y sin degradé; el relieve se usa sólo donde separa un
     bloque de otro (paneles y ventanas sobre el fondo de la pantalla), no
     en cada control. --sombra-chica es la elevación mínima de un botón:
     una sola sombra suave hacia abajo, sin par de luz/sombra. */
  --sombra-chica:0 1px 2px rgba(16,32,48,.18);
  --sombra-chica-hover:0 2px 5px rgba(16,32,48,.22);

  /* --- colores de los gráficos del tablero ---
     Los cinco tonos están validados: se distinguen entre sí también para
     alguien que no ve bien los colores. Se usan SIEMPRE en este orden, nunca
     salteados ni inventando uno nuevo para una serie de más. */
  --sv-1:#6ba3dd;  /* azul     */
  --sv-2:#ef8b5c;  /* naranja  */
  --sv-3:#45bf9a;  /* verde    */
  --sv-4:#d7a831;  /* amarillo */
  --sv-5:#dd93b8;  /* rosa     */
  /* los fondos pastel con los que se separan los sectores del tablero */
  --pastel-1:#eff5fc; --pastel-2:#fdf1eb; --pastel-3:#ecf8f4;
  --pastel-4:#fbf4e3; --pastel-5:#fbeff5;
  /* escala de un solo tono, de claro a oscuro, para el mapa de calor */
  --esc-0:#f2f6fb; --esc-1:#dbe8f6; --esc-2:#bcd5ee; --esc-3:#94bde4;
  --esc-4:#6ba3dd; --esc-5:#4382c1;
  --reja:#e6ebf1;          /* las líneas de fondo de los gráficos */
}

/* --------- modo oscuro: mismos tonos, dados vuelta --------- */
html[data-tema="oscuro"]{
  color-scheme:dark;
  --barra:#0b1218; --barra-texto:#9aa7b4; --barra-linea:#2b3742;
  --azul:#3d5670; --azul-osc:#4d6a86; --azul-claro:#26313d; --azul-claro-txt:#cfe0ef;
  --grafito:#7f93a8; --acento:#9dc4e4;
  --fondo:#11161c;
  --papel:#181e25;
  --franja:#1c232b;
  --gris:#212932;
  --borde:#303a45; --borde-suave:#252d36;
  --texto:#dde5ed; --suave:#96a3b1;
  --campo:#131920;
  --th:#212a33; --th-txt:#a9b6c3; --th-hover:#2b353f;
  --hover:#27323d;
  --ok:#3fbb7d; --alerta:#e0a33f; --error:#ef6a5a; --violeta:#a58fd8;
  --et-gris:#2a333d;   --et-gris-t:#b6c2ce;
  --et-verde:#173428;  --et-verde-t:#54cc92;
  --et-ambar:#3a2f14;  --et-ambar-t:#e5b45c;
  --et-rojo:#3d211d;   --et-rojo-t:#f0806f;
  --et-azul:#26313d;   --et-azul-t:#a9c4dd;
  --et-violeta:#2d2740; --et-violeta-t:#b39ae0;
  --fila-hacer:#3a3113;    --fila-hacer-h:#473c19;  --fila-hacer-b:#d3a017;
  --fila-nueva:#3b201d;    --fila-nueva-h:#4a2925;
  --fila-cola:#332a12;     --fila-cola-b:#d99a12;
  --fila-cobrar:#1d1a15;   --fila-cobrar-h:#26221a;
  --fila-brillo:#5c4a15;
  --sombra:0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  --sombra-chica:0 1px 2px rgba(0,0,0,.45);
  --sombra-chica-hover:0 2px 6px rgba(0,0,0,.5);
  /* los mismos cinco tonos, re-elegidos para el fondo oscuro (no es un
     aclarado automático: cada uno se volvió a validar contra este fondo) */
  --sv-1:#3d86c9; --sv-2:#c9603a; --sv-3:#2a9a72; --sv-4:#a67d1c; --sv-5:#b56b95;
  --pastel-1:#1a2530; --pastel-2:#2a2019; --pastel-3:#16281f;
  --pastel-4:#282213; --pastel-5:#281d24;
  --esc-0:#1b222b; --esc-1:#22303f; --esc-2:#2b4359; --esc-3:#345774;
  --esc-4:#3d86c9; --esc-5:#6ba3dd;
  --reja:#2a333d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.45 "Segoe UI",Roboto,system-ui,-apple-system,sans-serif;color:var(--texto);background:var(--fondo)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acento)}
.oculto{display:none!important}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.barra{height:var(--alto-barra);background:var(--barra);color:#fff;display:flex;align-items:center;
  gap:6px;padding:0 14px;flex:0 0 auto;box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
.barra .marca{display:flex;align-items:center;gap:11px;margin-right:16px;white-space:nowrap}
.barra .marca img{height:21px;width:auto;display:block}
.barra .marca span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--barra-texto);
  border-left:1px solid var(--barra-linea);padding-left:11px;line-height:1.25}
.tab{background:transparent;border:0;color:var(--barra-texto);padding:8px 13px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.12);color:#fff}
.tab.on{background:var(--papel);color:var(--texto);font-weight:600}
.barra .der{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px}
.chip-user{background:rgba(255,255,255,.15);padding:5px 10px;border-radius:20px;cursor:pointer}
/* botón de modo claro / oscuro */
.btn-tema{background:rgba(255,255,255,.12);border:0;color:var(--barra-texto);cursor:pointer;
  border-radius:20px;padding:5px 11px;display:flex;align-items:center;gap:6px;font-size:12px;line-height:1}
.btn-tema:hover{background:rgba(255,255,255,.22);color:#fff}
.btn-tema span[aria-hidden]{font-size:13px}
@media (max-width:1100px){.btn-tema .rot-tema{display:none}}
.contenido{flex:1;overflow:auto;padding:12px}

/* ---------- controles ---------- */
/* Botones: color plano y sin degradé, con la elevación mínima de Material
   (una sola sombra suave hacia abajo, no un par de luz y sombra). Al pasar
   el mouse sube un poco de nivel; al hacer clic se aplana del todo, como
   un botón que se asienta contra la superficie. */
.btn{background:var(--azul);color:#fff;border:0;border-radius:8px;padding:7px 13px;cursor:pointer;
  font-weight:500;box-shadow:var(--sombra-chica);transition:background .1s,box-shadow .1s}
.btn:hover{background:var(--azul-osc);box-shadow:var(--sombra-chica-hover)}
.btn:active:not(:disabled){box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.sec{background:var(--papel);color:var(--texto);border:1px solid var(--borde)}
.btn.sec:hover{background:var(--gris)}
.btn.peligro{background:var(--error)}
.btn.chico{padding:4px 9px;font-size:12px}
/* Campos de carga: planos, sin relieve. El límite lo marca sólo el borde;
   el foco (acento) es la única señal de profundidad que necesitan. */
input,select,textarea{border:1px solid var(--borde);border-radius:8px;padding:6px 8px;background:var(--campo);
  width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acento);outline-offset:-1px;border-color:var(--acento)}
textarea{resize:vertical;min-height:60px}
label.campo{display:block;margin-bottom:9px}
label.campo>span{display:block;font-size:11px;color:var(--suave);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crece{flex:1;min-width:0}

/* ---------- tarjetas ---------- */
/* El panel es la única superficie con elevación real: color plano, borde
   nítido y una sola sombra suave hacia abajo (estilo Material), que es lo
   que separa la tarjeta del fondo de la pantalla. Los controles de adentro
   (botones, campos) no repiten el efecto: la elevación se usa una sola vez
   por bloque, no en cada elemento. */
.panel{background:var(--papel);border:1px solid var(--borde);border-radius:var(--radio);
  box-shadow:var(--sombra);
  min-width:0}                       /* sin esto, una tabla ancha desborda su columna */
/* Panel en rejilla: la tabla de adentro se desplaza sola en vez de pisar al vecino */
.rejilla-paneles{display:grid;gap:10px;align-items:start;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.rejilla-paneles > .panel{min-width:0;overflow:hidden}
.rejilla-paneles .panel-cuerpo{overflow-x:auto}
.rejilla-paneles .panel-cab{flex-wrap:wrap}
.rejilla-paneles table{min-width:100%}
.panel-cab{padding:9px 12px;border-bottom:1px solid var(--borde);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-cab h2{margin:0;font-size:14px;font-weight:600}
.panel-cab select,.panel-cab input:not([type=checkbox]){width:auto;min-width:120px;max-width:260px}
.panel-cab .buscador,.panel-cab .buscador input{width:100%;max-width:none}
.panel-cuerpo{padding:12px}

/* ---------- grilla tipo planilla ---------- */
.deslizador{position:sticky;bottom:0;z-index:6;display:flex;gap:5px;align-items:center;
  justify-content:flex-end;padding:6px 10px;background:linear-gradient(transparent,var(--papel) 40%);
  border-top:1px solid var(--borde);border-radius:0 0 var(--radio) var(--radio)}
.deslizador .mini{color:var(--suave);margin:0 2px}
.deslizador .btn{min-width:30px;font-size:13px;line-height:1}
.tabla-caja{overflow:auto;max-height:calc(100vh - var(--alto-barra) - 132px);border-radius:var(--radio)}
/* ---- barra de desplazamiento siempre visible ----
   En Windows y buena parte de Linux la barra ya se ve fija; en Mac (y en
   cualquier sistema con "barras superpuestas") el navegador la esconde
   apenas se deja de tocar el trackpad. En una planilla ancha -- donde
   columnas enteras como Precio, Facturación o Cobrado sólo aparecen
   corriendo la vista para el costado -- eso hace que nadie note que hay
   más para el costado. Estas reglas reemplazan la barra del sistema por
   una propia: angosta, del mismo juego de colores que el resto de la
   aplicación, y siempre dibujada en vez de aparecer sólo al tocarla.
   Se aplica en todos los lugares que se desplazan de costado: la planilla
   del Registro de Service, Cobranza, Repuestos, Productividad, Admin,
   historial e informe de gira. */
.tabla-caja,.rejilla-paneles .panel-cuerpo,.panel-cuerpo.despl-h{
  scrollbar-width:auto;scrollbar-color:var(--suave) var(--gris);
}
.tabla-caja::-webkit-scrollbar,
.rejilla-paneles .panel-cuerpo::-webkit-scrollbar,
.panel-cuerpo.despl-h::-webkit-scrollbar{height:12px;width:12px}
.tabla-caja::-webkit-scrollbar-track,
.rejilla-paneles .panel-cuerpo::-webkit-scrollbar-track,
.panel-cuerpo.despl-h::-webkit-scrollbar-track{background:var(--gris)}
.tabla-caja::-webkit-scrollbar-thumb,
.rejilla-paneles .panel-cuerpo::-webkit-scrollbar-thumb,
.panel-cuerpo.despl-h::-webkit-scrollbar-thumb{
  background:var(--suave);border-radius:20px;border:3px solid var(--gris)}
.tabla-caja::-webkit-scrollbar-thumb:hover,
.rejilla-paneles .panel-cuerpo::-webkit-scrollbar-thumb:hover,
.panel-cuerpo.despl-h::-webkit-scrollbar-thumb:hover{background:var(--grafito)}
.tabla-caja::-webkit-scrollbar-corner,
.panel-cuerpo.despl-h::-webkit-scrollbar-corner{background:var(--gris)}
table.grilla{border-collapse:separate;border-spacing:0;width:100%;background:var(--papel);font-size:12px}
table.grilla th{position:sticky;top:0;z-index:3;background:var(--th);border-bottom:2px solid var(--borde);
  padding:7px 8px;text-align:left;font-weight:600;white-space:nowrap;cursor:pointer;font-size:11px;
  text-transform:uppercase;letter-spacing:.3px;color:var(--th-txt)}
table.grilla th:hover{background:var(--th-hover)}
table.grilla thead tr:first-child th[colspan]{text-align:center;border-bottom:1px solid var(--borde)}
table.grilla td{border-bottom:1px solid var(--borde-suave);border-right:1px solid var(--borde-suave);
  padding:5px 8px;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
table.grilla tbody tr:nth-child(even){background:var(--franja)}
table.grilla tbody tr:hover,table.grilla tbody tr:nth-child(even):hover{background:var(--hover);cursor:pointer}
table.grilla tbody tr.sel{background:var(--azul-claro)}
/* fila hija: el equipo colgando de su cliente */
table.grilla tbody tr.hija,table.grilla tbody tr.hija:nth-child(even){background:var(--franja)}
table.grilla tbody tr.hija:hover{background:var(--hover)}
table.grilla tbody tr.hija td{border-bottom:1px dashed var(--borde);color:var(--suave)}
table.grilla td.num{text-align:right;font-variant-numeric:tabular-nums}
.congelada{position:sticky;left:0;background:var(--papel);z-index:2;border-right:1px solid var(--borde);min-width:0}
tbody tr:nth-child(even) .congelada{background:var(--franja)}
tr:hover .congelada,tbody tr:nth-child(even):hover .congelada{background:var(--hover)}
th.congelada{z-index:4;background:var(--th)}

/* =====================================================================
   PLANILLA DEL REGISTRO DE SERVICE
   Es la pantalla donde más rato se pasa, así que se lee distinto al
   resto: filas más altas y separadas, el texto largo en dos renglones en
   vez de cortado, y rayas verticales sólo entre bloques (quién, dónde,
   en qué estado, qué se hizo) en vez de una por columna.
   Los anchos van en clamp(mínimo, proporción de pantalla, máximo): así
   todo el bloque hasta TÉCNICO entra sin correr la planilla de costado,
   tanto en una notebook como en un monitor grande.
   ===================================================================== */
/* Con table-layout:fixed los anchos de más abajo se respetan tal cual, sin que
   el texto de adentro los estire. Si entre todas las columnas se pasan del
   ancho de la caja, la tabla crece y se desplaza sólo lo que sobra: el bloque
   hasta TÉCNICO queda siempre a la vista. */
table.grilla.registro{table-layout:fixed;width:100%;
  /* el aire entre una tarjeta y la siguiente */
  border-spacing:0 7px;background:var(--fondo)}
table.grilla.registro th,table.grilla.registro td{white-space:normal;max-width:none;
  vertical-align:top;border-right:0}

/* ---- cada registro es una tarjeta ----
   Antes eran renglones pegados uno abajo del otro y había que seguirlos con
   el dedo. Ahora cada trabajo es una tarjeta suelta: fondo propio, esquinas
   redondeadas, aire alrededor y un canto de color a la izquierda que dice
   en qué anda ese trabajo sin necesidad de leerlo. Lo que separa un
   registro del que sigue ya no es una raya fina: es el espacio. */
table.grilla.registro tbody tr,
table.grilla.registro tbody tr:nth-child(even){background:var(--papel)}
table.grilla.registro tbody td{border-top:1px solid var(--borde);
  border-bottom:1px solid var(--borde)}
table.grilla.registro tbody tr td:first-child{border-left:4px solid var(--canto,var(--borde));
  border-radius:9px 0 0 9px}
table.grilla.registro tbody tr td:last-child{border-right:1px solid var(--borde);
  border-radius:0 9px 9px 0}
/* el canto de color según en qué anda el trabajo */
table.grilla.registro tbody tr.tono-listo  {--canto:var(--ok)}
table.grilla.registro tbody tr.tono-abierto{--canto:var(--error)}
/* cerrado, pero con un pago viejo pendiente: ni "hecho" (verde) ni "urgente
   por cerrar" (rojo) -- un tercer color, más discreto, para no confundirlo
   con el trabajo que sí necesita atención hoy */
table.grilla.registro tbody tr.tono-pendiente-cobranza{--canto:var(--alerta)}
table.grilla.registro tbody tr.tono-hacer  {--canto:var(--fila-hacer-b)}
table.grilla.registro tbody tr.tono-mirar  {--canto:var(--violeta)}
table.grilla.registro tbody tr.tono-gris   {--canto:var(--borde)}
/* al pasar el mouse la tarjeta se levanta apenas, en vez de cambiar de color */
table.grilla.registro tbody tr:hover td{border-top-color:var(--grafito);
  border-bottom-color:var(--grafito)}
table.grilla.registro tbody tr:hover td:last-child{border-right-color:var(--grafito)}
/* la cabecera tapa el hueco que deja el aire entre tarjetas: si no, se ven
   pasar los registros por la rendija al hacer rodar la planilla */
table.grilla.registro thead th{box-shadow:0 7px 0 0 var(--fondo)}
/* los títulos también entran en dos renglones: así no hacen falta columnas
   anchas sólo para que quepa el título */
table.grilla.registro th{padding:7px 10px;line-height:1.2;white-space:normal;overflow:hidden}
table.grilla.registro td{padding:9px 10px;line-height:1.34}
/* el texto largo ocupa hasta dos renglones y ahí sí se corta; las palabras no
   se parten al medio salvo que una sola palabra no entre en el renglón */
table.grilla.registro td .rec{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;overflow-wrap:break-word;word-break:normal;hyphens:none}
/* las etiquetas de estado, un punto más chicas: así "PROGRAMADO" entra entero */
table.grilla.registro .et{font-size:10px;padding:2px 7px;letter-spacing:.2px;
  box-shadow:inset 0 0 0 1px color-mix(in srgb, currentColor 22%, transparent)}
/* rayas verticales sólo entre bloques */
table.grilla.registro th.corte,table.grilla.registro td.corte{border-left:1px solid var(--borde)}
/* jerarquía: lo principal en oscuro, el dato de apoyo en gris */
table.grilla.registro td.apoyo{color:var(--suave)}
/* columnas cortas: nunca se parten en dos renglones */
table.grilla.registro td.corta,table.grilla.registro th.corta{white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
table.grilla.registro td.pedido{font-weight:600}
table.grilla.registro td.cliente{font-weight:600}
table.grilla.registro td.fecha{font-variant-numeric:tabular-nums;white-space:nowrap}
/* La marca de color va en el borde de la tarjeta, así que las rayitas
   internas que usaba la planilla vieja acá sobran y se apagan (el
   !important es porque alguna de ellas ya venía con uno). */
table.grilla.registro tbody td.congelada{box-shadow:none!important}
/* El corte entre una semana y la siguiente: un renglón de aire, sin rótulo.
   Es una fila vacía —no un relleno dentro de la tarjeta— para que el hueco
   quede entre las dos y no adentro de una. */
table.grilla.registro tbody tr.aire-semana,
table.grilla.registro tbody tr.aire-semana:nth-child(even){background:transparent}
table.grilla.registro tbody tr.aire-semana td,
table.grilla.registro tbody tr.aire-semana td:first-child{height:15px;padding:0;
  border:0;border-radius:0;background:transparent}
table.grilla.registro tbody tr{transition:border-color .08s}

/* anchos de cada columna (hasta TÉCNICO: entran en pantalla) */
table.grilla.registro th.c-ll     {width:clamp(74px,5.70vw,92px)}
table.grilla.registro th.c-pedido {width:clamp(100px,8.10vw,130px)}
table.grilla.registro th.c-serie  {width:clamp(58px,4.50vw,76px)}
table.grilla.registro th.c-modelo {width:clamp(48px,3.75vw,66px)}
table.grilla.registro th.c-inst   {width:clamp(66px,5.10vw,84px)}
table.grilla.registro th.c-cliente{width:clamp(94px,8.00vw,190px)}
table.grilla.registro th.c-dir    {width:clamp(84px,6.60vw,160px)}
table.grilla.registro th.c-ciudad {width:clamp(92px,7.50vw,160px)}
table.grilla.registro th.c-serv   {width:clamp(96px,8.00vw,124px)}
table.grilla.registro th.c-prior  {width:clamp(65px,5.00vw,84px)}
table.grilla.registro th.c-estado {width:clamp(104px,9.10vw,132px)}
table.grilla.registro th.c-cierre {width:clamp(83px,6.45vw,100px)}
table.grilla.registro th.c-fecha  {width:clamp(68px,5.30vw,86px)}
table.grilla.registro th.c-horas  {width:clamp(52px,4.00vw,74px)}
table.grilla.registro th.c-obs    {width:clamp(140px,10.60vw,300px)}
table.grilla.registro th.c-tec    {width:clamp(86px,6.80vw,150px)}
/* de acá en adelante ya se desplaza: no compiten por el ancho de pantalla */
table.grilla.registro th.c-precio {width:104px}
table.grilla.registro th.c-fact   {width:106px}
table.grilla.registro th.c-cob    {width:110px}
table.grilla.registro th.c-coment {width:240px}
table.grilla.registro th.c-borrar {width:40px}

/* En pantallas chicas (notebooks de 1280 y 1366) la planilla baja medio punto
   de letra: con eso el bloque hasta TÉCNICO entra cómodo y sin cortar
   palabras. En monitores grandes queda al tamaño normal. */
@media (max-width:1400px){
  table.grilla.registro{font-size:11.5px}
  table.grilla.registro .et{font-size:9.5px;padding:2px 6px}
}
/* celdas que sólo llevan una etiqueta: se recortan sin puntos suspensivos */
table.grilla.registro td.etq{white-space:nowrap;overflow:hidden;text-overflow:clip}

/* ---------- etiquetas de estado ---------- */
.et{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.et.gris{background:var(--et-gris);color:var(--et-gris-t)}
.et.verde{background:var(--et-verde);color:var(--et-verde-t)}
.et.ambar{background:var(--et-ambar);color:var(--et-ambar-t)}
.et.rojo{background:var(--et-rojo);color:var(--et-rojo-t)}
.et.azul{background:var(--et-azul);color:var(--et-azul-t)}
.et.violeta{background:var(--et-violeta);color:var(--et-violeta-t)}
/* trabajo cumplido pero abierto administrativamente: tiene que saltar a la vista */
.et.alarma{background:var(--error);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb, var(--error) 22%, transparent)}
/* Cumplido pero con el circuito de cobranza sin terminar (falta facturar,
   cobrar o cerrar): un tinte apenas insinuado -- casi blanco -- y no un
   color fuerte, porque esto es una cuestión administrativa, no un trabajo
   pendiente. El canto rojo de la fila (tono-abierto) y el rayado ámbar de
   la columna congelada ya avisan que falta cerrarlo; el fondo casi blanco
   deja "por hacer" (abajo) como el único que salta a la vista con un color
   fuerte, así no se confunden "todavía no se hizo" con "se hizo, falta
   cobrar". */
tr.sin-cerrar td{background:var(--fila-cobrar)}
tr.sin-cerrar:hover td{background:var(--fila-cobrar-h)}
tr.sin-cerrar td.congelada{box-shadow:inset 3px 0 0 var(--sv-4)!important}
/* el texto de toda la línea en rojo: más específico que .apoyo (dato de
   apoyo, en gris) para que también se pinte, y así no quede ningún dato
   de la fila sin la señal de "abierto". Las etiquetas (.et) no se tocan:
   ya tienen su propio color y el navegador respeta el que está puesto
   directamente sobre ellas antes que el heredado del renglón. */
table.grilla.registro tbody tr.sin-cerrar td{color:var(--error)}
/* Trabajo todavía por hacer: amarillo pastel en toda la línea */
tr.por-hacer td{background:var(--fila-hacer)}
tr.por-hacer:hover td{background:var(--fila-hacer-h)}
tr.por-hacer td.congelada{box-shadow:inset 3px 0 0 var(--fila-hacer-b)}
/* Equipo instalado hace menos de un mes: rojo, casi siempre es garantía */
tr.recien-instalado td{background:var(--fila-nueva)}
tr.recien-instalado:hover td{background:var(--fila-nueva-h)}
tr.recien-instalado td.congelada{box-shadow:inset 3px 0 0 var(--error)}
tr.recien-instalado td.marca-inst{color:var(--error);font-weight:700}
/* Registro de Service: en vez de pintar toda la fila, un aviso chico y en
   rojo debajo de la fecha, igual de imposible de pasar por alto que
   "⚠ ABIERTO" pero sin ocupar toda la línea. */
.marca-recien{display:inline-block;margin-top:3px;padding:1px 6px;border-radius:10px;
  background:var(--error);color:#fff;font-size:9px;font-weight:700;line-height:1.25;
  white-space:normal;max-width:80px;text-align:center}
/* fila recién cargada: se ilumina unos segundos para que salte a la vista */
@keyframes aparece{0%{background:var(--fila-brillo)}100%{background:transparent}}
tr.recien td{animation:aparece 6s ease-out 1}
tr.recien td.congelada{box-shadow:inset 3px 0 0 var(--fila-hacer-b)}
/* fila guardada sin internet, todavía sin subir */
tr.en-cola td{background:var(--fila-cola)}
tr.en-cola td.congelada{box-shadow:inset 3px 0 0 var(--fila-cola-b)}
/* Cobranza: el caso al que se llegó desde "Abrir este trabajo en Cobranza →"
   (Registro de Service). A diferencia de "recien", NO se apaga solo: queda
   marcado hasta que se cambia de vista o de búsqueda, porque la idea es
   encontrarlo fácil entre el resto, no sólo darle un destello. */
tr.desde-service td{background:var(--fila-nueva)}
tr.desde-service td.congelada{box-shadow:inset 4px 0 0 var(--violeta)!important}
.btn.alerta{background:var(--error)}
.btn.alerta:hover{background:#a5322a}

/* ---------- ficha lateral ---------- */
.fondo{position:fixed;inset:0;background:rgba(16,32,48,.35);z-index:50;display:flex;justify-content:flex-end}
.ficha{width:min(760px,96vw);background:var(--papel);height:100%;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.2);animation:entra .18s ease}
@keyframes entra{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.ficha-cab{padding:12px 16px;border-bottom:1px solid var(--borde);display:flex;align-items:center;gap:10px}
.ficha-cab h2{margin:0;font-size:16px}
.ficha-cuerpo{flex:1;overflow:auto;padding:14px 16px}
.ficha-pie{padding:10px 16px;border-top:1px solid var(--borde);display:flex;gap:8px;align-items:center;background:var(--gris)}
/* Si el hosting pone un distintivo flotante abajo a la derecha (por ejemplo el
   "Powered by Netlify"), los botones de la ficha y los avisos se corren para
   arriba: si no, el cartel tapa el botón Guardar. */
body.esquina-ocupada .ficha-pie{padding-bottom:56px}
body.esquina-ocupada .toast-caja{bottom:58px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.rejilla.dos{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
fieldset{border:1px solid var(--borde);border-radius:var(--radio);padding:10px 12px;margin:0 0 12px}
legend{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--acento);font-weight:700;padding:0 5px}
.modal{position:fixed;inset:0;background:rgba(16,32,48,.4);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
/* La ventana modal flota sobre un fondo oscurecido, no sobre la pantalla:
   ahí el relieve mate no tiene sentido (la luz y la sombra se calculan
   contra el fondo de la app, no contra ese velo). Sigue con una sombra
   de flotación común, como cualquier ventana que se superpone. */
.modal .caja{background:var(--papel);border-radius:var(--radio);max-width:520px;width:100%;box-shadow:var(--sombra);max-height:90vh;overflow:auto}

/* ---------- tablero ---------- */
/* Cada sector con su fondo pastel: el color no dice nada del dato, sólo
   separa un tema del otro para que la vista sepa dónde está parada. */
.tablero{display:flex;flex-direction:column;gap:12px}
.sector{border-radius:12px;padding:12px 13px 14px;border:1px solid var(--borde)}
.sector.s1{background:var(--pastel-1)} .sector.s2{background:var(--pastel-2)}
.sector.s3{background:var(--pastel-3)} .sector.s4{background:var(--pastel-4)}
.sector.s5{background:var(--pastel-5)}
.rot-sector{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--suave);font-weight:600}
.rejilla-graficos{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  align-items:start;margin-bottom:10px}
.sector .panel{margin-bottom:0}
.sector .grafico + .grafico,.sector .rejilla-graficos + .grafico{margin-top:10px}

/* tarjetas de dato suelto */
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px;margin-bottom:10px}
.tarjeta{background:var(--papel);border:1px solid var(--borde);border-radius:10px;
  padding:11px 13px 9px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.tarjeta:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--linea)}
.tarjeta .rot{font-size:10.5px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
.tarjeta .val{font-size:24px;font-weight:700;margin-top:2px;line-height:1.15}
.tarjeta .sub{font-size:11px;color:var(--suave);margin-top:1px}
.tarjeta .chispa{display:block;width:100%;height:26px;margin-top:6px;overflow:visible}

/* la foto de arriba de Cobranza: en qué anda cada caso */
.situacion .apilada{height:30px}
.casos{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:9px;margin-top:12px}
.caso{border:1px solid var(--borde);border-radius:10px;padding:9px 11px 8px;
  position:relative;overflow:hidden;background:var(--papel)}
.caso:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tono-caso)}
.caso .rot{font-size:10.5px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
.caso .val{font-size:22px;font-weight:700;line-height:1.15;margin-top:1px}
.caso .mini{line-height:1.3}
.caso.c-azul  {--tono-caso:var(--sv-1);background:var(--pastel-1)}
.caso.c-ambar {--tono-caso:var(--sv-4);background:var(--pastel-4)}
.caso.c-rojo  {--tono-caso:var(--sv-2);background:var(--pastel-2)}
.caso.c-verde {--tono-caso:var(--sv-3);background:var(--pastel-3)}
.caso.c-gris  {--tono-caso:var(--suave);background:var(--gris)}

/* mapa de calor del país: cada provincia, un casillero en su lugar */
.mapa-ar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;
  max-width:600px;margin:0 auto}
.mapa-ar .prov{border-radius:7px;padding:6px 3px 5px;text-align:center;line-height:1.15;
  border:1px solid color-mix(in srgb, var(--texto) 10%, transparent);cursor:default;
  min-height:46px;display:flex;flex-direction:column;justify-content:center;gap:1px;
  overflow:hidden}
.mapa-ar .prov .sigla{font-size:10px;font-weight:600;opacity:.9;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapa-ar .prov .dato{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.mapa-ar .prov:hover{outline:2px solid var(--grafito);outline-offset:1px}

/* medidores: una proporción contra su total */
.medidores{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.medidor{background:var(--papel);border:1px solid var(--borde);border-radius:10px;padding:9px 12px 10px;
  box-shadow:var(--sombra);font-size:12px}
.medidor .track{display:block;background:var(--reja);border-radius:4px;height:8px;overflow:hidden;margin:5px 0 4px}
.medidor .fill{display:block;height:100%;background:var(--tono);border-radius:4px}

/* gráficos */
.svg-grafico{width:100%;height:auto;display:block;overflow:visible}
.svg-grafico .eje{font-size:10px;fill:var(--suave)}
.pie-grafico{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-top:7px;font-size:12px;flex-wrap:wrap}
.barras{display:flex;flex-direction:column;gap:7px}
.barra-item{display:grid;grid-template-columns:minmax(96px,150px) 1fr 68px;align-items:center;
  gap:9px;font-size:12px}
.barra-item .rotulo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-item .track{display:block;background:var(--reja);border-radius:4px;height:13px;overflow:hidden}
.barra-item .fill{display:block;height:100%;background:var(--tono);border-radius:4px}
.barra-item .valor{font-variant-numeric:tabular-nums;color:var(--texto)}

/* semáforo del estado del sistema */
.luces{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
.luz{border:1px solid var(--borde);border-radius:10px;padding:9px 11px 8px;
  position:relative;overflow:hidden;background:var(--papel)}
.luz:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--suave)}
.luz .rot{font-size:10.5px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
.luz .val{font-size:16px;font-weight:700;line-height:1.2;margin:1px 0 3px}
.luz .mini{line-height:1.35;white-space:normal}
.luz.bien{background:var(--pastel-3)} .luz.bien:before{background:var(--ok)}
.luz.mal {background:var(--pastel-2)} .luz.mal:before {background:var(--error)}
.luz.mal .val{color:var(--error)}
.luz.gris:before{background:var(--borde)}
.rot-bloque{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--suave);
  font-weight:600;margin:18px 0 7px}

/* lo que más se repite en el texto escrito a mano */
.barra-item.apretable{cursor:pointer;border-radius:6px;padding:2px 4px;margin:0 -4px}
.barra-item.apretable:hover{background:color-mix(in srgb, var(--texto) 6%, transparent)}
.barra-item.elegida{background:color-mix(in srgb, var(--tono) 16%, transparent)}
.barra-item.elegida .rotulo{font-weight:700}
/* un término de la lista que este año no apareció: se muestra igual, apagado */
.barra-item.en-cero{opacity:.45;cursor:default}
.barra-item.en-cero:hover{background:transparent}
.casos-texto{margin-top:12px;border-top:1px solid var(--borde);padding-top:10px}
.lista-casos{max-height:320px;overflow:auto;margin-top:8px;display:flex;
  flex-direction:column;gap:7px}
.caso-texto{border:1px solid var(--borde);border-left:3px solid var(--tono);
  border-radius:7px;padding:7px 10px;background:var(--papel);cursor:pointer}
.caso-texto:hover{background:var(--hover)}
.caso-texto .enc{font-weight:600;margin-bottom:2px}
.caso-texto .txt{font-size:12px;line-height:1.4;white-space:pre-wrap;
  overflow-wrap:break-word}

/* barra apilada: las partes de un total */
.apilada{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;background:var(--reja)}
.apilada .tramo{display:block;height:100%;transition:opacity .12s;cursor:default}
.referencia{display:flex;flex-wrap:wrap;gap:5px 16px;margin-top:9px;font-size:12px}
.referencia .ref{display:flex;align-items:center;gap:5px;cursor:default}
.referencia .punto{width:10px;height:10px;border-radius:3px;flex:0 0 auto}

/* mapa de calor */
table.calor{border-collapse:separate;border-spacing:2px;font-size:11px}
table.calor th{background:transparent;color:var(--suave);font-weight:600;font-size:10px;
  text-transform:uppercase;letter-spacing:.04em;padding:2px 4px;position:static;border:0;cursor:default}
table.calor th.rot{text-align:right;white-space:nowrap;max-width:150px;overflow:hidden;
  text-overflow:ellipsis;text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--texto)}
table.calor td{padding:0;border:0}
table.calor .celda{display:flex;align-items:center;justify-content:center;min-width:34px;height:24px;
  border-radius:4px;font-variant-numeric:tabular-nums;color:var(--texto)}
.escala{display:flex;align-items:center;gap:3px}
.escala .paso{width:16px;height:10px;border-radius:2px;display:block}

/* ---------- gira ---------- */
.gira-cols{display:grid;grid-template-columns:minmax(320px,1fr) minmax(420px,1.4fr);gap:12px;align-items:start}
.dia{border:1px solid var(--borde);border-radius:var(--radio);margin-bottom:8px;overflow:hidden}
.dia h4{margin:0;padding:6px 10px;background:var(--azul-claro);font-size:12px;color:var(--azul-claro-txt);
  display:flex;justify-content:space-between}
.dia h4 span:first-child::first-letter{text-transform:uppercase}
.parada{display:flex;gap:8px;padding:7px 10px;border-top:1px solid var(--borde-suave);align-items:flex-start}
.parada:first-child{border-top:0}
.parada .ord{width:20px;height:20px;border-radius:50%;background:var(--azul);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:2px}
.parada .info{flex:1;min-width:0}
.parada .info b{display:block}
.parada .info small{color:var(--suave);display:block;white-space:normal}
.pendientes{max-height:62vh;overflow:auto}
.pend{padding:7px 10px;border-bottom:1px solid var(--borde-suave);display:flex;gap:8px;align-items:center}
.pend:hover{background:var(--hover)}
.pend .info{flex:1;min-width:0}

/* ---------- varios ---------- */
.aviso{padding:9px 12px;border-radius:6px;margin-bottom:10px;font-size:12px;
  background:var(--azul-claro);color:var(--azul-claro-txt)}
.aviso .mini{color:inherit;opacity:.85}
.ruta{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.94em;
  background:color-mix(in srgb, var(--texto) 10%, transparent);border-radius:4px;padding:1px 4px}
.aviso.info{background:var(--azul-claro);color:var(--azul-claro-txt)}
.aviso.error{background:var(--et-rojo);color:var(--et-rojo-t)}
.aviso.ok{background:var(--et-verde);color:var(--et-verde-t)}
.aviso.alerta{background:var(--et-ambar);color:var(--et-ambar-t)}
.aviso-cierre{display:flex;gap:10px;align-items:center;background:var(--et-rojo);color:var(--et-rojo-t);
  border-left:4px solid var(--error);border-radius:0 6px 6px 0;padding:10px 12px;margin-bottom:12px}
.aviso-cierre .mini{color:var(--et-rojo-t);opacity:.85}
.vacio{padding:30px;text-align:center;color:var(--suave)}
.cargando{padding:20px;text-align:center;color:var(--suave)}
.aviso-version{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:95;
  display:flex;gap:8px;align-items:center;background:var(--barra);color:#fff;
  border:1px solid var(--barra-linea);
  padding:9px 12px 9px 16px;border-radius:26px;box-shadow:0 6px 24px rgba(0,0,0,.28);font-size:13px}
.aviso-version .btn.sec{background:transparent;color:#c9d2da;border-color:var(--barra-linea)}
.aviso-version .btn.sec:hover{background:rgba(255,255,255,.14);color:#fff}
body.esquina-ocupada .aviso-version{bottom:60px}
.toast-caja{position:fixed;right:14px;bottom:14px;z-index:90;display:flex;flex-direction:column;gap:6px;
  transition:bottom .15s}
.toast{background:var(--barra);border:1px solid var(--barra-linea);color:#fff;padding:9px 14px;border-radius:6px;box-shadow:var(--sombra);font-size:12px;max-width:340px;animation:entra .2s}
.toast.ok{background:var(--ok)} .toast.error{background:var(--error)}
.login{max-width:380px;margin:8vh auto;padding:24px;background:var(--papel);border-radius:12px;box-shadow:var(--sombra)}
.login h1{font-size:18px;margin:0 0 4px} .login p{color:var(--suave);margin:0 0 18px;font-size:12px}
.buscador{position:relative;min-width:210px}
.sugerencias{position:absolute;top:100%;left:0;right:0;background:var(--papel);border:1px solid var(--borde);
  border-radius:0 0 6px 6px;max-height:260px;overflow:auto;z-index:20;box-shadow:var(--sombra)}
.sugerencias div{padding:6px 9px;cursor:pointer;font-size:12px}
.sugerencias div:hover,.sugerencias div.act{background:var(--azul-claro)}
.linea-tiempo{border-left:2px solid var(--borde);margin-left:6px;padding-left:12px}
.linea-tiempo .ev{margin-bottom:9px;position:relative;font-size:12px}
.linea-tiempo .ev:before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--acento)}
.mini{font-size:11px;color:var(--suave)}
.der{text-align:right}

/* ---------- planilla de productividad ---------- */
.hoja-productividad{padding-top:0}
.titulo-prod{text-align:center;font-weight:700;font-size:13px;padding:10px 12px;
  border-bottom:1px solid var(--borde);background:var(--th);letter-spacing:.02em}
table.grilla.prod{font-size:11.5px}
table.grilla.prod th{white-space:normal;line-height:1.15;text-align:left;cursor:default;
  font-size:10px;vertical-align:bottom}
table.grilla.prod th.der,table.grilla.prod td.der{text-align:right}
table.grilla.prod td{white-space:normal;vertical-align:middle;padding:4px 7px;
  border-bottom:1px solid color-mix(in srgb, var(--texto) 14%, transparent)}
table.grilla.prod .et{font-size:9.5px;padding:1px 6px}
table.grilla.prod input.celda{width:104px;text-align:right;font-variant-numeric:tabular-nums;padding:3px 6px;background:transparent;
  border:1px solid transparent;border-radius:4px}
table.grilla.prod input.celda:hover{border-color:var(--borde);background:var(--campo)}
table.grilla.prod input.celda:focus{border-color:var(--acento);background:var(--campo)}
/* una celda escrita a mano se distingue de una calculada */
table.grilla.prod .volver{padding:1px 5px;font-size:11px;line-height:1.3;margin-left:3px;
  vertical-align:middle}
table.grilla.prod input.celda.amano{font-weight:700;
  box-shadow:inset 0 -2px 0 color-mix(in srgb, var(--alerta) 60%, transparent)}
/* Las dos columnas de texto se ven como una sola celda alta: sin rayas entre
   filas, con el texto en el medio. (No se usa rowspan: una celda que abarca
   todas las filas no se puede partir entre hojas al imprimir.) */
table.grilla.prod td.texto-prod{white-space:pre-wrap;font-size:10.5px;color:var(--suave);
  min-width:130px;vertical-align:middle;text-align:center;
  border-left:1px solid var(--borde);border-bottom:0;background:var(--papel)}
table.grilla.prod td.texto-prod.ultima{border-bottom:1px solid var(--borde)}
/* Ni las filas grises ni las rojas la pintan: es una columna aparte, no parte
   de la fila. Va con !important porque la marca de fila combinada (gris + roja)
   es más específica que cualquier selector razonable de esta columna. */
table.grilla.prod td.texto-prod{background:var(--papel)!important}
/* el desglose por semana, arriba de la planilla */
.semanas-prod{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 6px}
.semanas-prod .sem{border:1px solid var(--borde);border-radius:8px;padding:6px 11px;
  background:var(--franja);min-width:150px}
.semanas-prod .sem .dato{font-size:12.5px;margin:1px 0}
/* el corte entre una semana y la siguiente: un respiro, sin rótulo */
table.grilla.prod tr.nueva-semana td{border-top:2px solid var(--borde);padding-top:11px}
table.grilla.prod tfoot td{position:sticky;bottom:0;background:var(--th);
  border-top:2px solid var(--borde);padding:7px}
/* anchos: el técnico necesita lugar porque suelen ir dos nombres */
table.grilla.prod th.p-n{width:64px}
table.grilla.prod th.p-mant{width:110px}
table.grilla.prod th.p-finst{width:84px}
table.grilla.prod th.p-fecha{width:74px}
table.grilla.prod th.p-cli{width:170px}
table.grilla.prod th.p-serv{width:96px}
table.grilla.prod th.p-estado{width:84px}
table.grilla.prod th.p-tec{width:150px}
table.grilla.prod th.p-min{width:92px}
table.grilla.prod th.p-pago{width:112px}
table.grilla.prod th.p-texto{width:150px}


/* el técnico dado de baja sigue en la lista, pero apagado */
table.grilla tr.inactivo td{opacity:.5}
table.grilla tr.inactivo td:first-child{opacity:1}

/* ---------- lista de repuestos ---------- */
.tabla-repuestos .solo-papel{display:none}
tr.marcado td{background:var(--azul-claro)}
/* Columna de la encuesta: es la que se viene a marcar, así que se destaca */
table.grilla th.col-encuesta{background:var(--azul-claro);border-left:3px solid var(--grafito);color:var(--azul-claro-txt)}
table.grilla td.col-encuesta{background:var(--azul-claro);border-left:3px solid var(--grafito)}
tr.enc-si td.col-encuesta{background:var(--et-verde)}
tr.enc-si td.col-encuesta .mini{color:var(--et-verde-t);font-weight:600}
/* Corte visible entre el bloque en dólares y el bloque en pesos */
table.grilla th.inicia-pesos,table.grilla td.inicia-pesos{border-left:3px solid var(--grafito)}

/* ---- color en la lista de repuestos ----
   Son dos bloques de números que se parecen mucho: el precio en dólares y
   el mismo precio pasado a pesos. Cada bloque lleva su color —verde el de
   dólares, azul el de pesos— con una franja arriba y un fondo apenas
   teñido, para que la vista sepa siempre en cuál de los dos está. */
table.grilla.tabla-repuestos th.col-usd,
table.grilla.tabla-repuestos td.col-usd{background:var(--pastel-3)}
table.grilla.tabla-repuestos th.col-pesos,
table.grilla.tabla-repuestos td.col-pesos{background:var(--pastel-1)}
table.grilla.tabla-repuestos th.grupo{font-weight:700;letter-spacing:.02em}
table.grilla.tabla-repuestos th.col-usd.grupo{border-top:3px solid var(--sv-3)}
table.grilla.tabla-repuestos th.col-pesos.grupo{border-top:3px solid var(--sv-1)}
table.grilla.tabla-repuestos td.col-pesos{font-weight:600}
table.grilla.tabla-repuestos td.col-usd{color:color-mix(in srgb, var(--texto) 80%, transparent)}
/* la fila marcada gana una barra al costado: se ve incluso sobre los fondos */
table.grilla.tabla-repuestos tr.marcado td.congelada{box-shadow:inset 3px 0 0 var(--sv-2)}
table.grilla.tabla-repuestos tr.marcado td{background:var(--pastel-2)}
table.grilla.tabla-repuestos tr:hover td{filter:brightness(.975)}
table.grilla.tabla-repuestos td.col-nota .et{white-space:normal;text-align:left}
/* el precio se toca y se escribe ahí mismo: es lo que más se hace acá */
table.grilla.tabla-repuestos td.col-usd.tocable{cursor:text}
table.grilla.tabla-repuestos td.col-usd.tocable:hover{
  box-shadow:inset 0 0 0 1px var(--acento);border-radius:5px}
table.grilla.tabla-repuestos td.col-usd.tocable:focus-visible{
  outline:2px solid var(--acento);outline-offset:-2px}
table.grilla.tabla-repuestos td.col-usd .poner{color:var(--suave);opacity:.55;font-weight:700}
table.grilla.tabla-repuestos td.col-usd.editando{padding:2px 4px}
table.grilla.tabla-repuestos td.col-usd.editando input{
  width:100%;text-align:right;padding:3px 6px;font-variant-numeric:tabular-nums}
.aclaracion{border:1.5px solid var(--texto);border-radius:6px;padding:10px 12px;margin-top:12px;
  font-size:11.5px;line-height:1.4}
.aclaracion > b:first-child{display:block;margin-bottom:4px;text-transform:uppercase;
  letter-spacing:.04em;font-size:11px}
.aclaracion p{margin:0 0 6px}
.aclaracion p:last-child{margin-bottom:0}

/* ---------- planilla de trabajos para el técnico ---------- */
.encabezado-hoja{display:flex;justify-content:space-between;align-items:flex-end;
  gap:14px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--texto)}
.encabezado-hoja .logo-hoja{height:26px;width:auto;display:block;margin-bottom:7px}
.titulo-hoja{font-size:16px;font-weight:700}
.titulo-dia{font-size:12px;font-weight:700;color:var(--acento);text-transform:uppercase;
  letter-spacing:.4px;margin:0 0 4px}
.titulo-dia::first-letter{text-transform:uppercase}
table.planilla{font-size:12px;
  font-family:"Arial Narrow","Liberation Sans Narrow","Roboto Condensed","DejaVu Sans Condensed",
    "Segoe UI",Roboto,sans-serif;
  font-stretch:condensed}
table.planilla th{font-size:10px;padding:5px 5px;white-space:normal;cursor:default;line-height:1.2;
  text-transform:none;letter-spacing:0;color:var(--texto)}
table.planilla td{padding:4px 5px;white-space:normal;max-width:none;vertical-align:top}
table.planilla td.largo{min-width:230px}
table.planilla b.monto{font-weight:800}
/* La franja clara entre un trabajo y el siguiente (fila par) ya la pone
   table.grilla para toda tabla; en el papel el navegador descarta los
   fondos de color salvo que se le pida explícitamente, así que sin esto
   la planilla impresa se ve como una sola raya de renglones pegados. */
table.planilla tbody tr:nth-child(even){-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* Cliente, Ciudad y Provincia van con un fondo apenas distinto para
   ubicarlos de un vistazo entre las demás columnas. */
table.planilla th.col-destacada,table.planilla td.col-destacada{
  background:var(--azul-claro);-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* la alerta de "recién instalado" es más urgente: si coinciden en la misma
   fila, gana el color de alerta por sobre el resaltado de columna */
table.planilla tr.recien-instalado td.col-destacada{background:#fde3e0}
/* Al cambiar de día dentro de una misma tabla ("Todo junto", o separando
   por técnico, que puede mezclar días de la semana) el primer trabajo del
   día nuevo lleva una raya más marcada arriba: mismo recurso que ya separa
   una semana de la siguiente en Registro de Service. Va antes que la regla
   de "recién instalado" en print (más abajo) para que, si coinciden en la
   misma fila, gane el color de alerta por sobre esta raya. */
table.planilla tr.otro-dia td{border-top:1.5px solid var(--texto)}
/* Letterhead que se repite en cada hoja física al imprimir: vive adentro del
   <thead> de la tabla (por eso el navegador la reimprime sola en cada salto
   de página, igual que los títulos de columna) y por eso en pantalla no
   hace falta verla dos veces. */
table.planilla tr.fila-titulo-planilla{display:none}
table.planilla tr.fila-titulo-planilla > th{padding:0;border:0;background:none;position:static}
@media print{
  table.planilla tr.fila-titulo-planilla{display:table-row}
  table.planilla tr.fila-titulo-planilla > th{padding:0 0 8px}
  table.planilla tr.fila-titulo-planilla .encabezado-hoja{margin-bottom:0}
}
.pie-hoja{display:flex;gap:34px;margin-top:14px;padding-top:8px;border-top:1px solid var(--borde)}

/* =====================================================================
   LA PLANILLA DE PRODUCTIVIDAD EN PAPEL
   Estas reglas están fuera de @media print a propósito: se aplican con la
   clase "modo-papel", que la aplicación pone un instante antes de imprimir
   para MEDIR cuánto ocupa la hoja y calcular cuánto hay que achicarla para
   que entre en una sola A4. Con la clase puesta, la pantalla se ve igual
   que el papel; sin ella, no cambia nada.
   ===================================================================== */
html.modo-papel .hoja-productividad{border:0;max-height:none;overflow:visible}
/* los minutos NO se imprimen: es el dato que el técnico podría querer inflar */
html.modo-papel table.grilla.prod .p-min{display:none}
html.modo-papel table.grilla.prod input.celda{display:none}
html.modo-papel table.grilla.prod td.num .solo-impresion{display:inline;text-align:right}
html.modo-papel table.grilla.prod{table-layout:fixed;width:100%;font-size:9px}
html.modo-papel table.grilla.prod th.p-n{width:5%}
html.modo-papel table.grilla.prod th.p-mant{width:9.5%}
html.modo-papel table.grilla.prod th.p-finst{width:7.5%}
html.modo-papel table.grilla.prod th.p-fecha{width:5.5%}
html.modo-papel table.grilla.prod th.p-cli{width:14.5%}
html.modo-papel table.grilla.prod th.p-serv{width:9.5%}
html.modo-papel table.grilla.prod th.p-estado{width:7%}
html.modo-papel table.grilla.prod th.p-tec{width:11.5%}
html.modo-papel table.grilla.prod th.p-pago{width:8.5%}
html.modo-papel table.grilla.prod th.p-texto{width:8.5%}
html.modo-papel table.grilla.prod th{font-size:8px;word-break:keep-all;overflow-wrap:normal}
html.modo-papel table.grilla.prod td{padding:3px 4px;white-space:normal;
  overflow-wrap:break-word;word-break:normal;hyphens:none}
html.modo-papel table.grilla.prod tfoot td{position:static}
html.modo-papel table.grilla.prod thead th{position:static}
html.modo-papel .titulo-prod{font-size:12px}
html.modo-papel .no-imprimir{display:none!important}
html.modo-papel .contenido{overflow:visible}

/* ---------- impresión (hoja de ruta / listas) ---------- */
@media print{
  /* En papel siempre se imprime en claro, aunque se esté trabajando en
     modo oscuro: si no, salen hojas negras y se gasta media impresora. */
  html[data-tema="oscuro"]{
    color-scheme:light;
    --barra:#090f13; --barra-texto:#b9c4ce; --barra-linea:#33404b;
    --azul:#0d151b; --azul-osc:#2a3742; --azul-claro:#eceff2; --azul-claro-txt:#0d151b;
    --grafito:#39485a; --acento:#1b3348;
    --fondo:#fff; --papel:#fff; --franja:#f7fafc; --gris:#f4f6f8;
    --borde:#d8dee6; --borde-suave:#e9edf2;
    --texto:#1c2530; --suave:#5a6673; --campo:#fff;
    --th:#eaeff4; --th-txt:#425263; --th-hover:#dfe6ee; --hover:#e6edf5;
    --ok:#0f8a4d; --alerta:#c8811a; --error:#c0392b; --violeta:#6b4fa0;
    --et-gris:#e9edf1; --et-gris-t:#4a5661; --et-verde:#e2f4e9; --et-verde-t:#0f8a4d;
    --et-ambar:#fdf0dc; --et-ambar-t:#a9690e; --et-rojo:#fbe6e3; --et-rojo-t:#c0392b;
    --et-azul:#e4eaf1; --et-azul-t:#2a3742; --et-violeta:#efe9f8; --et-violeta-t:#6b4fa0;
    --fila-hacer:#fdf6c8; --fila-hacer-h:#f8eda6; --fila-hacer-b:#d9a404;
    --fila-nueva:#fde5e2; --fila-nueva-h:#f9d4cf;
    --fila-cola:#fffaea; --fila-cola-b:#f59e0b; --fila-brillo:#fde68a;
  }
  body{background:#fff}
  /* La planilla en papel vuelve a ser compacta: entra más en cada hoja.
     En pantalla cada registro es una tarjeta con aire alrededor; en papel eso
     desperdicia media hoja, así que las tarjetas vuelven a ser renglones
     pegados, con una raya fina entre uno y otro. */
  table.grilla.registro{table-layout:auto;width:100%;border-spacing:0;background:#fff}
  table.grilla.registro td .rec{display:block;-webkit-line-clamp:none;overflow:visible}
  table.grilla.registro th{width:auto!important}
  table.grilla.registro thead th{box-shadow:none}
  table.grilla.registro tbody td{border-top:0;border-bottom:1px solid var(--borde);
    padding:4px 6px}
  table.grilla.registro tbody tr td:first-child,
  table.grilla.registro tbody tr td:last-child{border-left:0;border-right:0;border-radius:0}
  /* el corte de semana en papel es una raya, no un renglón en blanco */
  table.grilla.registro tbody tr.aire-semana{display:none}
  table.grilla.registro tbody tr.otra-semana td{border-top:1.5px solid var(--texto)}
  table.grilla.registro tbody tr{page-break-inside:avoid}
  .barra,.no-imprimir,.ficha-pie,.toast-caja{display:none!important}
  .contenido{overflow:visible;padding:0;height:auto}
  #app{height:auto;overflow:visible;display:block}
  .panel{border:0;box-shadow:none}
  .tabla-caja{max-height:none;overflow:visible}
  table.grilla{font-size:9.5px}
  table.grilla th{background:#eef2f6!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.grilla td{white-space:normal;max-width:none}
  .et{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hoja{page-break-after:always}
  @page{size:A4 landscape;margin:6mm}
  /* con la planilla de trabajos abierta se imprime sólo eso */
  body.imprimiendo .contenido > div > :not(.fondo){display:none!important}
  body.imprimiendo .fondo{position:static;background:none;padding:0;display:block;overflow:visible}
  /* si la hoja se abrió desde una ficha o una ventana, esas no se imprimen */
  body.imprimiendo .ficha,body.imprimiendo .modal{display:none!important}
  /* Marco externo de la hoja impresa: "overflow:visible" a propósito, para
     que si algo llegara a no entrar en el ancho calculado, lo que se corte
     en el borde de la hoja sea este marco y nunca el contenido de la
     tabla (que además ya tiene su propio resguardo: anchosPlanilla() achica
     las columnas de texto largo antes de que eso pueda pasar). */
  body.imprimiendo .hoja-impresion{max-width:none!important;box-shadow:none;
    border:1.5px solid var(--texto);overflow:visible}
  body.imprimiendo .panel-cuerpo{padding:0}
  /* la planilla entra completa en el ancho de la hoja, con letra 12 */
  body.imprimiendo .tabla-caja{border:0}
  table.planilla{line-height:1.18;table-layout:fixed;width:100%}
  table.planilla th,table.planilla td{min-width:0!important;word-break:normal;
    overflow-wrap:break-word;hyphens:none;vertical-align:top;
    overflow:visible;text-overflow:clip;max-width:none}
  /* columnas cortas (fechas, series, modelo): nunca se parte la palabra */
  table.planilla th.corta,table.planilla td.corta{word-break:keep-all;overflow-wrap:normal;
    white-space:normal}
  table.planilla th{font-size:.72em;padding:4px 2px;line-height:1.1}
  table.planilla td{padding:4px 2px}
  /* los títulos se parten entre palabras, nunca en medio de una palabra */
  table.planilla th{word-break:keep-all!important;overflow-wrap:normal!important;hyphens:none}
  /* el importe que figure en las observaciones sale un punto más grande y en negrita */
  table.planilla b.monto{font-weight:800;white-space:nowrap}
  /* el fondo puede no imprimirse: la marca de "recién instalado" va también en borde y texto */
  table.planilla tr.recien-instalado td{background:#fde3e0;border-top:1.5px solid var(--error);
    border-bottom:1.5px solid var(--error)}
  table.planilla tr.recien-instalado td:first-child{border-left:3px solid var(--error)}
  table.planilla tr.recien-instalado td.marca-inst{color:var(--error);font-weight:800}
  table.planilla tr{page-break-inside:avoid}
  .titulo-dia{page-break-after:avoid}
  /* la planilla de productividad: entra en una sola hoja gracias a la escala
     que la aplicación calcula midiendo antes de imprimir */
  .hoja-productividad{zoom:var(--escala-prod,1);border:0}
  table.grilla.prod tr{page-break-inside:avoid}

  /* la lista de repuestos se imprime sólo con los valores en pesos y las notas */
  /* al imprimir sólo van los valores en pesos: los dólares se esconden por clase
     (con nth-child se rompía al agregar la columna de tildes) */
  .tabla-repuestos .col-usd{display:none!important}
  .tabla-repuestos{font-size:11px}
  .tabla-repuestos th{font-size:10.5px}
  .tabla-repuestos .solo-papel{display:block}
  .tabla-repuestos .col-marca{display:none}
  /* en papel no van los fondos de color: se imprime en blanco y negro */
  table.grilla.tabla-repuestos td.col-pesos,
  table.grilla.tabla-repuestos th.col-pesos,
  table.grilla.tabla-repuestos tr.marcado td{background:transparent}
  table.grilla.tabla-repuestos th.col-pesos.grupo{border-top:0}
  /* sin el bloque en dólares al lado, la raya gruesa que los separaba
     queda partiendo la hoja al medio sin motivo */
  table.grilla.tabla-repuestos th.inicia-pesos,
  table.grilla.tabla-repuestos td.inicia-pesos{border-left:1px solid var(--borde-suave)}
  table.grilla.tabla-repuestos tr.marcado td.congelada{box-shadow:none}
  table.grilla.tabla-repuestos td.col-nota .et{background:transparent;padding:0;border:0}
  @page{size:A4 landscape;margin:6mm}
}
.solo-impresion{display:none}
@media print{.solo-impresion{display:block}}
.btn.sec.borrar{color:var(--error);border-color:var(--et-rojo);padding:2px 7px}
.btn.sec.borrar:hover{background:var(--et-rojo)}

</style>
</head>

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function fecha(v, largo) {
  if (!v) return '';
  const [a, m, d] = String(v).slice(0, 10).split('-');
  if (!d) return v;
  return largo ? `${d}/${m}/${a}` : `${d}/${m}/${a.slice(2)}`;
}
function fechaLarga(v) {
  if (!v) return '';
  const f = new Date(String(v).slice(0, 10) + 'T12:00:00');
  return `${DIAS[f.getDay()]} ${f.getDate()} de ${MESES[f.getMonth()]}`;
}
/** Sólo el día de la semana: "lunes", "martes"… (para la planilla del técnico) */
function diaSemana(v) {
  if (!v) return '';
  const f = new Date(String(v).slice(0, 10) + 'T12:00:00');
  return isNaN(f) ? '' : DIAS[f.getDay()];
}
function hoyISO(desplazamiento = 0) {
  const d = new Date(); d.setDate(d.getDate() + desplazamiento);
  return d.toISOString().slice(0, 10);
}
function momento(v) {
  if (!v) return '';
  const d = new Date(v);
  return d.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function plata(v, dec = 0) {
  if (v === null || v === undefined || v === '') return '';
  return '$' + Number(v).toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function usd(v) {
  if (v === null || v === undefined || v === '' || Number(v) === 0) return '';
  return 'U$D ' + Number(v).toLocaleString('es-AR', { maximumFractionDigits: 2 });
}
function sinAcentos(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}
