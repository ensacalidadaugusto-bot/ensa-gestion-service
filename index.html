function EditarCliente({ c, alCerrar, alAbrirTrabajo }) {
  const s = useS();
  const [b, setB] = useState({ ...c });
  const editable = puedeMaestros();
  const set2 = (k, v) => setB(x => ({ ...x, [k]: v }));
  const trabajos = s.trabajos.filter(t => t.cliente_id === c.id)
    .sort((x, y) => String(y.fecha_visita || '').localeCompare(String(x.fecha_visita || '')));
  const equipos = s.equipos.filter(e => e.cliente_id === c.id);

  async function guardar() {
    const db = cliente();
    const cuerpo = { nombre: b.nombre, cuit_dni: b.cuit_dni, ciudad: b.ciudad, provincia: b.provincia,
      direccion: b.direccion, telefono: b.telefono, correo: b.correo, observaciones: b.observaciones };
    if (b.nuevo) {
      const { data, error } = await db.from('clientes').insert(cuerpo).select('*').single();
      if (error) return toast('No se pudo crear: ' + error.message, 'error');
      set({ clientes: [...S.clientes, data].sort((x, y) => x.nombre.localeCompare(y.nombre, 'es')) });
    } else {
      const { error } = await db.from('clientes').update(cuerpo).eq('id', b.id);
      if (error) return toast('No se pudo guardar: ' + error.message, 'error');
      set({ clientes: S.clientes.map(x => x.id === b.id ? { ...x, ...cuerpo } : x) });
      cargarSoloTrabajosDelCliente(b.id);
    }
    toast('Cliente guardado', 'ok');
    alCerrar();
  }

  return html`<${Modal} titulo=${b.nuevo ? 'Nuevo cliente' : b.nombre} alCerrar=${alCerrar} ancho=${640}>
    <${Txt} rot="Nombre / razón social" valor=${b.nombre} alCambiar=${v => set2('nombre', v)} disabled=${!editable} />
    <div class="rejilla">
      <${Txt} rot="CUIT / DNI" valor=${b.cuit_dni} alCambiar=${v => set2('cuit_dni', v)} disabled=${!editable} />
      <${Txt} rot="Teléfono" valor=${b.telefono} alCambiar=${v => set2('telefono', v)} disabled=${!editable} />
      <${Txt} rot="Ciudad" valor=${b.ciudad} alCambiar=${v => set2('ciudad', v)} disabled=${!editable} />
      <${Sel} rot="Provincia" valor=${b.provincia} opts=${opciones('provincia')}
        alCambiar=${v => set2('provincia', v)} disabled=${!editable} />
    </div>
    <${Txt} rot="Dirección" valor=${b.direccion} alCambiar=${v => set2('direccion', v)} disabled=${!editable} />
    <div class="mini" style="margin:-4px 0 6px">Estos son los datos de contacto y facturación del
      cliente. Si tiene varios equipos instalados en puntos distintos, cada dirección de
      instalación se carga en la ficha de cada equipo, no acá.</div>
    <${Txt} rot="Correo" valor=${b.correo} alCambiar=${v => set2('correo', v)} disabled=${!editable} />
    <${Txt} rot="Observaciones" area=${2} valor=${b.observaciones} alCambiar=${v => set2('observaciones', v)}
      disabled=${!editable} />
    ${!b.nuevo && html`<div>
      <div class="mini" style="margin:8px 0 4px"><b>Equipos:</b> ${equipos.map(e => e.n_serie).join(', ') || '—'}</div>
      <div class="mini" style="margin-bottom:4px"><b>Últimos trabajos</b></div>
      <div class="linea-tiempo">
        ${trabajos.slice(0, 12).map(t => html`<div class="ev" style="cursor:pointer"
          onClick=${() => { alCerrar(); alAbrirTrabajo(t.id); }}>
          <b>${fecha(t.fecha_visita, 1)}</b> · ${t.n_serie || ''} · ${t.tipo_servicio || ''} ·
          ${plata(t.precio_sin_iva)} <${Et} txt=${t.cobrado} mapa=${COLOR_COBRO} /></div>`)}
        ${!trabajos.length && html`<div class="mini">Sin trabajos registrados.</div>`}
      </div></div>`}

      <button class="btn sec" onClick=${alCerrar}>Cerrar</button>
      ${editable && html`<button class="btn" onClick=${guardar}>Guardar</button>`}
    </div>
  <//>`;
}

async function cargarSoloTrabajosDelCliente(clienteId) {
  const { data } = await cliente().from('v_trabajos').select('*').eq('cliente_id', clienteId);
  if (!data) return;
  const m = new Map(data.map(t => [t.id, t]));
  set({ trabajos: S.trabajos.map(t => m.get(t.id) || t) });
}

     cliente, pero cada equipo (cada número de serie) tiene su propia

    provincia: y.provincia || (x && x.provincia) || '',

      const { data, error } = await db.from('equipos').insert(cuerpo).select('*').single();
      if (error) return toast('No se pudo crear: ' + error.message, 'error');
      set({ equipos: [...S.equipos, data].sort((x, y) => x.n_serie.localeCompare(y.n_serie, 'es')) });
    } else {
      const { error } = await db.from('equipos').update(cuerpo).eq('id', b.id);

      set({ equipos: S.equipos.map(x => x.id === b.id ? { ...x, ...cuerpo } : x) });

    toast('Equipo guardado', 'ok');
    alCerrar();

function Admin() {
  const s = useS();

  const [tipo, setTipo] = useState('tipo_pedido');
  const [nuevoVal, setNuevoVal] = useState('');
  const [nuevoTec, setNuevoTec] = useState('');
  const [anioTec, setAnioTec] = useState('');
  const [invitando, setInvitando] = useState(null);
  const [invitados, setInvitados] = useState([]);
  const admin = esAdmin();

  async function traerInvitados() {
    const { data } = await cliente().from('invitaciones').select('*')
      .is('usada_en', null).order('creada_en', { ascending: false });
    setInvitados(data || []);
  }
  useEffect(() => { traerInvitados(); }, []);

  async function quitarInvitacion(i) {
    const { error } = await cliente().from('invitaciones').delete().eq('email', i.email);
    if (error) return toast('No se pudo quitar: ' + error.message, 'error');
    setInvitados(l => l.filter(x => x.email !== i.email));
    toast('Invitación quitada', 'ok');
  }

  /* Resumen por técnico: cantidad de trabajos y horas de mano de obra,
     ordenado del que más trabajos hizo al que menos. */
  const aniosTec = useMemo(() => [...new Set(s.trabajos
    .map(t => String(t.fecha_visita || '').slice(0, 4)).filter(Boolean))]
    .sort().reverse(), [s.trabajos]);

  const resumenTec = useMemo(() => {
    const delAnio = anioTec
      ? s.trabajos.filter(t => String(t.fecha_visita || '').slice(0, 4) === anioTec)
      : s.trabajos;
    return s.tecnicos.map(t => {
      // el trabajo puede tener varios técnicos: cuenta para todos los que participaron
      const suyos = delAnio.filter(x => (x.tecnicos || '').split(',').map(n => n.trim()).includes(t.nombre));
      const horas = suyos.reduce((a, x) => a + (Number(x.horas_mo) || 0), 0);
      const conHoras = suyos.filter(x => Number(x.horas_mo) > 0).length;
      return {
        ...t, trabajos: suyos.length,
        cumplidos: suyos.filter(x => x.estado === 'CUMPLIDO').length,
        horas, promedio: conHoras ? horas / conHoras : 0,
      };
    }).sort((a, b) => b.trabajos - a.trabajos || b.horas - a.horas
      || a.nombre.localeCompare(b.nombre, 'es'));
  }, [s.trabajos, s.tecnicos, anioTec]);

  useEffect(() => {
    cliente().from('perfiles').select('*').order('nombre').then(r => setPerfiles(r.data || []));

  async function cambiarRol(p, rol) {

    setPerfiles(l => l.map(x => x.id === p.id ? { ...x, rol } : x));
    toast('Rol actualizado', 'ok');
  }
  async function activarUsuario(p, activo) {
    const r = await actualizarYComprobar('perfiles', p.id, { activo });
    if (!r.ok) return toast(r.msg, 'error');
    setPerfiles(l => l.map(x => x.id === p.id ? { ...x, activo } : x));

  /* ---------------------------------------------------------------------
     LAS CONTRASEÑAS NO SE PUEDEN MOSTRAR
     No es una decisión de esta aplicación: Supabase no guarda la contraseña,
     guarda una huella irreversible de ella. Cuando alguien entra, calcula la
     huella de lo que escribió y la compara. De la huella no se vuelve a la
     contraseña, así que no hay nada que mostrar acá ni en el panel de
     Supabase. Lo que sí se puede hacer es dejar que la persona ponga una
     nueva: eso es este botón, que le manda el correo con el link.

  async function mandarClaveNueva(p) {
    if (!confirm(`Se le va a mandar un correo a ${p.email} con un link para que ponga una `
      + `contraseña nueva.\n\nLa de ahora deja de servir recién cuando la cambie.\n\n¿Lo mando?`)) return;
    setMandando(p.id);
    const { error } = await cliente().auth.resetPasswordForEmail(p.email);
    setMandando(null);
    if (error) return toast('No se pudo enviar: ' + error.message, 'error');
    toast(`Listo: le llegó un correo a ${p.email}`, 'ok');

    set({ catalogos: S.catalogos.map(x => x.id === c.id ? { ...x, activo } : x) });
  }

  const tipos = [...new Set(s.catalogos.map(c => c.tipo))];

  return html`<div class="rejilla-paneles">

      </div>

/* =====================================================================
   ESTADO DEL SISTEMA Y RESPALDOS
   Una pantalla para poder contestar, sin pensar, la pregunta "¿está todo
   bien?": si hay internet, si quedó algo sin subir, cuándo fue el último
   respaldo y cuántos registros hay. Si algo está mal, se ve en rojo y
   dice qué hacer.
   ===================================================================== */
const DIAS_AVISO_RESPALDO = 35;      // un mes y monedas

function EstadoDelSistema() {
  const s = useS();
  const resp = ultimoRespaldo();
  const [probando, setProbando] = useState(false);
  const [base, setBase] = useState(null);   // null = sin probar

  /* Una consulta chiquita a la base: si contesta, la base está viva. No
     alcanza con navigator.onLine, que sólo mira la placa de red. */
  async function probarBase() {
    setProbando(true);
    const desde = Date.now();
    try {
      const { error } = await cliente().from('config').select('id').eq('id', 1).maybeSingle();
      setBase(error ? { ok: false, msg: error.message } : { ok: true, ms: Date.now() - desde });
    } catch (e) {
      setBase({ ok: false, msg: e.message || String(e) });
    }
    setProbando(false);
  }
  useEffect(() => { probarBase(); }, []);

  const luces = [
    { rot: 'Internet', ok: s.enLinea,
      bien: 'Conectado', mal: 'Sin conexión',
      detalle: s.enLinea ? 'Todo lo que se carga se sube al instante.'
        : 'Se puede seguir trabajando: queda guardado acá y se sube solo cuando vuelva.' },
    { rot: 'Cambios sin subir', ok: !s.pendientes,
      bien: 'Ninguno', mal: `${s.pendientes} esperando`,
      detalle: s.pendientes
        ? 'Están guardados en esta computadora. No cierres el navegador hasta que suban.'
        : 'Todo lo que se cargó ya está en la base.' },
    { rot: 'Base de datos', ok: base ? base.ok : null,
      bien: base && base.ok ? `Responde en ${base.ms} ms` : 'Responde',
      mal: 'No responde',
      detalle: base && !base.ok
        ? 'La base no contestó: ' + base.msg
        : 'Probada recién, con una consulta real.' },
    { rot: 'Último respaldo', ok: resp.dias !== null && resp.dias <= DIAS_AVISO_RESPALDO,
      bien: resp.dias === 0 ? 'Hoy' : `Hace ${resp.dias} día${resp.dias === 1 ? '' : 's'}`,

/* ---------------------------------------------------------------------
   AGREGAR UN USUARIO
   La aplicación no puede crear la cuenta en Supabase (eso necesita la
   clave secreta, que nunca viaja acá). Lo que sí hace: dejar habilitado
   el correo con su rol, para que cuando la persona cree su cuenta entre
   ya con los permisos que le corresponden.
   --------------------------------------------------------------------- */
function InvitarUsuario({ inv, alCerrar, alGuardar }) {
  const [b, setB] = useState({ ...inv });
  const [yendo, setYendo] = useState(false);
  const c = (k, v) => setB(x => ({ ...x, [k]: v }));
  const correo = (b.email || '').trim().toLowerCase();
  const valido = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo);

  async function guardar() {
    setYendo(true);
    const { error } = await cliente().from('invitaciones')
      .upsert({ email: correo, rol: b.rol, nombre: (b.nombre || '').trim() || null,
                invitado_por: nombreUsuario(), usada_en: null }, { onConflict: 'email' });
    setYendo(false);
    if (error) {
      return toast(/no existe|does not exist/i.test(error.message)
        ? 'Falta correr 13_borrado_y_usuarios.sql en Supabase.'
        : 'No se pudo guardar: ' + error.message, 'error');
    }
    toast(`${correo} queda habilitado como ${NOMBRE_ROL[b.rol]}`, 'ok');
    alGuardar && alGuardar();
    alCerrar();
  }

  return html`<${Modal} titulo="Agregar un usuario" alCerrar=${alCerrar}>
    <${Txt} rot="Correo" tipo="email" valor=${b.email} alCambiar=${v => c('email', v)}
      placeholder="nombre@ensa.com.ar" />
    <${Txt} rot="Nombre (opcional)" valor=${b.nombre} alCambiar=${v => c('nombre', v)}
      placeholder="Cómo lo va a ver el resto" />
    <${Sel} rot="Rol" valor=${b.rol} opts=${ROLES} etiquetas=${NOMBRE_ROL} sinVacio
      alCambiar=${v => c('rol', v || 'lectura')} />
    <div class="aviso" style="margin-top:2px">${DETALLE_ROL[b.rol]}</div>
    <div class="aviso ojo">
      <b>Falta un paso en Supabase.</b>
      <div class="mini">Por seguridad la aplicación no crea cuentas: la clave que permite hacerlo
        nunca viaja en este archivo. Entrá a <b>Supabase → Authentication → Users → Add user</b>,
        cargá ese mismo correo con una contraseña y tildá <b>Auto Confirm User</b>.
        Al entrar por primera vez, la persona va a tener el rol que elegiste acá.</div>
    </div>
    <div class="fila" style="justify-content:flex-end;margin-top:4px">
      <button class="btn sec" onClick=${alCerrar}>Cancelar</button>
      <button class="btn" disabled=${!valido || yendo} onClick=${guardar}>
        ${yendo ? 'Guardando…' : 'Habilitar este correo'}</button>
    </div>
  <//>`;
}

/* ---------------------------------------------------------------------
   Pantalla de configuración
   Antes de guardar prueba la conexión de verdad y dice exactamente qué
   pasa: así nadie queda trabado sin saber cuál de los dos datos está mal.
   --------------------------------------------------------------------- */
function normalizarURL(v) {
  let u = String(v || '').trim().replace(/\s/g, '');
  if (!u) return '';
  u = u.replace(/\/+$/, '').replace(/\/rest\/v1.*$/, '').replace(/\/auth\/v1.*$/, '');
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}
/** Revisa que los datos sirvan, sin necesidad de estar logueado */
async function probarConexion(url, key) {
  const u = normalizarURL(url);
  if (!/^https:\/\/[^/]+\.supabase\.(co|in)$/i.test(u) && !/^https?:\/\/localhost/.test(u)) {
    return { ok: false, msg: 'La URL no tiene la forma esperada. Tiene que ser algo como '
      + 'https://abcdefgh.supabase.co (sin barras ni rutas al final).' };
  }
  if (!/^(eyJ|sb_publishable_)/.test(key)) {
    return { ok: false, msg: key.startsWith('sb_secret_') || key.startsWith('service_role')
      ? 'Esa es la clave secreta (sb_secret_…): nunca va acá. Copiá la publicable, la que dice '
        + '"publishable" o "anon".'
      : 'La clave no parece la correcta. Tiene que empezar con sb_publishable_… (o con eyJ… '
        + 'si tu proyecto todavía usa las claves viejas).' };
  }
  let r;
  try {
    r = await fetch(u + '/rest/v1/catalogos?select=id&limit=1',
      { headers: { apikey: key, Authorization: 'Bearer ' + key } });
  } catch (e) {
    return { ok: false, msg: 'No se pudo conectar con el proyecto. Revisá que la URL sea la correcta '
      + 'y que tengas internet. Si el proyecto estuvo sin uso, puede estar en pausa: entrá a Supabase '
      + 'y tocá "Restore project".' };
  }
  if (r.status === 401 || r.status === 403) {
    return { ok: false, msg: 'La URL responde, pero rechaza la clave. Copiá de nuevo la clave '
      + 'publicable (Settings → API Keys) y fijate de no dejar espacios al pegarla.' };
  }
  if (r.status === 404) {
    return { ok: false, msg: 'El proyecto responde pero no encuentra las tablas. Faltó correr los '
      + 'scripts SQL: empezá por 01_esquema.sql.' };
  }
  if (!r.ok) return { ok: false, msg: 'El proyecto respondió con un error ' + r.status + '. '
    + (await r.text().catch(() => '')).slice(0, 200) };
  return { ok: true, msg: 'Conexión correcta: ya se ven las tablas del sistema.', url: u };
}

function Login() {
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [msg, setMsg] = useState(null);
  const [ocupado, setOcupado] = useState(false);

  async function entrar(e) {
    e.preventDefault();
    setOcupado(true); setMsg(null);
    const { error } = await cliente().auth.signInWithPassword({ email: email.trim(), password: pass });
    if (error) {
      // se distingue "no anda la conexión" de "la contraseña está mal"
      const m = error.message || '';
      if (/failed to fetch|networkerror|load failed/i.test(m) || !navigator.onLine) {
        setMsg('No se pudo hablar con el proyecto. Revisá que tengas internet, y si el problema '
          + 'sigue, tocá “Cambiar los datos de conexión” abajo y verificá la URL y la clave.');
      } else if (/invalid api key|jwt|apikey/i.test(m)) {
        setMsg('El proyecto rechaza la clave. Tocá “Cambiar los datos de conexión” abajo y pegá '
          + 'de nuevo la clave publicable de Supabase.');
      } else if (m === 'Invalid login credentials') {
        setMsg('Usuario o contraseña incorrectos. Si es la primera vez que entrás, el usuario '
          + 'tiene que estar creado en Supabase → Authentication → Users, con “Auto Confirm User” tildado.');
      } else if (/email not confirmed/i.test(m)) {
        setMsg('El usuario existe pero está sin confirmar. En Supabase → Authentication → Users, '
          + 'editalo y confirmalo (o volvé a crearlo tildando “Auto Confirm User”).');
      } else setMsg(m);
    }
    setOcupado(false);
  }
  async function recuperar() {
    if (!email.trim()) return setMsg('Escribí tu correo y volvé a tocar “Olvidé mi contraseña”.');
    const { error } = await cliente().auth.resetPasswordForEmail(email.trim());
    setMsg(error ? error.message : 'Te enviamos un correo para restablecer la contraseña.');
  }

  return html`<form class="login" onSubmit=${entrar}>
    <img src=${LOGO_NEGRO} alt="ENSA" style="height:34px;width:auto;display:block;margin:0 0 16px" />
    <h1>Gestión general de service</h1>
    <p>Ingresá con tu correo y contraseña.</p>
    ${msg && html`<div class="aviso ${msg.startsWith('Te enviamos') ? 'ok' : 'error'}">${msg}</div>`}
    <${Txt} rot="Correo" tipo="email" valor=${email} alCambiar=${setEmail} />
    <${Txt} rot="Contraseña" tipo="password" valor=${pass} alCambiar=${setPass} />
    <button class="btn" style="width:100%;margin-top:6px" disabled=${ocupado}>
      ${ocupado ? 'Entrando…' : 'Entrar'}</button>
    <div class="mini" style="text-align:center;margin-top:10px">
      <a href="#" onClick=${e => { e.preventDefault(); recuperar(); }}>Olvidé mi contraseña</a>
    </div>
    <div class="mini" style="text-align:center;margin-top:14px;padding-top:12px;
      border-top:1px solid var(--borde);color:var(--suave)">
      Conectado a <b>${(leerConfig().url || '').replace(/^https?:\/\//, '') || 'ningún proyecto'}</b>${' '}
      ${!CFG_FIJA.url.startsWith('__') ? '' : html`·${' '}
        <a href="#" onClick=${e => { e.preventDefault(); set({ reconfigurar: true }); }}>
          Cambiar los datos de conexión</a>`}
    </div>
  </form>`;
}

  ['admin',     'Administración',       () => html`<${Admin} />`,     ['admin', 'oficina']],
];
/* Orden de las pestañas según el rol. Cobranzas (Daniel) trabaja primero en el
   registro y después en cobranza, así que las ve en ese orden. */
const ORDEN_POR_ROL = {
  cobranza: ['trabajos', 'cobranza', 'repuestos', 'clientes'],
  consulta: ['trabajos'],
};
function vistasDe(r) {
  const permitidas = VISTAS.filter(v => v[3].includes(r));
  const orden = ORDEN_POR_ROL[r];
  if (!orden) return permitidas;
  const elegidas = orden.map(k => permitidas.find(v => v[0] === k)).filter(Boolean);
  return elegidas.length ? elegidas : permitidas;
}

/* ---------------------------------------------------------------------
   CAMBIAR LA PROPIA CONTRASEÑA
   Cada uno entra por primera vez con una contraseña provisoria que le
   pasó el administrador. Esto es para que la cambie por una suya sin
   tener que pedirle nada a nadie ni pasar por el correo.
   --------------------------------------------------------------------- */
function CambiarClave({ alCerrar }) {
  const [nueva, setNueva] = useState('');
  const [otraVez, setOtraVez] = useState('');
  const [msg, setMsg] = useState('');
  const [guardando, setGuardando] = useState(false);
  const MINIMO = 8;

  async function guardar() {
    if (nueva.length < MINIMO) return setMsg(`La contraseña tiene que tener al menos ${MINIMO} caracteres.`);
    if (nueva !== otraVez) return setMsg('Las dos no coinciden. Escribilas de nuevo.');
    setGuardando(true);
    const { error } = await cliente().auth.updateUser({ password: nueva });
    setGuardando(false);
    if (error) return setMsg('No se pudo cambiar: ' + error.message);
    toast('Listo: tu contraseña quedó cambiada', 'ok');
    alCerrar();
  }

  return html`<${Modal} titulo="Cambiar mi contraseña" alCerrar=${alCerrar}>
    <p class="mini">Elegí una que sepas sólo vos. Desde la próxima vez que entres, vas a usar
    ésta. Nadie —tampoco el administrador— puede verla.</p>
    <label class="campo"><span>Contraseña nueva</span>
      <input type="password" value=${nueva} autoComplete="new-password"
        onInput=${e => { setNueva(e.target.value); setMsg(''); }} /></label>
    <label class="campo"><span>Escribila otra vez</span>
      <input type="password" value=${otraVez} autoComplete="new-password"
        onInput=${e => { setOtraVez(e.target.value); setMsg(''); }}
        onKeyDown=${e => e.key === 'Enter' && guardar()} /></label>
    <div class="mini">Al menos ${MINIMO} caracteres. Que no sea tu nombre ni el de la empresa.</div>
    ${msg && html`<div class="aviso error" style="margin-top:9px">${msg}</div>`}
    <div class="fila" style="justify-content:flex-end;margin-top:12px">
      <button class="btn sec" onClick=${alCerrar}>Cancelar</button>
      <button class="btn" disabled=${guardando} onClick=${guardar}>
        ${guardando ? 'Guardando…' : 'Cambiar contraseña'}</button>
    </div>
  <//>`;
}

          <div class="mini">Queda un ícono propio, abre en su ventana —sin barra del navegador— y
            arranca aunque no haya internet.</div>
          <button class="btn chico" style="margin-top:7px" onClick=${() => {
            setMenu(false);
            if (s.sePuedeInstalar) instalar(); else set({ verInstalarIOS: true });
          }}>Instalar la aplicación</button>
        </div>`}
        ${s.instalada && html`<div class="mini" style="margin-top:8px">
          Estás usando la aplicación instalada.</div>`}
        <div class="fila" style="margin-top:8px">
          <button class="btn sec chico"
            onClick=${() => { setCambiarClave(true); setMenu(false); }}>Cambiar mi contraseña</button>
          ${puedePrecios() && html`<button class="btn sec chico"
            onClick=${() => { descargarRespaldo(); setMenu(false); }}>Respaldo en Excel</button>`}
          <button class="btn sec chico" onClick=${() => { cargarDatos(); setMenu(false); }}>Recargar datos</button>
          <button class="btn sec chico" onClick=${async () => { await cliente().auth.signOut(); location.reload(); }}>
            Cerrar sesión</button>
        </div>
      </div></div>`}
    ${cambiarClave && html`<${CambiarClave} alCerrar=${() => setCambiarClave(false)} />`}
    <div class="contenido">
      ${s.faltanColumnas && html`<div class="aviso error no-imprimir">
        <b>Falta terminar la instalación de la base.</b>
        <div class="mini">No están estas columnas: ${s.faltanColumnas.map(x => x.col).join(', ')}.
          Corré en el editor SQL de Supabase ${' ' + [...new Set(s.faltanColumnas.map(x => x.script))].join(' y ') + ' '}
          y volvé a entrar. Hasta entonces algunos guardados van a fallar.</div>
      </div>`}
      ${s.desdeCache && html`<div class="aviso no-imprimir">
        <b>Trabajando sin internet.</b>
        <span class="mini">Estos son los datos de la última vez que hubo conexión
          (${momento(s.desdeCache)}). Lo que cargues se guarda igual y se sube solo cuando vuelva.</span>
      </div>`}
      ${s.error && html`<div class="aviso error">Hubo un problema al leer los datos: ${s.error}</div>`}
      ${s.cargando && !s.trabajos.length
        ? html`<div class="cargando">Cargando la base de service…</div>`
        : vista[2]()}
    </div>
    <${AvisoVersion} />
    ${s.verInstalarIOS && html`<${ComoInstalarIOS} alCerrar=${() => set({ verInstalarIOS: false })} />`}
    <${ErrorGrave} />
    <${Toasts} />
  </div>`;
}

/* Un error de guardado no puede pasar desapercibido: queda en pantalla hasta
   que la persona lo lee y lo cierra, con el texto exacto para poder copiarlo. */
function ErrorGrave() {
  const s = useS();
  if (!s.errorGrave) return null;
  const e = s.errorGrave;
  return html`<div class="fondo no-imprimir" style="z-index:200">
    <div class="panel" style="max-width:560px;width:92%">
      <div class="panel-cab"><h2 style="color:var(--error)">${e.titulo}</h2></div>
      <div class="panel-cuerpo">
        <p style="margin:0 0 8px">Nada se perdió: los datos siguen cargados en la ficha.
          Copiá este mensaje si necesitás pasárselo a quien administra el sistema.</p>
        ${e.pista && html`<div class="aviso" style="margin-bottom:8px">${e.pista}</div>`}
        <pre style="white-space:pre-wrap;background:var(--gris);padding:8px;border-radius:6px;
          font-size:12px;max-height:240px;overflow:auto">${e.detalle}</pre>
        <div class="fila" style="justify-content:flex-end;margin-top:10px">
          <button class="btn sec" onClick=${() => {
            navigator.clipboard.writeText(e.titulo + '\n' + e.detalle).then(() => toast('Copiado', 'ok'));
          }}>Copiar</button>
          <button class="btn" onClick=${() => set({ errorGrave: null })}>Entendido</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* Los atajos del ícono (?ir=cobranza) abren directo esa pestaña */
function abrirVistaDelAtajo() {
  try {
    const v = new URL(location.href).searchParams.get('ir');
    if (v) set({ vista: v });
  } catch (e) { /* si la dirección es rara, se ignora */ }
}

/* ---------------------------------------------------------------------
   ESQUINA INFERIOR DERECHA
   Algunos hostings (Netlify, entre otros) pegan un distintivo flotante en
   esa esquina, que queda justo encima del botón Guardar de la ficha. Como
   ese cartel vive en un marco aislado y no se puede tocar desde acá, lo
   que se hace es mirar si hay algo ajeno ocupando la esquina y, si lo hay,
   correr los botones para arriba.
   --------------------------------------------------------------------- */
function vigilarEsquina() {
  const mirar = () => {
    const raiz = document.getElementById('raiz');
    const x = window.innerWidth - 70, y = window.innerHeight - 24;
    const el = document.elementFromPoint(x, y);
    const ajeno = !!el && el !== document.body && el !== document.documentElement
      && !(raiz && raiz.contains(el));
    document.body.classList.toggle('esquina-ocupada', ajeno);
  };
  [400, 1500, 4000].forEach(t => setTimeout(mirar, t));
  window.addEventListener('resize', mirar);
}

/* ---------------------------------------------------------------------
   ARRANQUE
   --------------------------------------------------------------------- */
async function iniciar() {
  prepararTema();
  render(html`<${App} />`, document.getElementById('raiz'));
  vigilarEsquina();
  prepararInstalacion();
  registrarMotor();
  abrirVistaDelAtajo();
  const db = cliente();
  if (!db) return;

  async function sesion(u) {
    if (!u) { set({ usuario: null, perfil: null, cargando: false }); return; }
    const { data, error } = await db.from('perfiles').select('*').eq('id', u.id).maybeSingle();
    if (data) { try { localStorage.setItem('perfil_service', JSON.stringify(data)); } catch (e) {} }
    // si no hay internet se usa el perfil de la última sesión: así no queda en "sólo lectura"
    let perfil = data;
    if (!perfil && error) {
      try { perfil = JSON.parse(localStorage.getItem('perfil_service') || 'null'); } catch (e) {}
      if (perfil && perfil.id !== u.id) perfil = null;
    }
    if (perfil && perfil.activo === false) {
      await db.auth.signOut();
      set({ usuario: null, perfil: null, cargando: false });
      toast('Tu usuario está desactivado. Pedile a un administrador que lo habilite.', 'error');
      return;
    }
    set({ usuario: u, perfil: perfil || { rol: 'lectura', email: u.email } });
    await cargarDatos();
    escucharCambios();
  }

  vigilarConexion();
  const { data: { session } } = await db.auth.getSession();
  await sesion(session && session.user);
  db.auth.onAuthStateChange((ev, ses) => {
    if (ev === 'SIGNED_IN' && !S.usuario) sesion(ses && ses.user);
    if (ev === 'SIGNED_OUT') set({ usuario: null, perfil: null });
  });
}

iniciar();

</script>

</html>
