  'PEHUAJO': 'BUENOS AIRES', 'MAR DEL PLATA': 'BUENOS AIRES', 'LA PLATA': 'BUENOS AIRES',
  'BAHIA BLANCA': 'BUENOS AIRES', 'ROSARIO': 'SANTA FE', 'RAFAELA': 'SANTA FE',
  'PARANA': 'ENTRE RÍOS', 'CONCORDIA': 'ENTRE RÍOS', 'GUALEGUAYCHU': 'ENTRE RÍOS',
  'RIO CUARTO': 'CÓRDOBA', 'VILLA CARLOS PAZ': 'CÓRDOBA',
};
/* la clave con la que se compara: sin acentos, sin puntos y sin espacios de más */
const clave_prov = t => sinAcentos(t).toUpperCase().replace(/[.,]/g, ' ')
  .replace(/\s+/g, ' ').trim();
const PROVINCIA_POR_CLAVE = (() => {
  const m = new Map();
  for (const p of PROVINCIAS) m.set(clave_prov(p), p);
  for (const [k, v] of Object.entries(PROVINCIA_ALIAS)) m.set(clave_prov(k), v);
  return m;
})();
/** Deja la provincia escrita de una sola manera. Lo que no reconoce lo
    devuelve en mayúsculas y tal cual, para que se vea y se pueda corregir. */
function normalizarProvincia(txt) {
  const t = String(txt == null ? '' : txt).trim();
  if (!t) return '';
  return PROVINCIA_POR_CLAVE.get(clave_prov(t)) || t.toUpperCase();
}
/** true si esa provincia no está en la lista oficial: hay algo mal escrito */
function provinciaDesconocida(txt) {
  const t = String(txt || '').trim();
  return !!t && !PROVINCIA_POR_CLAVE.has(clave_prov(t));
}

/* ---------------------------------------------------------------------
   QUÉ SE ROMPE Y QUÉ SE HACE
   Nadie clasifica los trabajos por tipo de falla: lo que hay son las
   observaciones del servicio y los comentarios internos, escritos a mano
   por el que atendió. Así que la lista de fallas frecuentes no sale de
   una categoría cargada, sale de contar qué se repite en ese texto.

   Cómo se cuenta:
     · de las observaciones se tiran primero las frases comerciales
       —"Acepta BASIC Service $400.000 + IVA", forma de pago, cuotas—,
       que son la mitad del campo y no hablan de ninguna falla;
     · se saca lo que no aporta: artículos, preposiciones, números;
     · lo que queda se cuenta UNA VEZ POR TRABAJO, no por aparición: lo
       que interesa es en cuántos trabajos se habla de eso, y así una
       observación larga que repite "puerta" cuatro veces no pesa más
       que cuatro trabajos distintos.
   --------------------------------------------------------------------- */

/* palabras que no dicen nada por sí solas */
const PALABRAS_VACIAS = new Set(`de la el en y a que se los las del al un una por con para
es su sus lo le les o u no ni mas este esta ese esa aquel como cuando donde si ya muy pero
fue son ser estan hay hace hacer sobre entre desde hasta tambien otro otra otros otras cada
todo toda todos todas cual cuales quien quienes nos vos usted ella ellos ellas mi tu tus
nuestro dos tres uno dia dias mes meses hora horas ahora luego antes despues sin con srl
sra sap dice dijo debe puede pueden tiene tienen tener queda quedo ver solo bien mal
estaba fueron hizo hacen dar dan dio habia`.split(/\s+/));

/* Frases que son nota comercial, no técnica: si la oración habla de plata,
   de un plan de service o de la forma de pago, no cuenta para las fallas. */
const FRASE_COMERCIAL = /\$|\biva\b|\bbasic\b|\bplus\b|\bfull\b|abona|efectivo|cuotas?|presupuest|transferenc|factur|cotizaci|acepta|se[rv]+ice/i;

/** deja sólo la parte técnica del texto */
function soloTecnico(txt) {
  return String(txt || '').split(/[.\n;]+/)
    .filter(p => p.trim() && !FRASE_COMERCIAL.test(p)).join(' ');
}

/** Parte el texto en palabras útiles, sin acentos y sin relleno.
    Los números sueltos se van (fechas, importes, modelos), pero las
    palabras que mezclan letras y números se quedan enteras: si no,
    "RJ45" se convertía en "rj" y no había manera de contarlo. */
function palabrasUtiles(txt) {
  return sinAcentos(txt).split(/[^a-zñ0-9]+/)
    .filter(p => p.length > 2 && !/^\d+$/.test(p) && !PALABRAS_VACIAS.has(p));
}

/* Singular y plural son la misma cosa: "regulación puerta" y "regulación
   puertas" no pueden salir como dos fallas distintas. Se les saca la ese
   final sólo para agrupar; lo que se muestra después es la forma que más
   veces aparece escrita, para que se lea natural. */
function raiz(palabra) {
  if (palabra.length > 5 && palabra.endsWith('es')) return palabra.slice(0, -2);
  if (palabra.length > 4 && palabra.endsWith('s')) return palabra.slice(0, -1);
  return palabra;
}

/**
 * Cuenta las palabras (o frases de n palabras) que más se repiten.
 * @param textos  lista de { id, txt } — el id sirve para mostrar ejemplos
 * @param n       1 = palabras sueltas, 2 = de a dos, 3 = de a tres
 * @param comercial  true si hay que sacar antes las frases de plata
 * @returns { lista: [[frase, cuantos]], dondeEsta: Map(frase → [ids]), conTexto }
 */
function contarRepetidas(textos, n = 2, comercial = false) {
  const cuantos = new Map();      // raíz → en cuántos trabajos aparece
  const formas = new Map();       // raíz → cómo se escribió cada vez
  const donde = new Map();        // raíz → en qué trabajos
  let conTexto = 0;

  for (const { id, txt } of textos) {
    const pal = palabrasUtiles(comercial ? soloTecnico(txt) : txt);
    if (!pal.length) continue;
    conTexto++;
    /* una vez por trabajo: si la observación repite "puerta" cuatro veces,
       ese trabajo suma uno, no cuatro */
    const vistas = new Map();
    for (let i = 0; i + n <= pal.length; i++) {
      const trozo = pal.slice(i, i + n);
      vistas.set(trozo.map(raiz).join(' '), trozo.join(' '));
    }
    for (const [clave, comoSeEscribio] of vistas) {
      cuantos.set(clave, (cuantos.get(clave) || 0) + 1);
      if (!formas.has(clave)) formas.set(clave, new Map());
      const f = formas.get(clave);
      f.set(comoSeEscribio, (f.get(comoSeEscribio) || 0) + 1);
      if (!donde.has(clave)) donde.set(clave, []);
      donde.get(clave).push(id);
    }
  }

  /* se muestra la forma que más veces se escribió, no la raíz pelada */
  const rotulo = new Map();
  for (const [clave, f] of formas) {
    rotulo.set(clave, [...f.entries()].sort((a, b) => b[1] - a[1])[0][0]);
  }
  const dondeEsta = new Map();
  for (const [clave, ids] of donde) dondeEsta.set(rotulo.get(clave), ids);

  return {
    lista: [...cuantos.entries()].filter(x => x[1] > 1)
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
      .map(([clave, veces]) => [rotulo.get(clave), veces]),
    dondeEsta, conTexto,
  };
}

/* ---------------------------------------------------------------------
   LAS FALLAS QUE SE MIRAN SIEMPRE
   Además de "qué se repite" en general, hay una lista fija de piezas y
   síntomas que interesa seguir mes a mes, esté o no entre lo más
   repetido. Esa lista se edita desde Administración → Listas
   desplegables, en el grupo "falla_buscada": lo que se escriba ahí es
   lo que se cuenta. Esto de acá abajo es lo que trae de fábrica, y es
   lo que se usa si esa lista todavía no está cargada.

   Cómo se busca cada término:
     · sin acentos y sin distinguir mayúsculas ("perín" encuentra "perin");
     · singular y plural son lo mismo ("turbina" encuentra "turbinas");
     · las palabras de más chicas no cuentan: "trabas DE cabina" encuentra
       igual "trabas cabina";
     · un asterisco al final abre la palabra: "ancl*" encuentra anclaje,
       anclado, se ancló, anclar…;
     · una barra separa maneras distintas de decir lo mismo.
   --------------------------------------------------------------------- */
const FALLAS_BUSCADAS = [
  { valor: 'Puerta',                busca: 'puerta' },
  { valor: 'Motorización',          busca: 'motorizacion / motor*' },
  { valor: 'Turbina',               busca: 'turbina' },
  { valor: 'Perín',                 busca: 'perin' },
  { valor: 'Bisagra',               busca: 'bisagra' },
  { valor: 'Aborta maniobra',       busca: 'abort* maniobra' },
  { valor: 'Trabas de cabina',      busca: 'traba cabina' },
  { valor: 'Anclaje',               busca: 'ancl*' },
  { valor: 'Válvula de venteo',     busca: 'valvula venteo' },
  { valor: 'Lápiz magnético',       busca: 'lapiz*' },
  { valor: 'Sensor',                busca: 'sensor' },
  { valor: 'Fuente',                busca: 'fuente' },
  { valor: 'Panel de control',      busca: 'panel control' },
  { valor: 'PLC',                   busca: 'plc' },
  { valor: 'Plaquetas de cilindro', busca: 'plaqueta cilindro' },
  { valor: 'RJ45',                  busca: 'rj45 / rj 45' },
];

/** La lista que está en uso: la de Administración si la cargaron, si no la de fábrica */
function fallasBuscadas() {
  const cargadas = (S.catalogos || []).filter(c => c.tipo === 'falla_buscada' && c.activo);
  if (!cargadas.length) return FALLAS_BUSCADAS;
  return cargadas.sort((a, b) => (a.orden || 0) - (b.orden || 0))
    .map(c => ({ valor: c.valor, busca: c.detalle || c.valor }));
}

/** "abort* maniobra / aborto maniobra" → [[abort*, maniobra], [aborto, maniobra]] */
function formasDe(busca) {
  return String(busca || '').split('/')
    .map(f => sinAcentos(f).split(/[^a-zñ0-9*]+/)
      .filter(p => p && !PALABRAS_VACIAS.has(p.replace('*', ''))))
    .filter(f => f.length);
}

/** ¿esta palabra del texto es la que busca el término? */
function calza(palabra, buscada) {
  return buscada.endsWith('*')
    ? palabra.startsWith(buscada.slice(0, -1))
    : raiz(palabra) === raiz(buscada);
}

/** ¿aparece la secuencia, una palabra atrás de la otra? */
function apareceSeguido(palabras, forma) {
  for (let i = 0; i + forma.length <= palabras.length; i++) {
    let va = true;
    for (let k = 0; k < forma.length; k++) {
      if (!calza(palabras[i + k], forma[k])) { va = false; break; }
    }
    if (va) return palabras.slice(i, i + forma.length).join(' ');
  }
  return null;
}

/**
 * Cuenta en cuántos trabajos aparece cada término de la lista fija.
 * Devuelve lo mismo que contarRepetidas, más las formas encontradas de
 * cada uno: así se puede ver con qué palabras exactas se lo encontró.
 */
function contarBuscadas(textos, terminos, comercial = false) {
  const cuantos = new Map(), donde = new Map(), comoAparece = new Map();
  let conTexto = 0;
  const preparados = terminos.map(t => ({ ...t, formas: formasDe(t.busca) }));

  for (const { id, txt } of textos) {
    const pal = palabrasUtiles(comercial ? soloTecnico(txt) : txt);
    if (!pal.length) continue;
    conTexto++;
    for (const t of preparados) {
      let hallado = null;
      for (const f of t.formas) { hallado = apareceSeguido(pal, f); if (hallado) break; }
      if (!hallado) continue;
      cuantos.set(t.valor, (cuantos.get(t.valor) || 0) + 1);
      if (!donde.has(t.valor)) donde.set(t.valor, []);
      donde.get(t.valor).push(id);
      if (!comoAparece.has(t.valor)) comoAparece.set(t.valor, new Map());
      const m = comoAparece.get(t.valor);
      m.set(hallado, (m.get(hallado) || 0) + 1);
    }
  }
  return {
    lista: terminos.map(t => [t.valor, cuantos.get(t.valor) || 0])
      .sort((a, b) => b[1] - a[1]),
    dondeEsta: donde, conTexto, comoAparece,
  };
}

function semanaISO(iso) {
  const d = new Date(String(iso).slice(0, 10) + 'T12:00:00');
  const j = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dia = j.getUTCDay() || 7;
  j.setUTCDate(j.getUTCDate() + 4 - dia);
  const ini = new Date(Date.UTC(j.getUTCFullYear(), 0, 1));
  return { semana: Math.ceil(((j - ini) / 86400000 + 1) / 7), anio: j.getUTCFullYear() };
}
function lunesDe(iso) {
  const d = new Date(String(iso).slice(0, 10) + 'T12:00:00');
  const dia = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dia);
  return d.toISOString().slice(0, 10);
}
function sumarDias(iso, n) {
  const d = new Date(String(iso).slice(0, 10) + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
/* Nombre de archivo seguro: sin acentos ni signos raros. Los navegadores
   descartan el nombre propuesto cuando trae caracteres no ingleses y el
   archivo termina bajando como "download", sin extensión. */
function nombreArchivo(txt) {
  return String(txt == null ? '' : txt)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Za-z0-9 ._\-()]+/g, ' ')
    .replace(/\s+/g, ' ').trim()
    .slice(0, 120) || 'export';
}
function csvEscapar(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function bajarCSV(nombre, columnas, filas) {
  const txt = '﻿' + [columnas.map(c => csvEscapar(c.rot)).join(';')]
    .concat(filas.map(f => columnas.map(c => csvEscapar(c.val(f))).join(';'))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = nombreArchivo(nombre + '_' + hoyISO()) + '.csv';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 4000);
}
const COLOR_ESTADO = {
  'CUMPLIDO': 'verde', 'PROGRAMADO': 'azul', 'PENDIENTE': 'ambar',
  'EN REVISIÓN': 'violeta', 'REPROGRAMAR': 'ambar', 'CANCELA VISITA': 'gris',
};
const COLOR_COBRO = {
  'SI': 'verde', 'NO': 'rojo', 'EN CURSO': 'ambar', 'NO APLICA': 'gris',
  'SIN DATOS': 'gris', 'CANCELADO': 'gris', 'VERDEJO': 'violeta', 'INCOBRABLE': 'rojo',
};
const COLOR_PRIORIDAD = { 'Alta': 'rojo', 'Media': 'ambar', 'Baja': 'gris' };
const ABIERTOS = ['PENDIENTE', 'PROGRAMADO', 'EN REVISIÓN', 'REPROGRAMAR'];
/* Estados que todavía se pueden asignar a una gira: un PROGRAMADO ya tiene fecha */
const ASIGNABLES = ['PENDIENTE', 'EN REVISIÓN', 'REPROGRAMAR'];

/* ---------------------------------------------------------------------
   DÓNDE ESTÁ INSTALADO EL EQUIPO
   La dirección que importa para ir a hacer el service es la del EQUIPO
   (cada ascensor queda instalado en un domicilio fijo), no la del cliente
   registrado en el trabajo: el cliente puede cambiar (nueva administración,
   nuevo propietario) y su domicilio de contacto no tiene por qué coincidir
   con dónde está el equipo. La ficha de Equipo ya tiene sus propios campos
   de ciudad/provincia/dirección (solapa Clientes y equipos → Equipos).

   Mientras se completa esa ficha en los equipos ya cargados, si el equipo
   todavía no tiene su domicilio propio cargado se usa el del cliente como
   resguardo, para no dejar la hoja de ruta ni la grilla en blanco. */
function equipoDe(t) {
  return t.equipo_id ? S.equipos.find(e => e.id === t.equipo_id) : null;
}
function direccionDe(t) {
  const e = equipoDe(t);
  return (e && e.direccion) || t.cliente_direccion || '';
}
function ciudadDe(t) {
  const e = equipoDe(t);
  return (e && e.ciudad) || t.cliente_ciudad || '';
}
function provinciaDe(t) {
  const e = equipoDe(t);
  return (e && e.provincia) || t.cliente_provincia || '';
}
/** Ciudad y provincia (del equipo si la tiene cargada) en una sola celda */
function ubicacion(t) {
  return [ciudadDe(t), provinciaDe(t)].filter(x => x && String(x).trim()).join(', ');
}

/* ---------------------------------------------------------------------
   CIERRE ADMINISTRATIVO
   Un trabajo CUMPLIDO nace ABIERTO. Para cerrarlo hace falta definir el
   estado de facturación y cargar las observaciones del servicio.
   --------------------------------------------------------------------- */
const FACT_SIN_DEFINIR = ['SIN DATOS', 'EN CURSO'];

/** Cobro que ya no pasa por el módulo de cobranza */
const COBRO_TERMINADO = ['CANCELADO', 'NO APLICA', 'INCOBRABLE', 'VERDEJO'];
/** Cobrado en efectivo en el momento: el trabajo se cierra solo */
function cobradoEnMano(t) { return t.cobrado === 'CANCELADO'; }

/** Devuelve qué falta para poder cerrar el trabajo (vacío = se puede cerrar) */
function faltaParaCerrar(t) {
  const falta = [];
  // si se cobró en efectivo no hace falta definir facturación: el trabajo ya está saldado
  if (!cobradoEnMano(t) && (!t.facturado || FACT_SIN_DEFINIR.includes(t.facturado)))
    falta.push('definir el estado de facturación');
  if (!t.obs_servicio || !String(t.obs_servicio).trim()) falta.push('cargar las observaciones del servicio');
  return falta;
}
/** Lo único que falta son las observaciones: sólo el administrador puede cerrarlo igual */
function soloFaltanObservaciones(t) {
  const f = faltaParaCerrar(t);
  return f.length === 1 && f[0] === 'cargar las observaciones del servicio';
}
/* "PENDIENTE COBRANZA": un tercer estado de cierre, además de ABIERTO y
   CERRADO. Es para casos viejos que no se van a cobrar en lo inmediato:
   saca al trabajo de la cola de "cumplidos sin cerrar" (ya no hace falta
   seguir completando nada del lado del servicio), pero sin decir que se
   cobró -- sigue apareciendo en "Pendientes de cobro", en Cobranza, hasta
   que alguien lo marque como pagado. */
const CIERRE_PENDIENTE_COBRANZA = 'PENDIENTE COBRANZA';
function estaAbierto(t) {
  return t.estado === 'CUMPLIDO' && t.cierre !== 'CERRADO' && t.cierre !== CIERRE_PENDIENTE_COBRANZA;
}

/* ---------------------------------------------------------------------
   EN QUÉ ANDA CADA CASO
   Una sola palabra por trabajo, para el gráfico de la cabecera de
   Cobranza. Son cinco cajones y ninguno se pisa con otro: cada trabajo
   cae en uno solo, así los números del gráfico suman el total y no hay
   que explicar por qué la cuenta da de más.
   --------------------------------------------------------------------- */
const COBRO_CERRADO = ['SI', 'CANCELADO', 'NO APLICA', 'INCOBRABLE', 'VERDEJO'];
/** el trabajo entró al circuito de cobranza y todavía no se saldó */
function esperaCobro(t) {
  if (cobradoEnMano(t)) return false;
  if (COBRO_CERRADO.includes(t.cobrado)) return false;
  return ['EN CURSO', 'SI'].includes(t.facturado) || !!t.factura_solicitada
    || Number(t.precio_sin_iva) > 0;
}
const SITUACIONES = ['En curso', 'Pendiente de cobro', 'Abierto', 'Cerrado', 'Cancelado'];
const COLOR_SITUACION = {
  'En curso': 'azul', 'Pendiente de cobro': 'ambar', 'Abierto': 'rojo',
  'Cerrado': 'verde', 'Cancelado': 'gris',
};
function situacionDelCaso(t) {
  if (t.estado === 'CANCELA VISITA' || t.cobrado === 'CANCELADO') return 'Cancelado';
  if (ABIERTOS.includes(t.estado)) return 'En curso';
  if (t.cierre === 'CERRADO') return 'Cerrado';
  if (t.cierre === CIERRE_PENDIENTE_COBRANZA) return 'Pendiente de cobro';
  return esperaCobro(t) ? 'Pendiente de cobro' : 'Abierto';
}

/** Porcentaje de IVA que corresponde a un trabajo: el propio si se cargó
    uno (incluso 0, que es válido), y si no el general de Configuración. */
function ivaDe(t) {
  const v = t && t.iva;
  return (v === null || v === undefined || v === '') ? (Number(S.config.iva) || 21) : Number(v);
}

/* ---------------------------------------------------------------------
   EQUIPO RECIÉN INSTALADO
   Si el trabajo se programa a menos de un mes de la instalación, la fila
   se marca en rojo: casi siempre es garantía y conviene mirarlo distinto.
   --------------------------------------------------------------------- */
const DIAS_RECIEN_INSTALADO = 31;
function diasDeInstalado(t) {
  const inst = t.fecha_instalacion, visita = t.fecha_visita || t.fecha_pedido;
  if (!inst || !visita) return null;
  const a = new Date(String(inst).slice(0, 10) + 'T12:00:00');
  const b = new Date(String(visita).slice(0, 10) + 'T12:00:00');
  if (isNaN(a) || isNaN(b)) return null;
  return Math.round((b - a) / 86400000);
}
function recienInstalado(t) {
  const d = diasDeInstalado(t);
  return d !== null && Math.abs(d) < DIAS_RECIEN_INSTALADO;
}
/** Trabajo todavía por hacer: se pinta en amarillo en el registro */
function porHacer(t) { return t.estado === 'PENDIENTE' || t.estado === 'PROGRAMADO'; }

/* El color del canto izquierdo de cada tarjeta del registro. Es la respuesta
   a "¿en qué anda este trabajo?" de un solo vistazo, sin leer nada:
     verde  — hecho y cerrado, no hay nada más que hacer
     rojo   — hecho pero sin cerrar: espera factura u observaciones
     ámbar  — todavía por hacer
     azul   — en revisión o a reprogramar
     gris   — cancelado */
function tonoDeFila(t) {
  if (t.estado === 'CANCELA VISITA') return 'gris';
  if (t.estado === 'CUMPLIDO') {
    if (t.cierre === 'CERRADO') return 'listo';
    if (t.cierre === CIERRE_PENDIENTE_COBRANZA) return 'pendiente-cobranza';
    return 'abierto';
  }
  if (porHacer(t)) return 'hacer';
  return 'mirar';
}
function cierreQueCorresponde(t) {
  if (t.estado !== 'CUMPLIDO') return null;
  if (t.cierre === 'CERRADO') return 'CERRADO';
  if (t.cierre === CIERRE_PENDIENTE_COBRANZA) return CIERRE_PENDIENTE_COBRANZA;
  return 'ABIERTO';
}
/* ---------------------------------------------------------------------
   Regla de cierre automático
   CUMPLIDO + COBRO "Cancelado" (pagó en efectivo)  →  se cierra solo y
   no pasa por cobranza.  Facturado EN CURSO o SI   →  queda ABIERTO en
   rojo y aparece en el módulo de cobranza hasta que se cobre.
   --------------------------------------------------------------------- */
function cierreAutomatico(cuerpo) {
  const c = { ...cuerpo };
  if (c.estado !== 'CUMPLIDO') { c.cierre = null; return c; }
  // CERRADO y PENDIENTE COBRANZA son decisiones explícitas (los botones de
  // cierre de la ficha): se respetan tal cual, no se recalculan solas.
  if (c.cierre === 'CERRADO' || c.cierre === CIERRE_PENDIENTE_COBRANZA) return c;
  if (cobradoEnMano(c) && !faltaParaCerrar(c).length) { c.cierre = 'CERRADO'; return c; }
  c.cierre = 'ABIERTO';
  return c;
}

/* =====================================================================
   ACCESO A DATOS
   ===================================================================== */
async function traerTodo(tabla, orden) {
  const db = cliente(); const paso = 1000; let desde = 0; let acum = [];
  for (let vuelta = 0; vuelta < 200; vuelta++) {
    let q = db.from(tabla).select('*').range(desde, desde + paso - 1);
    if (orden) q = q.order(orden.campo, { ascending: !!orden.asc });
    const { data, error } = await q;
    if (error) throw error;
    acum = acum.concat(data);
    if (!data.length || data.length < paso) break;
    desde += paso;
  }
  return acum;
}

/* ---------------------------------------------------------------------
   CONTROL DE ESQUEMA
   Si a la base le falta alguna columna (porque quedó sin correr alguno
   de los scripts SQL) la aplicación lo dice en pantalla en lugar de
   fallar en silencio cada vez que se intenta guardar.
   --------------------------------------------------------------------- */
const COLUMNAS_ESPERADAS = [
  ['cierre', '11_puesta_al_dia.sql'],
  ['factura_solicitada', '11_puesta_al_dia.sql'],
  ['fecha_solicitud_factura', '11_puesta_al_dia.sql'],
  ['viaticos', '11_puesta_al_dia.sql'],
];
async function verificarEsquema() {
  const db = cliente();
  const faltan = [];
  const { data } = await db.from('v_trabajos').select('*').limit(1);
  const fila = data && data[0];
  if (fila) {
    COLUMNAS_ESPERADAS.forEach(([col, script]) => {
      if (col === 'viaticos') return;
      if (!(col in fila)) faltan.push({ col, script });
    });
  }
  const g = await db.from('giras').select('*').limit(1);
  if (g.data && g.data[0] && !('viaticos' in g.data[0])) faltan.push({ col: 'viaticos', script: '11_puesta_al_dia.sql' });
  set({ faltanColumnas: faltan.length ? faltan : null });
  return faltan;
}

async function cargarDatos() {
  const db = cliente();
  set({ cargando: true, error: null });
  if (esConsulta()) return cargarDatosConsulta();
  // sin conexión no tiene sentido esperar a que fallen las consultas: se usa la copia local
  if (!navigator.onLine) {
    const c = await leerCache();
    if (c) {
      const { guardado_en, ...datos } = c;
      set({ ...datos, cargando: false, error: null, desdeCache: guardado_en });
      return;
    }
  }
  try {
    const [trabajos, clientes, equipos, tecnicos, repuestos, giras, catalogos, cfg] = await Promise.all([
      traerTodo('v_trabajos', { campo: 'id', asc: false }),
      traerTodo('clientes', { campo: 'nombre', asc: true }),
      traerTodo('equipos', { campo: 'n_serie', asc: true }),
      traerTodo('tecnicos', { campo: 'nombre', asc: true }),
      traerTodo('repuestos', { campo: 'orden', asc: true }),
      traerTodo('giras', { campo: 'fecha_desde', asc: false }),
      traerTodo('catalogos', { campo: 'orden', asc: true }),
      db.from('config').select('*').eq('id', 1).maybeSingle(),
    ]);
    const datos = { trabajos, clientes, equipos, tecnicos, repuestos, giras, catalogos,
      config: cfg.data || S.config };
    set({ ...datos, cargando: false, desdeCache: null });
    guardarCache(datos);                       // copia local por si se corta internet
    verificarEsquema().catch(() => {});
  } catch (e) {
    // sin conexión (o error de lectura): se trabaja con la última copia local
    const cache = await leerCache();
    if (cache) {
      const { guardado_en, ...datos } = cache;
      set({ ...datos, cargando: false, error: null, desdeCache: guardado_en });
    } else {
      set({ cargando: false, error: e.message || String(e) });
    }
  }
}

/* ---------------------------------------------------------------------
   GUARDAR Y COMPROBAR QUE HAYA QUEDADO

   Hay una trampa fea en cómo contesta la base: si a un usuario no le
   alcanzan los permisos para modificar una fila, el cambio NO da error.
   La base contesta "200, todo bien" y no modifica nada. Visto desde
   acá, un guardado que no guarda nada se ve exactamente igual que uno
   que sí guardó.

   Por eso no alcanza con mirar si hubo error: hay que pedirle a la base
   que devuelva la fila modificada y comprobar que efectivamente vino
   alguna. Si no vino ninguna, el cambio se rechazó y hay que decirlo.
   --------------------------------------------------------------------- */
async function actualizarYComprobar(tabla, id, cuerpo) {
  const { data, error } = await cliente().from(tabla).update(cuerpo).eq('id', id).select('*');
  if (error) return { ok: false, msg: 'La base rechazó el cambio: ' + error.message };
  if (!data || !data.length) {
    return { ok: false, rechazo: true,
      msg: 'La base no aplicó el cambio. No dio error: directamente no modificó nada, que es '
         + 'lo que pasa cuando al usuario no le alcanzan los permisos sobre esa tabla. '
         + 'Corré en Supabase el script sql/18_permisos_precios.sql y probá de nuevo.' };
  }
  return { ok: true, fila: data[0] };
}

/** Relee un trabajo desde la vista y lo mete en el estado */
async function refrescarTrabajo(id) {
  const mismo = t => String(t.id) === String(id);
  const { data, error } = await cliente().from('v_trabajos').select('*').eq('id', id).maybeSingle();
  if (error) throw error;
  if (!data) { set({ trabajos: S.trabajos.filter(t => !mismo(t)) }); return null; }
  const i = S.trabajos.findIndex(mismo);
  const lista = S.trabajos.slice();
  if (i >= 0) lista[i] = data; else lista.unshift(data);
  set({ trabajos: lista });
  return data;
}

/** Guarda cambios de un trabajo controlando que nadie lo haya tocado antes */
async function guardarTrabajo(id, cambios, actualizadoEn) {
  const db = cliente();
  let q = db.from('trabajos').update(cambios).eq('id', id);
  if (actualizadoEn) q = q.eq('actualizado_en', actualizadoEn);
  const { data, error } = await q.select('id');
  if (error) throw error;
  if (actualizadoEn && (!data || !data.length)) {
    const err = new Error('CONFLICTO'); err.conflicto = true; throw err;
  }
  return refrescarTrabajo(id);
}

/** Corrige el CUIT/CUIL/DNI o el correo de un cliente ("datos de facturación"):
    lo guarda en la tabla clientes y refresca al toque tanto la lista de
    clientes como los trabajos que ya traían ese dato embebido (vienen de la
    vista v_trabajos, que no se entera sola de este cambio). Tira una
    excepción si la base no aplicó el cambio (sin permiso, etc.), igual que
    actualizarYComprobar. */
async function actualizarDatosFacturacion(clienteId, campos) {
  const r = await actualizarYComprobar('clientes', clienteId, campos);
  if (!r.ok) throw new Error(r.msg);
  const reflejo = {};
  if ('cuit_dni' in campos) reflejo.cliente_cuit = campos.cuit_dni;
  if ('correo' in campos) reflejo.cliente_correo = campos.correo;
  set({
    clientes: S.clientes.map(c => c.id === clienteId ? { ...c, ...campos } : c),
    trabajos: S.trabajos.map(t => t.cliente_id === clienteId ? { ...t, ...reflejo } : t),
  });
  return r.fila;
}

async function guardarTecnicos(trabajoId, ids) {
  const db = cliente();
  await db.from('trabajo_tecnicos').delete().eq('trabajo_id', trabajoId);
  if (ids.length) {
    const { error } = await db.from('trabajo_tecnicos')
      .insert(ids.map(t => ({ trabajo_id: trabajoId, tecnico_id: t })));
    if (error) throw error;
  }
}

/** Suscripción en vivo: los cambios de los demás entran solos */
function escucharCambios() {
  const db = cliente();
  return db.channel('cambios-service')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trabajos' }, async p => {
      const id = (p.new && p.new.id) || (p.old && p.old.id);
      if (!id) return;
      if (p.eventType === 'DELETE') { set({ trabajos: S.trabajos.filter(t => t.id !== id) }); return; }
      const previo = S.trabajos.find(t => t.id === id);
      const t = await refrescarTrabajo(id);
      if (t && t.actualizado_por && t.actualizado_por !== nombreUsuario()) {
        toast(`${t.actualizado_por} ${previo ? 'actualizó' : 'cargó'} ${t.n_llamada || '#' + t.id} — ${t.cliente_nombre || ''}`);
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'config' }, async () => {
      const { data } = await db.from('config').select('*').eq('id', 1).maybeSingle();
      if (data) set({ config: data });
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'giras' }, async () => {
      set({ giras: await traerTodo('giras', { campo: 'fecha_desde', asc: false }) });
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'clientes' }, async () => {
      set({ clientes: await traerTodo('clientes', { campo: 'nombre', asc: true }) });
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'equipos' }, async () => {
      set({ equipos: await traerTodo('equipos', { campo: 'n_serie', asc: true }) });
    })
    .subscribe();
}
function nombreUsuario() {
  return (S.perfil && (S.perfil.nombre || S.perfil.email)) || '';

let _instalador = null;          // el pedido de instalación que ofrece el navegador

    || window.matchMedia('(display-mode: window-controls-overlay)').matches
    || window.navigator.standalone === true;

}

function prepararInstalacion() {

  window.addEventListener('beforeinstallprompt', e => {

    _instalador = e;

async function instalar() {

  _instalador.prompt();
  const r = await _instalador.userChoice.catch(() => null);
  _instalador = null;

/* =====================================================================
   MODO CLARO Y MODO OSCURO
   Tres posiciones: Automático (sigue lo que tenga puesto la computadora),
   Claro y Oscuro. Queda guardado en la máquina de cada uno, así que cada
   persona lo elige para sí y no le cambia la pantalla a los demás.
   ===================================================================== */
const TEMAS = [
  ['auto',   'Automático', '◐'],
  ['claro',  'Claro',      '☀'],
  ['oscuro', 'Oscuro',     '☾'],
];
let _mediaOscuro = null;

/** el tema que hay que pintar ahora: con "auto" manda la computadora */
function temaEfectivo(elegido) {
  if (elegido === 'claro' || elegido === 'oscuro') return elegido;
  return (_mediaOscuro && _mediaOscuro.matches) ? 'oscuro' : 'claro';
}

function pintarTema() {
  const t = temaEfectivo(S.tema);
  document.documentElement.setAttribute('data-tema', t);
  // la barra de arriba del celular y de la ventana de la aplicación instalada
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'oscuro' ? '#0b1218' : '#090f13');
}

function prepararTema() {
  try {
    _mediaOscuro = window.matchMedia('(prefers-color-scheme: dark)');
    const g = localStorage.getItem('tema_service');
    if (g === 'claro' || g === 'oscuro' || g === 'auto') S.tema = g;
    // si la persona dejó "automático", se sigue el cambio del sistema en vivo
    const alCambiar = () => { if (S.tema === 'auto') { pintarTema(); set({}); } };
    if (_mediaOscuro.addEventListener) _mediaOscuro.addEventListener('change', alCambiar);
    else if (_mediaOscuro.addListener) _mediaOscuro.addListener(alCambiar);
  } catch (e) { /* si el navegador no deja, queda en claro y listo */ }
  pintarTema();
}

function ponerTema(t) {
  set({ tema: t });
  try { localStorage.setItem('tema_service', t); } catch (e) {}
  pintarTema();
}

/** el botón de la barra: un toque pasa al siguiente modo */
function BotonTema() {
  const s = useS();
  const i = Math.max(0, TEMAS.findIndex(x => x[0] === s.tema));
  const [, rot, icono] = TEMAS[i];
  const sig = TEMAS[(i + 1) % TEMAS.length];
  return html`<button class="btn-tema" title=${`Modo ${rot.toLowerCase()}. Tocá para pasar a ${sig[1].toLowerCase()}.`}
    onClick=${() => ponerTema(sig[0])}>
    <span aria-hidden="true">${icono}</span><span class="rot-tema">${rot}</span></button>`;
}

/* ---------------------------------------------------------------------
   Registro del motor y aviso de versión nueva
   --------------------------------------------------------------------- */
function registrarMotor() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('./sw.js').then(reg => {
    /* Se vigila cada motor nuevo. Importante: hay que mirar el estado en el
       momento Y escuchar los cambios; si ya terminó de instalarse antes de
       que lleguemos a escuchar, el evento no vuelve a dispararse nunca. */
    const vigilar = w => {
      if (!w) return;
      const revisar = () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) {
          set({ hayVersionNueva: true });
        }
      };
      revisar();
      w.addEventListener('statechange', revisar);
    };
    vigilar(reg.installing);
    vigilar(reg.waiting);
    reg.addEventListener('updatefound', () => vigilar(reg.installing || reg.waiting));
    // se busca versión nueva al volver a la pestaña y cada media hora
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
    setInterval(() => reg.update(), 30 * 60 * 1000);
  }).catch(() => { /* si no se puede registrar, la aplicación funciona igual */ });

  /* Sólo se recarga cuando se REEMPLAZA un motor que ya estaba andando.
     En la primera visita el motor toma el control por primera vez y ahí no
     hay que recargar nada: sería un parpadeo raro apenas entrás. */
  const habiaMotor = !!navigator.serviceWorker.controller;
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!habiaMotor || recargando) return;
    recargando = true;
    location.reload();
  });
}

async function aplicarVersionNueva() {
  const reg = await navigator.serviceWorker.getRegistration();
  if (reg && reg.waiting) reg.waiting.postMessage('actualizar-ya');
  else location.reload();
}

/* Cartel de versión nueva: no interrumpe, pero se ve */
function AvisoVersion() {
  const s = useS();
  if (!s.hayVersionNueva) return null;
  return html`<div class="aviso-version no-imprimir">
    <span>Hay una versión nueva de la aplicación.</span>
    <button class="btn chico" onClick=${aplicarVersionNueva}>Actualizar ahora</button>
    <button class="btn sec chico" onClick=${() => set({ hayVersionNueva: false })}>Más tarde</button>
  </div>`;
}

/* ===== 12_cola.js ===== */
/* =====================================================================
   COLA SIN CONEXIÓN
   Si se corta internet en medio de la sesión, nada se pierde: cada
   alta o cambio queda guardado en el navegador y se sube solo cuando
   la conexión vuelve. El usuario sigue trabajando como si nada.
   ===================================================================== */
const COLA_KEY = 'cola_service_v1';
const TMP_KEY = 'cola_service_tmp';

function leerCola() {
  try { return JSON.parse(localStorage.getItem(COLA_KEY) || '[]'); } catch (e) { return []; }
}
function escribirCola(c) {
  try { localStorage.setItem(COLA_KEY, JSON.stringify(c)); } catch (e) { /* sin espacio */ }
  set({ pendientes: c.length });
}
function proximoTmp() {
  const n = (Number(localStorage.getItem(TMP_KEY)) || 0) + 1;
  localStorage.setItem(TMP_KEY, String(n));
  return 'tmp' + n;
}
const esTmp = id => typeof id === 'string' && id.startsWith('tmp');

/** ¿el error es de red (y no del servidor)? */
function errorDeRed(e) {
  if (!e) return !navigator.onLine;
  const m = String(e.message || e);
  return !navigator.onLine
    || /failed to fetch|networkerror|network request failed|load failed|err_internet|timeout|aborted/i.test(m);
}

/** Agrega una operación a la cola y avisa */
function encolar(op) {
  const c = leerCola();
  c.push({ ...op, id_op: Date.now() + '-' + Math.random().toString(36).slice(2, 7) });
  escribirCola(c);
}

/* ---------------------------------------------------------------------
   COPIA LOCAL DE LOS DATOS
   Queda guardada en el navegador para que, si se abre la aplicación sin
   internet, se pueda seguir consultando y cargando trabajos.
   (Se usa IndexedDB porque la base entera no entra en localStorage.)
   --------------------------------------------------------------------- */
const CACHE_DB = 'service_cache';
function _abrirCache() {
  return new Promise((ok, mal) => {
    if (!window.indexedDB) return mal(new Error('sin IndexedDB'));
    const p = indexedDB.open(CACHE_DB, 1);
    p.onupgradeneeded = () => p.result.createObjectStore('datos');
    p.onsuccess = () => ok(p.result);
    p.onerror = () => mal(p.error);
  });
}
async function guardarCache(datos) {
  try {
    const db = await _abrirCache();
    await new Promise((ok, mal) => {
      const tx = db.transaction('datos', 'readwrite');
      tx.objectStore('datos').put({ ...datos, guardado_en: new Date().toISOString() }, 'todo');
      tx.oncomplete = ok; tx.onerror = () => mal(tx.error);
    });
    db.close();
  } catch (e) { /* si no se puede guardar, se sigue igual */ }
}
async function leerCache() {
  try {
    const db = await _abrirCache();
    const r = await new Promise((ok, mal) => {
      const p = db.transaction('datos', 'readonly').objectStore('datos').get('todo');
      p.onsuccess = () => ok(p.result); p.onerror = () => mal(p.error);
    });
    db.close();
    return r || null;
  } catch (e) { return null; }
}

/* ---------------------------------------------------------------------
   Alta de trabajo tolerante a cortes de internet
   --------------------------------------------------------------------- */
async function crearTrabajo(cuerpo, tecnicos) {
  const db = cliente();
  if (navigator.onLine) {
    const { data, error } = await db.from('trabajos').insert(cuerpo).select('id').single();
    if (error) {
      if (!errorDeRed(error)) throw error;
    } else {
      await guardarTecnicos(data.id, tecnicos || []);
      return { id: data.id, enCola: false };
    }
  }
  // sin conexión: queda en la cola y aparece en la grilla marcado como pendiente
  const tmp = proximoTmp();
  encolar({ tipo: 'insert', tabla: 'trabajos', cuerpo, tecnicos: tecnicos || [], tmp });
  set({ trabajos: [filaProvisoria(tmp, cuerpo, tecnicos || []), ...S.trabajos] });
  return { id: tmp, enCola: true };
}

/** Arma una fila parecida a v_trabajos para mostrarla mientras no hay internet */
function filaProvisoria(tmp, cuerpo, tecnicos) {
  const cli = S.clientes.find(c => String(c.id) === String(cuerpo.cliente_id));
  const eq = S.equipos.find(e => String(e.id) === String(cuerpo.equipo_id));
  return {
    ...cuerpo, id: tmp, sin_sincronizar: true,
    n_llamada: cuerpo.n_llamada || '(se numera al subir)',
    cliente_nombre: cli ? cli.nombre : '', cliente_ciudad: cli ? cli.ciudad : '',
    cliente_provincia: cli ? cli.provincia : '', cliente_direccion: cli ? cli.direccion : '',
    cliente_telefono: cli ? cli.telefono : '', cliente_cuit: cli ? cli.cuit_dni : '',
    n_serie: eq ? eq.n_serie : '', modelo: eq ? eq.modelo : '', n_paradas: eq ? eq.n_paradas : '',
    fecha_instalacion: eq ? eq.fecha_instalacion : null,
    tecnico_ids: tecnicos,
    tecnicos: tecnicos.map(t => (S.tecnicos.find(x => String(x.id) === String(t)) || {}).nombre)
      .filter(Boolean).join(', '),
    actualizado_por: nombreUsuario(), actualizado_en: new Date().toISOString(),
  };
}

/** Cambio de trabajo tolerante a cortes de internet */
async function actualizarTrabajo(id, cambios, actualizadoEn, tecnicos) {
  if (esTmp(id)) {                       // todavía no subió el alta: se retoca la cola
    const c = leerCola();
    const op = c.find(o => o.tmp === id);
    if (op) { Object.assign(op.cuerpo, cambios); if (tecnicos) op.tecnicos = tecnicos; escribirCola(c); }
    set({ trabajos: S.trabajos.map(t => t.id === id ? { ...t, ...cambios } : t) });
    return { enCola: true };
  }
  if (navigator.onLine) {
    try {
      await guardarTrabajo(id, cambios, actualizadoEn);
      if (tecnicos) await guardarTecnicos(id, tecnicos);
      return { enCola: false };
    } catch (e) { if (!errorDeRed(e)) throw e; }
  }
  encolar({ tipo: 'update', tabla: 'trabajos', id, cuerpo: cambios, tecnicos: tecnicos || null });
  set({ trabajos: S.trabajos.map(t => t.id === id ? { ...t, ...cambios, sin_sincronizar: true } : t) });
  return { enCola: true };
}

/* ---------------------------------------------------------------------
   Subida de lo pendiente
   --------------------------------------------------------------------- */
let subiendo = false;
async function subirCola(silencioso) {
  if (subiendo || !navigator.onLine) return;
  const db = cliente();
  if (!db) return;
  let c = leerCola();
  if (!c.length) return;
  subiendo = true;
  set({ subiendo: true });
  let ok = 0; const trabados = [];
  for (const op of c) {
    try {
      if (op.tipo === 'insert') {
        const { data, error } = await db.from(op.tabla).insert(op.cuerpo).select('id').single();
        if (error) throw error;
        if (op.tecnicos && op.tecnicos.length) await guardarTecnicos(data.id, op.tecnicos);
        if (op.tmp) {                    // se cambia la fila provisoria por la real
          set({ trabajos: S.trabajos.filter(t => t.id !== op.tmp) });
          await refrescarTrabajo(data.id);
        }
      } else if (op.tipo === 'update') {
        // al reintentar no se controla concurrencia: manda lo último que cargó el usuario
        const { error } = await db.from(op.tabla).update(op.cuerpo).eq('id', op.id);
        if (error) throw error;
        if (op.tecnicos) await guardarTecnicos(op.id, op.tecnicos);
        await refrescarTrabajo(op.id);
      }
      ok++;
    } catch (e) {
      if (errorDeRed(e)) { trabados.push(op); continue; }     // se reintenta después
      // el servidor lo rechazó: se saca de la cola y se avisa fuerte
      set({ errorGrave: {
        titulo: 'Un cambio guardado sin conexión fue rechazado por la base',
        detalle: (e.message || String(e)) + '\n\nDatos: ' + JSON.stringify(op.cuerpo, null, 1),
      } });
    }
  }
  const quedan = leerCola().filter(o => trabados.some(t => t.id_op === o.id_op));
  escribirCola(quedan);
  subiendo = false;
  set({ subiendo: false });
  if (ok && !silencioso) toast(`Se subieron ${ok} ${ok === 1 ? 'cambio pendiente' : 'cambios pendientes'}`, 'ok');
}

function vigilarConexion() {
  const marcar = () => {
    set({ enLinea: navigator.onLine });
    if (navigator.onLine) subirCola();
  };
  window.addEventListener('online', marcar);
  window.addEventListener('offline', marcar);
  setInterval(() => { if (navigator.onLine && leerCola().length) subirCola(true); }, 20000);
  set({ enLinea: navigator.onLine, pendientes: leerCola().length });
  if (navigator.onLine && leerCola().length) subirCola(true);
  // aviso antes de cerrar la pestaña con cosas sin subir
  window.addEventListener('beforeunload', e => {
    if (leerCola().length) { e.preventDefault(); e.returnValue = ''; }
  });
}


/* ===== 15_xlsx.js ===== */
/* =====================================================================
   GENERADOR DE ARCHIVOS EXCEL (.xlsx)
   Escribe el archivo a mano —ZIP + XML— para no depender de ninguna librería
   externa. Soporta texto, números y fechas reales.
   ===================================================================== */

/* ---- CRC32, necesario para el ZIP ---- */
const TABLA_CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = TABLA_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/* ---- comprime con el motor del navegador; si no está, guarda sin comprimir ---- */
async function desinflar(bytes) {
  if (typeof CompressionStream === 'undefined') return null;
  try {
    const flujo = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    const salida = new Uint8Array(await new Response(flujo).arrayBuffer());
    return salida.length < bytes.length ? salida : null;
  } catch (e) { return null; }
}

/* ---- ZIP (deflate cuando se puede, si no "stored") ---- */
async function zip(archivos) {
  const cod = new TextEncoder();
  const locales = [], central = [];
  let offset = 0;
  const u16 = n => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = n => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];

  for (const { nombre, contenido } of archivos) {
    const datos = typeof contenido === 'string' ? cod.encode(contenido) : contenido;
    const nom = cod.encode(nombre);
    const crc = crc32(datos);
    const comp = await desinflar(datos);
    const cuerpo = comp || datos;
    const metodo = comp ? 8 : 0;
    const cab = [].concat(u32(0x04034b50), u16(20), u16(0), u16(metodo), u16(0), u16(0),
      u32(crc), u32(cuerpo.length), u32(datos.length), u16(nom.length), u16(0));
    locales.push(new Uint8Array(cab), nom, cuerpo);
    central.push(new Uint8Array([].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(metodo), u16(0), u16(0),
      u32(crc), u32(cuerpo.length), u32(datos.length),
      u16(nom.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset))), nom);
    offset += cab.length + nom.length + cuerpo.length;
  }

  const largoCentral = central.reduce((a, b) => a + b.length, 0);
  const fin = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0),
    u16(archivos.length), u16(archivos.length), u32(largoCentral), u32(offset), u16(0)));

  const partes = locales.concat(central, [fin]);
  const total = partes.reduce((a, p) => a + p.length, 0);
  const salida = new Uint8Array(total);
  let p = 0;
  partes.forEach(x => { salida.set(x, p); p += x.length; });
  return salida;
}

/* ---- utilidades de hoja ---- */
function xmlEsc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]))
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
}
function letraCol(n) {
  let s = '';
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; }
  return s;
}
function serieFecha(iso) {
  const d = new Date(String(iso).slice(0, 10) + 'T12:00:00');
  if (isNaN(d)) return null;
  return Math.round((d - new Date('1899-12-30T12:00:00')) / 86400000);
}

/**
 * hojas: [{ nombre, columnas: [rótulos], filas: [[valores]] }]
 * Los valores pueden ser: null, número, string, {f: 'AAAA-MM-DD'} (fecha)
 */
async function construirXlsx(hojas) {
  const anchoDe = (rot, filas, i) => {
    let m = String(rot).length;
    for (let r = 0; r < Math.min(filas.length, 400); r++) {
      const v = filas[r][i];
      const l = v == null ? 0 : (typeof v === 'object' ? 10 : String(v).length);
      if (l > m) m = l;
    }
    return Math.min(Math.max(m + 2, 8), 55);
  };

  const hojasXml = hojas.map(({ columnas, filas }) => {
    const cols = columnas.map((c, i) =>
      `<col min="${i + 1}" max="${i + 1}" width="${anchoDe(c, filas, i)}" customWidth="1"/>`).join('');
    const cabecera = '<row r="1" ht="26" customHeight="1">' + columnas.map((c, i) =>
      `<c r="${letraCol(i + 1)}1" s="1" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c)}</t></is></c>`).join('') + '</row>';
    const cuerpo = filas.map((fila, fi) => {
      const celdas = fila.map((v, ci) => {
        const ref = `${letraCol(ci + 1)}${fi + 2}`;
        if (v === null || v === undefined || v === '') return '';
        if (typeof v === 'object' && v.f) {
          const s = serieFecha(v.f);
          return s === null ? '' : `<c r="${ref}" s="2"><v>${s}</v></c>`;
        }
        if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}" s="3"><v>${v}</v></c>`;
        return `<c r="${ref}" s="0" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
      }).join('');
      return `<row r="${fi + 2}">${celdas}</row>`;
    }).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetPr><outlinePr summaryBelow="1" summaryRight="1"/></sheetPr>
<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
<cols>${cols}</cols>
<sheetData>${cabecera}${cuerpo}</sheetData>
<autoFilter ref="A1:${letraCol(columnas.length)}${filas.length + 1}"/>
</worksheet>`;
  });

  const rels = hojas.map((_, i) =>
    `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('');
  const hojasLista = hojas.map((h, i) =>
    `<sheet name="${xmlEsc(h.nombre.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('');

  const archivos = [
    { nombre: '[Content_Types].xml', contenido: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${hojas.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>` },
    { nombre: '_rels/.rels', contenido: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` },
    { nombre: 'xl/workbook.xml', contenido: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${hojasLista}</sheets></workbook>` },
    { nombre: 'xl/_rels/workbook.xml.rels', contenido: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${rels}<Relationship Id="rId${hojas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` },
    { nombre: 'xl/styles.xml', contenido: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="2"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/><numFmt numFmtId="165" formatCode="#,##0.##"/></numFmts>
<fonts count="2">
<font><sz val="11"/><color theme="1"/><name val="Calibri"/></font>
<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>
</fonts>
<fills count="3">
<fill><patternFill patternType="none"/></fill>
<fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FF0F4C81"/><bgColor indexed="64"/></patternFill></fill>
</fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="4">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>
<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
</cellXfs>
</styleSheet>` },
  ];
  hojasXml.forEach((x, i) => archivos.push({ nombre: `xl/worksheets/sheet${i + 1}.xml`, contenido: x }));
  return await zip(archivos);
}

async function bajarXlsx(nombre, hojas) {
  const bytes = await construirXlsx(hojas);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes],
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = nombreArchivo(nombre.replace(/\.xlsx$/i, '')) + '.xlsx';
  // algunos navegadores sólo respetan el nombre si el enlace está en la página
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 5000);
}

  /* ---- hoja de resumen ---- */
  const anios = [...new Set(registro.map(t => String(t.fecha_visita || '').slice(0, 4)).filter(a => a.length === 4))].sort();
  const porAnio = anios.map(a => {
    const l = registro.filter(t => String(t.fecha_visita || '').slice(0, 4) === a);
    const suma = f => l.filter(f).reduce((x, t) => x + (Number(t.precio_sin_iva) || 0), 0);
    return [a, l.length,
      l.filter(t => (t.tipo_pedido || '').startsWith('Garantía')).length,
      l.filter(t => t.estado === 'CUMPLIDO').length,
      new Set(l.map(t => t.n_serie).filter(Boolean)).size,
      Math.round(l.reduce((x, t) => x + (Number(t.horas_mo) || 0), 0) * 10) / 10,
      Math.round(suma(() => true)),
      Math.round(suma(t => t.cobrado === 'SI')),
      Math.round(suma(t => t.cobrado === 'NO'))];
  });

  const tecnicos = s.tecnicos.map(tc => {
    const l = registro.filter(t => (t.tecnicos || '').split(' / ').includes(tc.nombre));
    return [tc.nombre, tc.activo ? 'SI' : 'NO', l.length,
      Math.round(l.reduce((x, t) => x + (Number(t.horas_mo) || 0), 0) * 10) / 10,
      l.length ? (l.slice().sort((a, b) => String(b.fecha_visita || '').localeCompare(String(a.fecha_visita || '')))[0].fecha_visita
        ? { f: l.slice().sort((a, b) => String(b.fecha_visita || '').localeCompare(String(a.fecha_visita || '')))[0].fecha_visita } : null) : null];
  }).sort((a, b) => b[2] - a[2]);

  const ruta = [];
  s.giras.slice().sort((a, b) => String(b.fecha_desde || '').localeCompare(String(a.fecha_desde || '')))
    .forEach(g => {
      s.trabajos.filter(t => t.gira_id === g.id)
        .sort((a, b) => String(a.fecha_visita || '').localeCompare(String(b.fecha_visita || '')))
        .forEach(t => ruta.push([
          g.n_semana, g.anio, g.zona, nombreTec(g.tecnico_id), nombreTec(g.tecnico2_id), g.vehiculo, g.viaticos,
          t.n_llamada, t.tipo_pedido, t.fecha_instalacion && { f: t.fecha_instalacion }, t.n_serie,
          t.modelo, t.n_paradas, t.motorizacion, t.puerta, t.cliente_nombre, ciudadDe(t),
          provinciaDe(t), direccionDe(t), t.cliente_telefono,
          t.fecha_pedido && { f: t.fecha_pedido }, t.tipo_servicio,
          t.fecha_visita && { f: t.fecha_visita }, t.obs_servicio, t.tecnicos, t.estado,
        ]));
    });

  const cot = Number(s.config.cotizacion_usd) || 0;

  return [
    {
      nombre: 'Resumen',
      columnas: ['Año', 'Trabajos', 'De garantía', 'Cumplidos', 'Equipos atendidos', 'Horas de MO',
        'Facturado sin IVA', 'Cobrado', 'Pendiente de cobro'],
      filas: porAnio.concat([[]]).concat([
        ['TOTALES', registro.length,
          registro.filter(t => (t.tipo_pedido || '').startsWith('Garantía')).length,
          registro.filter(t => t.estado === 'CUMPLIDO').length,
          s.equipos.length,
          Math.round(registro.reduce((x, t) => x + (Number(t.horas_mo) || 0), 0) * 10) / 10,
          Math.round(registro.reduce((x, t) => x + (Number(t.precio_sin_iva) || 0), 0)),
          Math.round(registro.filter(t => t.cobrado === 'SI').reduce((x, t) => x + (Number(t.precio_sin_iva) || 0), 0)),
          Math.round(registro.filter(t => t.cobrado === 'NO').reduce((x, t) => x + (Number(t.precio_sin_iva) || 0), 0))],
        [],
        ['Respaldo generado el', fecha(hoyISO(), 1)],
        ['Cotización del dólar vigente', cot, s.config.mes_cotizacion],
        ['IVA', iva],
        ['Clientes', s.clientes.length],
        ['Equipos', s.equipos.length],
        ['Giras registradas', s.giras.length],
        ['Cumplidos sin cerrar', registro.filter(estaAbierto).length],

/* ---------------------------------------------------------------------
   EXPORTAR LO QUE SE ESTÁ VIENDO
   Baja en Excel exactamente los registros filtrados, con toda la
   información disponible, y una hoja que deja escrito qué filtro se usó
   (para que el informe del mes sea reproducible dentro de seis meses).
   --------------------------------------------------------------------- */
function nombreDeExportacion(f) {
  const partes = [];
  if (f.tipo_pedido) partes.push(f.tipo_pedido);
  else if (f.tipo_servicio) partes.push(f.tipo_servicio);
  if (f.estado) partes.push(f.estado);
  if (f.tecnico) partes.push(f.tecnico);
  if (f.desde || f.hasta) partes.push([f.desde, f.hasta].filter(Boolean).join(' a '));
  else if (f.anio && f.mes) partes.push(MESES[Number(f.mes) - 1] + ' ' + f.anio);
  else if (f.mes) partes.push(MESES[Number(f.mes) - 1]);
  else if (f.anio) partes.push(f.anio);
  const base = partes.length ? partes.join(' - ') : 'todos';
  return ('Registro de service - ' + base).replace(/[\\/:*?"<>|]/g, ' ').slice(0, 90);
}

/** Deja constancia del filtro aplicado, en castellano */
function hojaDelFiltro(f, cantidad) {
  const ROT = {
    texto: 'Búsqueda', estado: 'Estado', tipo_pedido: 'Tipo de pedido',
    tipo_servicio: 'Tipo de servicio', tecnico: 'Técnico', anio: 'Año',
    facturado: 'Facturado', cobrado: 'Cobrado', prioridad: 'Prioridad', cierre: 'Cierre',
  };
  const filas = [['Generado el', momento(new Date().toISOString())],
                 ['Generado por', nombreUsuario()],
                 ['Registros exportados', cantidad]];
  if (f.abiertos) filas.push(['Sólo pendientes', 'SI']);
  Object.keys(ROT).forEach(k => { if (f[k]) filas.push([ROT[k], f[k]]); });
  if (f.mes) filas.push(['Mes', MESES[Number(f.mes) - 1]]);
  if (f.desde || f.hasta) {
    const rot = (FECHAS_FILTRO.find(x => x[0] === f.campoFecha) || [, 'Fecha'])[1];
    filas.push(['Período (' + rot.toLowerCase() + ')',
      (f.desde ? 'desde ' + fecha(f.desde, 1) : '') + (f.hasta ? ' hasta ' + fecha(f.hasta, 1) : '')]);
  }
  if (filas.length === 3) filas.push(['Filtro', 'sin filtros: se exportó todo']);
  return { nombre: 'Cómo se filtró', columnas: ['Dato', 'Valor'], filas };
}

async function exportarTrabajos(filas, filtro, verPlata) {
  if (!filas.length) return toast('No hay registros para exportar con ese filtro', 'error');
  toast(`Armando el Excel con ${filas.length} registros…`);
  try {
    const val = (col, t) => { const v = col[1](t); return v === undefined || v === false ? null : v; };
    const PLATA = ['Precio sin IVA', 'Factura solicitada', 'Fecha de solicitud', 'FACTURADO / Enviado',
      'Fecha Factura', 'Tipo de Factura', 'CUIT - DNI', 'Concepto', 'COBRADO', 'Fecha de Pago',
      'CORREO', 'OBSERVACIONES de Cobranza', 'Cierre'];
    let cols = COLS_REGISTRO.slice();
    // la columna de ciudad y provincia junta, como en la pantalla
    const iCiudad = cols.findIndex(c => c[0] === 'Ciudad');
    if (iCiudad >= 0) cols.splice(iCiudad, 0, ['Ciudad y provincia',
      t => [ciudadDe(t), provinciaDe(t)].filter(Boolean).join(', ')]);
    if (!verPlata) cols = cols.filter(c => !PLATA.includes(c[0]));

    const hojas = [
      { nombre: 'Registro de service',
        columnas: cols.map(c => c[0]),
        filas: filas.map(t => cols.map(c => val(c, t))) },
      hojaDelFiltro(filtro, filas.length),
    ];
    await bajarXlsx(nombreDeExportacion(filtro) + '.xlsx', hojas);
    toast(`Exportados ${filas.length} registros`, 'ok');
  } catch (e) {
    toast('No se pudo exportar: ' + (e.message || e), 'error');
  }
}

/* ---------------------------------------------------------------------
   PLANIFICACIÓN RRHH
   Se descarga desde la Hoja de ruta (la planilla de trabajos imprimible
   de una gira/semana): una planilla aparte, con sólo las columnas que
   hacen falta para organizar quién va a cada trabajo, de las paradas de
   ESA gira -- desde N° Serie hasta Fecha Pedido (el mismo bloque "qué
   hay que hacer y dónde" de COLS_REGISTRO) más el técnico asignado, que
   ahí no entra porque cae más adelante en esa lista. Nada de precios,
   facturación ni cobro: esto es planificación, no plata. Sólo la usan
   Augusto y Mateo (puedePlanificacionRRHH()).
   --------------------------------------------------------------------- */
const COLS_RRHH = [
  ['N° Serie',      t => t.n_serie],
  ['Modelo',        t => t.modelo],
  ['N° Paradas',    t => t.n_paradas],
  ['Motorización',  t => t.motorizacion],
  ['Puerta',        t => t.puerta],
  ['Cliente',       t => t.cliente_nombre],
  ['Ciudad',        t => ciudadDe(t)],
  ['Provincia',     t => provinciaDe(t)],
  ['Dirección',     t => direccionDe(t)],
  ['Teléfono',      t => t.cliente_telefono],
  ['Fecha Pedido',  t => t.fecha_pedido && { f: t.fecha_pedido }],
  ['Técnico',       t => t.tecnicos],
];

function nombrePlanificacionRRHH(gira) {
  const partes = [];
  if (gira.n_semana) partes.push(`Semana ${gira.n_semana}`);
  if (gira.zona) partes.push(gira.zona);
  const base = partes.length ? partes.join(' - ') : 'sin semana';
  return ('Planificación RRHH - ' + base).replace(/[\\/:*?"<>|]/g, ' ').slice(0, 90);
}

/** Deja constancia de a qué gira corresponde la planilla, igual que
    hojaDelFiltro() para las exportaciones de Registro de Service. */
function hojaDeLaGira(gira, cantidad) {
  const filas = [['Generado el', momento(new Date().toISOString())],
                 ['Generado por', nombreUsuario()],
                 ['Registros exportados', cantidad],
                 ['Semana', gira.n_semana || '—'],
                 ['Zona', gira.zona || '—']];
  if (gira.fecha_desde || gira.fecha_hasta) {
    filas.push(['Período', (gira.fecha_desde ? 'desde ' + fecha(gira.fecha_desde, 1) : '')
      + (gira.fecha_hasta ? ' hasta ' + fecha(gira.fecha_hasta, 1) : '')]);
  }
  return { nombre: 'Cómo se armó', columnas: ['Dato', 'Valor'], filas };
}

async function exportarPlanificacionRRHH(filas, gira) {
  if (!filas.length) return toast('Esta gira todavía no tiene trabajos para exportar', 'error');
  toast(`Armando la planilla de Planificación RRHH con ${filas.length} registros…`);
  try {
    const val = (col, t) => { const v = col[1](t); return v === undefined || v === false ? null : v; };
    const hojas = [
      { nombre: 'Planificación RRHH',
        columnas: COLS_RRHH.map(c => c[0]),
        filas: filas.map(t => COLS_RRHH.map(c => val(c, t))) },
      hojaDeLaGira(gira, filas.length),
    ];
    await bajarXlsx(nombrePlanificacionRRHH(gira) + '.xlsx', hojas);
    toast(`Exportados ${filas.length} registros`, 'ok');
  } catch (e) {
    toast('No se pudo exportar: ' + (e.message || e), 'error');
  }
}

async function descargarRespaldo() {
  toast('Generando el respaldo…');

/* Se deja anotado cuándo se bajó el último respaldo y quién lo bajó, para
   que la aplicación pueda avisar cuando pasó demasiado tiempo. Queda en la
   base —así lo ven todos igual— y también en esta computadora, por si la
   base todavía no tiene la columna o no hay internet en ese momento. */
async function anotarRespaldo() {
  const cuando = new Date().toISOString();
  try { localStorage.setItem('ultimo_respaldo', cuando); } catch (e) { /* modo privado */ }
  set({ config: { ...S.config, ultimo_respaldo: cuando, ultimo_respaldo_quien: nombreUsuario() } });
  try {
    await cliente().from('config')
      .update({ ultimo_respaldo: cuando, ultimo_respaldo_quien: nombreUsuario() }).eq('id', 1);
  } catch (e) { /* la base todavía no tiene la columna: alcanza con lo local */ }
}

/** Cuándo fue el último respaldo (de la base o, si no hay, de esta máquina) */
function ultimoRespaldo() {
  const enBase = S.config && S.config.ultimo_respaldo;
  let local = null;
  try { local = localStorage.getItem('ultimo_respaldo'); } catch (e) { /* modo privado */ }
  const cual = [enBase, local].filter(Boolean).sort().pop() || null;
  if (!cual) return { cuando: null, dias: null, quien: null };
  const dias = Math.floor((Date.now() - new Date(cual)) / 86400000);
  return { cuando: cual, dias, quien: (S.config && S.config.ultimo_respaldo_quien) || null };
}

const Et = ({ txt, mapa, color }) => txt

/** Marca de cierre administrativo: sólo tiene sentido en trabajos CUMPLIDOS */
function MarcaCierre({ t }) {
  const c = cierreQueCorresponde(t);
  if (!c) return html`<span class="mini">—</span>`;
  if (c === 'CERRADO') return html`<span class="et verde">CERRADO</span>`;
  if (c === CIERRE_PENDIENTE_COBRANZA) return html`<span class="et ambar"
    title="Cerrado técnicamente; queda un pago pendiente por cobrar">PENDIENTE COBRANZA</span>`;
  const falta = faltaParaCerrar(t);
  return html`<span class="et alarma" title=${falta.length ? 'Falta ' + falta.join(' y ') : 'Listo para cerrar'}>
    ⚠ ABIERTO</span>`;
}

/* ---------------------------------------------------------------------
   REFERENCIAS: qué significa cada color y cada etiqueta del Registro de
   Service. El texto de cada estado, facturación y cobro sale directo del
   catálogo (el mismo que se administra en Listas y precios), así que si
   se corrige la descripción de un estado ahí, esta pantalla se actualiza
   sola. El color del borde de la fila no está en ningún catálogo, así
   que va escrito a mano acá.
   --------------------------------------------------------------------- */
function Leyenda({ alCerrar }) {
  const Swatch = v => html`<span style="display:inline-block;width:14px;height:14px;border-radius:3px;
    background:var(--${v});flex:none;margin-top:3px"></span>`;
  const Fila = (marca, texto, det) => html`<div class="fila" style="align-items:flex-start;gap:10px;margin-bottom:8px">
    ${marca}<div>${texto ? html`<div>${texto}</div>` : ''}${det ? html`<div class="mini">${det}</div>` : ''}</div>
  </div>`;

  const TONOS = [
    ['ok', 'Listo', 'Cumplido y cerrado: no queda nada pendiente.'],
    ['error', 'Abierto', 'Cumplido pero todavía abierto administrativamente: falta definir la facturación y/o cargar las observaciones del servicio.'],
    ['alerta', 'Pendiente cobranza', 'Cerrado técnicamente para no seguir persiguiéndolo, pero todavía tiene un pago viejo sin cobrar.'],
    ['fila-hacer-b', 'Por hacer', 'Pendiente o programado: todavía no se hizo la visita.'],
    ['violeta', 'A revisar', 'En revisión o a reprogramar.'],

/* Los campos avisan al escribir (onInput) y no al perder el foco: así, si alguien
   escribe y hace clic en un botón, ese primer clic no se pierde. En los números se
   guarda lo tecleado tal cual mientras dura la edición (para poder escribir "1.5"). */
function Txt({ rot, valor, alCambiar, tipo = 'text', area, disabled, placeholder, ancho }) {
  const [crudo, setCrudo] = useState(null);
  const mostrado = crudo !== null ? crudo
    : (valor === null || valor === undefined ? '' : valor);
  const alEscribir = e => {
    const v = e.target.value;
    if (tipo === 'number') {
      setCrudo(v);
      const n = Number(v.replace(',', '.'));
      alCambiar(v === '' || Number.isNaN(n) ? null : n);
    } else {
      alCambiar(v === '' ? null : v);
    }
  };
  const props = {
    value: mostrado, disabled, placeholder,
    onInput: alEscribir, onChange: alEscribir, onBlur: () => setCrudo(null),
  };
  const el = area ? html`<textarea ...${props} rows=${area}></textarea>`
                  : html`<input type=${tipo} ...${props} />`;
  return rot ? html`<${Campo} rot=${rot} ancho=${ancho}>${el}<//>` : el;
}

/* Carga de horas de mano de obra con horas enteras + minutos predefinidos
   (00 / 15 / 30 / 45), en vez de tener que escribir el número decimal a
   mano. Por dentro sigue siendo el mismo campo de siempre (horas_mo, un
   número con la fracción de hora): acá sólo se decompone para cargarlo y
   se vuelve a componer al elegir. */
function HorasMin({ rot, valor, alCambiar, disabled }) {
  const totalMin = Math.round((Number(valor) || 0) * 60);
  const horas = Math.floor(totalMin / 60);
  const minCrudo = totalMin % 60;
  // se redondea a los 15' más cercanos, sólo para elegir el desplegable
  const minutos = [0, 15, 30, 45].reduce((a, b) =>
    Math.abs(b - minCrudo) < Math.abs(a - minCrudo) ? b : a, 0);
  const disparar = (h, m) => {
    const n = (Number(h) || 0) + (Number(m) || 0) / 60;
    alCambiar(n ? Math.round(n * 100) / 100 : null);
  };
  return html`<${Campo} rot=${rot}>
    <div class="fila" style="gap:6px;flex-wrap:nowrap">
      <input type="number" min="0" step="1" style="width:64px" value=${valor ? horas : ''}
        placeholder="0" disabled=${disabled}
        onInput=${e => disparar(e.target.value, minutos)} />
      <span class="mini">h</span>
      <select style="width:78px" disabled=${disabled} value=${minutos}
        onChange=${e => disparar(horas, e.target.value)}>
        ${[0, 15, 30, 45].map(m => html`<option value=${m}>${String(m).padStart(2, '0')} min</option>`)}
      </select>
    </div>
  <//>`;
}

/** Buscador con sugerencias (clientes, equipos, etc.) */
function Autocompletar({ rot, valor, lista, textoDe, alElegir, placeholder, permitirNuevo, deshabilitado }) {
  const [txt, setTxt] = useState('');
  const [abierto, setAbierto] = useState(false);
  const [idx, setIdx] = useState(0);
  const actual = valor ? textoDe(valor) : '';
  const filtro = sinAcentos(txt);
  const res = useMemo(() => !abierto ? [] : lista
    .filter(x => !filtro || sinAcentos(textoDe(x)).includes(filtro))
    .slice(0, 40), [filtro, abierto, lista]);
  return html`<${Campo} rot=${rot}>
    <div class="buscador">
      <input value=${abierto ? txt : actual} placeholder=${placeholder || 'Buscar…'} disabled=${deshabilitado}
        onFocus=${() => { if (deshabilitado) return; setTxt(''); setAbierto(true); setIdx(0); }}
        onBlur=${() => setTimeout(() => setAbierto(false), 180)}
        onInput=${e => { setTxt(e.target.value); setIdx(0); }}
        onKeyDown=${e => {
          if (e.key === 'ArrowDown') { setIdx(i => Math.min(i + 1, res.length - 1)); e.preventDefault(); }
          if (e.key === 'ArrowUp') { setIdx(i => Math.max(i - 1, 0)); e.preventDefault(); }
          if (e.key === 'Enter' && res[idx]) { alElegir(res[idx]); setAbierto(false); e.preventDefault(); }
          if (e.key === 'Escape') setAbierto(false);
        }} />
      ${abierto && html`<div class="sugerencias">
        ${valor && html`<div onMouseDown=${() => alElegir(null)}><i>— quitar —</i></div>`}
        ${res.map((x, i) => html`<div class=${i === idx ? 'act' : ''}
            onMouseDown=${() => { alElegir(x); setAbierto(false); }}>${textoDe(x)}</div>`)}
        ${!res.length && html`<div class="mini" style="padding:8px">
          Sin resultados${permitirNuevo ? ' — se creará al guardar' : ''}</div>`}
      </div>`}
    </div>
  <//>`;
}

/** Encabezado de columna ordenable */
function Th({ campo, rot, orden, setOrden, clase, ancho }) {

    onClick=${() => setOrden({ campo, asc: act ? !orden.asc : false })}>
    ${rot}${act ? (orden.asc ? ' ▲' : ' ▼') : ''}</th>`;
}

function ordenar(filas, orden) {
  const { campo, asc } = orden;
  return filas.slice().sort((a, b) => {
    let x = a[campo], y = b[campo];
    if (x === null || x === undefined || x === '') return 1;
    if (y === null || y === undefined || y === '') return -1;
    if (typeof x === 'number' && typeof y === 'number') return asc ? x - y : y - x;
    x = String(x); y = String(y);
    return asc ? x.localeCompare(y, 'es') : y.localeCompare(x, 'es');
  });
}

/* =====================================================================
   DESPLAZAMIENTO HORIZONTAL
   La planilla tiene más columnas de las que entran en pantalla. Estos
   botones la corren sin tener que usar la barra de abajo ni el mouse.
   ===================================================================== */
function Deslizador({ para }) {
  const [estado, setEstado] = useState({ hay: false, ini: true, fin: false });

  const medir = useCallback(() => {
    const c = para.current;
    if (!c) return;
    const sobra = c.scrollWidth - c.clientWidth;
    setEstado({ hay: sobra > 8, ini: c.scrollLeft <= 4, fin: c.scrollLeft >= sobra - 4 });
  }, [para]);

  useEffect(() => {
    const c = para.current;
    if (!c) return;
    medir();
    c.addEventListener('scroll', medir, { passive: true });
    window.addEventListener('resize', medir);
    const obs = new ResizeObserver(medir); obs.observe(c);
    const t = setTimeout(medir, 400);   // por si la tabla todavía se está dibujando
    return () => {
      c.removeEventListener('scroll', medir);
      window.removeEventListener('resize', medir);
      obs.disconnect(); clearTimeout(t);
    };
  }, [medir]);

  const correr = dir => {
    const c = para.current;
    if (c) c.scrollBy({ left: dir * Math.max(240, c.clientWidth * 0.7), behavior: 'smooth' });
  };
  const alBorde = dir => {
    const c = para.current;
    if (c) c.scrollTo({ left: dir < 0 ? 0 : c.scrollWidth, behavior: 'smooth' });
  };

  if (!estado.hay) return null;
  return html`<div class="deslizador no-imprimir">
    <button class="btn sec chico" disabled=${estado.ini} title="Volver al principio"
      onClick=${() => alBorde(-1)}>⇤</button>
    <button class="btn sec chico" disabled=${estado.ini} title="Correr a la izquierda"
      onClick=${() => correr(-1)}>◀</button>
    <span class="mini">columnas</span>
    <button class="btn sec chico" disabled=${estado.fin} title="Correr a la derecha"
      onClick=${() => correr(1)}>▶</button>
    <button class="btn sec chico" disabled=${estado.fin} title="Ir a la última columna"
      onClick=${() => alBorde(1)}>⇥</button>
  </div>`;
}

const FILTRO_VACIO = {
  texto: '', estado: '', tipo_pedido: '', tipo_servicio: '', tecnico: '',
  anio: '', mes: '', desde: '', hasta: '', campoFecha: 'fecha_visita',
  facturado: '', cobrado: '', abiertos: false, prioridad: '', cierre: '',
};
/* Qué fecha se usa para filtrar por período */
const FECHAS_FILTRO = [
  ['fecha_visita', 'Fecha de visita'],
  ['fecha_pedido', 'Fecha del pedido'],
  ['fecha_factura', 'Fecha de factura'],
  ['fecha_pago', 'Fecha de pago'],
];
/** La fecha con la que se filtra: la elegida y, si está vacía, la que haya */
function fechaDe(r, campo) {
  const v = r[campo || 'fecha_visita'];
  if (v) return String(v).slice(0, 10);
  if (!campo || campo === 'fecha_visita') return String(r.fecha_visita || r.fecha_pedido || '').slice(0, 10);
  return '';
}
function filtrar(trabajos, f) {
  const t = sinAcentos(f.texto).trim();
  const palabras = t ? t.split(/\s+/) : [];
  return trabajos.filter(r => {
    if (f.abiertos && !ABIERTOS.includes(r.estado)) return false;
    if (f.estado && r.estado !== f.estado) return false;
    if (f.cierre && cierreQueCorresponde(r) !== f.cierre) return false;
    if (f.prioridad && r.prioridad !== f.prioridad) return false;
    if (f.tipo_pedido && r.tipo_pedido !== f.tipo_pedido) return false;
    if (f.tipo_servicio && r.tipo_servicio !== f.tipo_servicio) return false;
    if (f.facturado && r.facturado !== f.facturado) return false;
    if (f.cobrado && r.cobrado !== f.cobrado) return false;
    if (f.tecnico && !(r.tecnicos || '').includes(f.tecnico)) return false;
    if (f.anio || f.mes || f.desde || f.hasta) {
      const d = fechaDe(r, f.campoFecha);
      if (!d) return false;
      if (f.anio && d.slice(0, 4) !== f.anio) return false;
      if (f.mes && d.slice(5, 7) !== f.mes) return false;
      if (f.desde && d < f.desde) return false;
      if (f.hasta && d > f.hasta) return false;
    }
    if (palabras.length) {
      const blob = sinAcentos([r.n_llamada, r.cliente_nombre, r.n_serie, r.modelo, ciudadDe(r),
        r.cliente_telefono, r.concepto,
        provinciaDe(r), direccionDe(r), r.obs_servicio, r.concepto, r.tecnicos,
        r.comentarios, r.obs_cobranza, r.tipo_servicio, r.tipo_pedido].join(' '));
      if (!palabras.every(p => blob.includes(p))) return false;
    }
    return true;
  });
}

function Trabajos() {
  const s = useS();
  const [f, setF] = useState(FILTRO_VACIO);
  const [orden, setOrden] = useState({ campo: 'fecha_visita', asc: false });
  const [tope, setTope] = useState(250);
  const [abierto, setAbierto] = useState(null);   // id del trabajo en ficha
  const [nuevo, setNuevo] = useState(false);
  const [verFechas, setVerFechas] = useState(false);
  const [verLeyenda, setVerLeyenda] = useState(false);
  const caja = useRef(null);            // la caja que se desplaza de costado
  const [borrando, setBorrando] = useState(null);   // trabajo que se está por borrar
  const cambiar = (k, v) => { setF({ ...f, [k]: v }); setTope(250); };

  const filtrados = useMemo(() => ordenar(filtrar(s.trabajos, f), orden), [s.trabajos, f, orden]);

  /* Separar las semanas.
     Cuando la planilla está ordenada por una fecha, se deja un respiro entre
     los trabajos de una semana y los de la siguiente: ayuda muchísimo a leer
     de corrido sin tener que ir mirando las fechas una por una. No se pone
     ningún rótulo, sólo el espacio. Si está ordenada por cliente o por estado
     no tiene sentido, así que ahí no se separa nada. */
  const ordenPorFecha = /^fecha_/.test(orden.campo);
  const corteDeSemana = useMemo(() => {
    if (!ordenPorFecha) return new Set();
    const cortes = new Set();
    const vistos = filtrados.slice(0, tope);
    let anterior = null;
    for (const r of vistos) {
      const d = String(r[orden.campo] || '').slice(0, 10);
      const k = d ? lunesDe(d) : '';
      if (anterior !== null && k !== anterior) cortes.add(r.id);
      anterior = k;
    }
    return cortes;
  }, [filtrados, tope, orden.campo, ordenPorFecha]);

  // si se acaba de crear un trabajo y el filtro activo lo escondería, se limpia el filtro
  // para que aparezca siempre: es el motivo más común de "cargué un trabajo y no lo veo".
  useEffect(() => {
    if (!s.destacado) return;
    const nuevoT = s.trabajos.find(t => String(t.id) === String(s.destacado));
    if (!nuevoT) return;
    if (!filtrar([nuevoT], f).length || !ordenar(filtrar(s.trabajos, f), orden)
        .slice(0, tope).some(t => String(t.id) === String(s.destacado))) {
      setF(FILTRO_VACIO);
      setOrden({ campo: 'fecha_visita', asc: false });

    { rot: 'Semana', val: t => t.n_semana || '' },
    { rot: 'Fecha de visita', val: t => fecha(t.fecha_visita, 1) },
